function milestoneCard(n){
  const cfg=MILESTONES.find(m=>m.days===n);
  if(!cfg) return '';
  const day=totalDays();
  const reached=day>=cfg.days;
  const left=reached?0:cfg.days-day;
  const iconCls = reached ? 'ms-icon' : 'ms-icon ms-icon-locked';
  const lockBadge = reached ? '' : '<span class="ms-lockbadge">🔒</span>';
  const click = reached ? `onclick="runMilestone(${cfg.days})"` : '';
  return `<div class="ms-card ${reached?'on':'locked'}" ${click}>
      <div class="${iconCls}">${cfg.icon}</div>
      ${lockBadge}
      <div class="ms-name">${cfg.days} 天 · ${cfg.icon}${cfg.name}</div>
      <div class="ms-status">${reached?'点击生成总结 📥️':'还需 '+left+' 天'}</div>
    </div>`;
}
function runMilestone(n){
  const days=Object.keys(DB.records).sort();
  const span=days.slice(-n);
  if(span.length<Math.min(n,2)){return $('#milestoneResult').innerHTML='<div class="empty">该里程碑天数不足，暂无足够数据</div>'}
  let total=0,done=0;
  for(const d of span){
    const rec=DB.records[d];
    for(const q of DB.mainQuests){total++;if((rec.mainMarks||{})[q.id]&&(rec.mainMarks[q.id]!=='⚠️'))done++}
  }
  const rate=total?Math.round(done/total*100):0;
  let grade='C',gcol='r',rewardMoney=0,rewardPhysical='无';
  if(rate>=80){grade='S';gcol='g';rewardMoney=DB.rewardRules.r3.money;rewardPhysical=DB.rewardRules.r3.physical;}
  else if(rate>=60){grade='A';gcol='b';rewardMoney=DB.rewardRules.r2.money;rewardPhysical=DB.rewardRules.r2.physical;}
  else if(rate>=40){grade='B';gcol='b';rewardMoney=DB.rewardRules.r1.money;rewardPhysical=DB.rewardRules.r1.physical;}
  if(rewardMoney>0){
    DB.savings+=rewardMoney;
    DB.correctionLog.push({date:todayStr(),action:`里程碑${n}天主线奖励自动发放`,orig:`完成率${rate}%`,new:`+¥${rewardMoney}`});
  }
  const promo=DB.sideQuests.filter(s=>s.count>=10).map(s=>s.name).join('、')||'无';
  const ws=span.map(d=>DB.records[d].weight).filter(v=>v!=null);
  const delta=ws.length>=2?(ws[ws.length-1]-ws[0]):null;
  ensureGiftPool();
  const wTiers=[DB.weightReward.t1,DB.weightReward.t2,DB.weightReward.t3].slice().sort((a,b)=>b.loss-a.loss);
  let weightRewardMsg='无（未达奖励阈值）';
  if(delta!==null){
    const lost=-delta;
    let granted=null;
    for(const t of wTiers){if(lost>=t.loss){granted=t;break}}
    if(granted){
      const moneyMatch=String(granted.gift).match(/¥(\d+)/);
      const add=moneyMatch?parseInt(moneyMatch[1]):0;
      if(add>0){DB.savings+=add}
      weightRewardMsg=`减${lost.toFixed(1)}斤 → ${granted.gift}`;
      DB.correctionLog.push({date:todayStr(),action:`【里程碑${n}天·减重奖励·独立】自动发放`,orig:`减重${lost.toFixed(1)}斤`,new:(add>0?`+¥${add} + `:'')+granted.gift});
    } else {
      weightRewardMsg=`变化${lost.toFixed(1)}斤，未达奖励阈值`;
    }
  }
  const cfg=MILESTONES.find(m=>m.days===n);
  const iconTitle = cfg ? cfg.icon : '🏆';
  const html=`
  <div class="summary-box" style="padding:0;overflow:hidden">
    <div style="background:var(--panel-solid);padding:14px 20px;border-bottom:2px solid var(--gold);font-size:16px;font-weight:700;color:var(--accent)">
      ${iconTitle} ${n} 天里程碑 · ${cfg?cfg.name:n+'天总结'}
    </div>
    <div style="padding:18px">
      <div style="margin-bottom:18px">
        <div style="font-size:13px;color:var(--ink-soft);margin-bottom:6px;font-weight:600">📊 主线完成率（该里程碑窗口内）</div>
        <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap">
          <span style="font-size:36px;font-weight:900;color:var(--ink);font-family:var(--pixel)">${rate}%</span>
          <span class="pill ${gcol}" style="font-size:14px;padding:4px 14px">评级 ${grade}</span>
        </div>
        <div style="margin-top:10px;font-size:14px;color:var(--ink)">💰 里程碑奖励：<strong style="color:var(--gold);font-size:16px">¥${rewardMoney}</strong> + 实物【${rewardPhysical}】<span style="color:var(--good);font-size:12px">（已自动发放）</span></div>
      </div>
      <div style="background:rgb(var(--accent-rgb) / .06);border:1.5px solid var(--accent);border-radius:10px;padding:14px;margin-bottom:16px">
        <div style="font-size:13px;color:var(--ink-soft);margin-bottom:8px;font-weight:600">🌳 进阶进度（${DB.mainQuests.length} 个主线）</div>
        <div style="font-size:13px;color:var(--ink);line-height:1.8">
          ${DB.mainQuests.map(q=>{
            const iconMap={M1:'🌙',M2:'✍️',M3:'⚖️',M4:'🧠',M5:'🧴',M6:'🦷'};
            return `${iconMap[q.id]||'🔹'} ${q.name} <strong>Lv.${((DB.progression[q.id]||{}).level||1)}</strong>`;
          }).join('<br>')}
        </div>
        <div style="font-size:13px;color:var(--ink-soft);margin-top:10px;padding-top:8px;border-top:1px dashed var(--line)">🔄 支线晋升：<strong>${promo}</strong></div>
      </div>
      <div style="background:rgb(var(--warn-rgb) / .05);border:1.5px solid var(--warn);border-radius:10px;padding:14px;margin-bottom:16px">

        <div style="font-size:14px;color:var(--ink);margin-bottom:6px">${ws[0]||'—'} <span style="color:var(--ink-soft)">→</span> ${ws[ws.length-1]||'—'} <span style="font-size:13px;color:var(--ink-soft);margin-left:4px">(${delta!==null?(delta>0?'+':'')+delta.toFixed(1):'—'})</span></div>
        <div style="font-size:13px;color:var(--warn);margin-top:8px;padding-top:8px;border-top:1px dashed var(--line)">🎁 <strong>减重奖励（独立分区）</strong>：${weightRewardMsg}</div>
      </div>
      <div style="background:var(--ink);color:#fff;border-radius:10px;padding:14px;text-align:center;font-size:15px">🐷 存钱余额：<strong style="font-size:20px;color:var(--gold)">¥${DB.savings}</strong></div>
    </div>
  </div>`;
  $('#milestoneResult').innerHTML=html;
  DB.archive.push({date:todayStr(),type:'milestone'+n,content:html});
  save();refreshStats();

function sendLetter(){
  const bodyEl=$('#letterBody'), dateEl=$('#letterDate');
  const body=bodyEl?bodyEl.value.trim():'', date=dateEl?dateEl.value:'';
  if(!body||!date){ alert('写点内容并选个日期吧'); return; }
  if(date<todayStr()){ alert('送达日期不能选过去，写给未来的自己嘛 💐'); if(dateEl)dateEl.focus(); return; }
  // 读值、push、存档 —— 全程不触碰输入框，避免重绘导致内容丢失
  DB.letters.push({id:Date.now(),body,date,sent:false,createdAt:todayStr()});
  try{ save(); }catch(e){ alert('存档失败：可能是浏览器隐私模式或存储空间已满'); return; }
  // 成功后仅清空输入 + 局部刷新列表（不再整块重绘）
  if(bodyEl)bodyEl.value='';
  if(dateEl){ const d=new Date();d.setDate(d.getDate()+1); dateEl.value=dateKey(d); }
  renderLetterList();
  // 明确成功反馈
  const btn=$('#sealBtn'); if(btn){ btn.textContent='✓ 已封存'; btn.style.background='var(--good)';
    setTimeout(()=>{ if(btn){btn.textContent='封存';btn.style.background='';} },900); }
}

function renderLetterList(){
  const box=$('#letterList'); if(!box)return;
  const today=todayStr();
  // 送达日期从近到远；未送达在前
  const all=[...DB.letters].sort((a,b)=>(a.date>b.date?1:-1));
  const pending=all.filter(l=>l.date>today);   // 未送达：锁定
  const arrived=all.filter(l=>l.date<=today);  // 已送达：解锁

  const renderCard=(l,locked)=>{
    const daysLeft=diffDays(today,l.date);
    // 未送达：只显示密封信封占位，完全不暴露内容（时间胶囊的神秘感）
    if(locked){
      return `<div class="card letter-sealed" style="text-align:center;padding:24px 18px;cursor:pointer" data-preview="${l.id}">
        <div style="font-size:42px;margin-bottom:10px;animation:floaty 3s ease-in-out infinite">💌</div>
        <div style="font-size:14px;font-weight:700;color:var(--ink)">一封写给未来的信</div>
        <div style="font-size:12px;color:var(--ink-soft);margin-top:6px">
          📅 送达日期：${esc(l.date)}
        </div>
        <div style="font-size:12px;color:var(--accent);margin-top:4px">
          🔒 距离揭晓还有 <b>${daysLeft}</b> 天
        </div>
        <div style="font-size:11px;color:var(--ink-soft);margin-top:10px;padding-top:8px;border-top:1px dashed var(--line)">
          「内容已封存，送达前不可查看」<br>
          封存于 ${esc(l.createdAt||'-')}
        </div>
      </div>`;
    }
    // 已送达：完整展示内容
    return `<div class="card letter-opened">
      <div style="font-size:12px;color:var(--ink-soft)">
        📅 送达 ${esc(l.date)}
        <span class="pill g">已送达 · 已解锁</span>
        <span style="float:right;color:var(--accent)">封存于 ${esc(l.createdAt||'-')}</span>
      </div>
      <div style="margin-top:10px;padding:12px;background:rgb(var(--gold-rgb) / .06);border-radius:8px;border-left:3px solid var(--gold)">
        <div style="font-size:11px;color:var(--gold);font-weight:600;margin-bottom:6px">🕰️ 来自过去的自己 · ${esc(l.createdAt||'-')}</div>
        <div style="white-space:pre-wrap;font-size:14px;line-height:1.7">${esc(l.body)}</div>
      </div>
      <button class="mini-btn danger" data-del="${l.id}" style="margin-top:10px">删除</button>
    </div>`;
  };

  let html='';
  html+=`<div class="letter-sec-title">📬 未送达（${pending.length}）</div>`;
  html+=pending.length?pending.map(l=>renderCard(l,true)).join(''):'<div class="letter-empty">📨 暂无未送达的信，写一封给未来的自己吧 🌱</div>';
  html+=`<div class="letter-sec-title">📭 已送达（${arrived.length}）</div>`;
  html+=arrived.length?arrived.map(l=>renderCard(l,false)).join(''):'<div class="letter-empty">还没有已送达的信，等待时间开启 🕰️</div>';

  box.innerHTML=html;

  // 事件委托：删除按钮 + 密封信件点击预览（不用内联 onclick，避免重绘丢失）
  box.querySelectorAll('button[data-del]').forEach(btn=>{
    btn.onclick=()=>{
      const id=Number(btn.getAttribute('data-del'));
      const letter=DB.letters.find(l=>l.id===id);
      if(!letter)return;
      const ok=confirm(
        '⚠️ 确定要删除这封信吗？\n\n'+
        '送达日期：'+letter.date+'\n'+
        '内容预览：'+(letter.body||'').slice(0,40)+(letter.body.length>40?'…':'')+'\n\n'+
        '此操作无法撤销。'
      );
      if(ok){ delLetter(id); }
    };
  });

  // 点击密封的信 → 弹出"时间未到"的神秘提示
  box.querySelectorAll('.letter-sealed').forEach(el=>{
    el.onclick=()=>{
      const id=Number(el.getAttribute('data-preview'));
      const letter=DB.letters.find(l=>l.id===id);
      if(!letter)return;
      const daysLeft=diffDays(todayStr(),letter.date);
      if(daysLeft<=0){
        // 刚好到期了 → 刷新列表自动解锁
        renderLetterList();
        return;
      }
      // 摇晃动画 + 神秘提示
      el.style.animation='shakeLetter .5s';
      setTimeout(()=>{el.style.animation=''},500);
      alert('🔒 这封信还未到送达日期\n\n📅 送达：'+letter.date+'\n⏳ 还有 '+daysLeft+' 天\n\n耐心等待时间的揭晓吧 🌱');
    };
  });
}

function delLetter(id){
  DB.letters=DB.letters.filter(l=>l.id!==id);
  save();renderLetterList();
}

// 计算两个 YYYY-MM-DD 之间的天数差（date - today），供倒计时使用
function diffDays(todayStr,targetStr){
  const t=new Date(todayStr+'T00:00:00');
  const d=new Date(targetStr+'T00:00:00');
  const ms=Math.ceil((d-t)/86400000);
  return ms<0?0:ms;
}

function addChallenge(){
  const now=new Date();const monthKey=`${now.getFullYear()}-${now.getMonth()+1}`;
  let u=DB.challengeUsage.find(x=>x.month===monthKey);
  if(!u){u={month:monthKey,count:0};DB.challengeUsage.push(u)}
  if(u.count>=2)return alert('本月已达上限（2次），下月再来');
  const name=$('#chName').value.trim()||'挑战';
  const target=parseInt($('#chTarget').value)||7;
  const reward=parseInt($('#chReward').value)||20;
  DB.challenges.push({name,target,reward,days:[],done:false,rewardGiven:false,started:todayStr()});
  u.count++;save();render();
}
function challengeDay(idx,di){
  const c=DB.challenges[idx];if(c.done)return;
  const start=new Date(c.started),now=new Date(todayStr());
  const dayIdx=Math.floor((now-start)/86400000);
  if(dayIdx<0||dayIdx>=c.target)return alert('不在挑战窗口内');
  c.days[dayIdx]=true;
  const done=dayIdx+1;
  if(done>=c.target){
    c.done=true;if(!c.rewardGiven){DB.savings+=c.reward;c.rewardGiven=true}
  }
  save();render();
}

/* ════════════════════════════════════════════════════════════════
   🎨 主题色系统 · 全局联动
   设计依据：
   · Material Design 3「Dynamic Color 动态配色」—— 由 1 个种子色推导完整 tonal palette
   · Apple HIG / iOS 系统色 —— 前景与背景对比度满足无障碍阅读（正文 ≥ 4.5:1）
   · 层次规则：deep(实底·标题) > 主色 > l1(常规边框) > l2(大面积边框·调浅两档)
   改动任意主色 → 按钮 / 次级按钮 / 链接 / 图标 / 边框 / 背景 / 阴影 全部跟着变
   ════════════════════════════════════════════════════════════════ */
function _hex2rgb(h){h=String(h||'').replace('#','').trim();if(h.length===3)h=h[0]+h[0]+h[1]+h[1]+h[2]+h[2];var n=parseInt(h,16);if(isNaN(n))return[185,167,224];return[(n>>16)&255,(n>>8)&255,n&255]}
function _rgb2hex(r,g,b){return '#'+[r,g,b].map(function(v){return Math.round(Math.max(0,Math.min(255,v))).toString(16).padStart(2,'0')}).join('')}
function _rgb2hsl(r,g,b){r/=255;g/=255;b/=255;var mx=Math.max(r,g,b),mn=Math.min(r,g,b),h=0,s=0,l=(mx+mn)/2,d=mx-mn;
  if(d){s=l>.5?d/(2-mx-mn):d/(mx+mn);if(mx===r)h=((g-b)/d+(g<b?6:0));else if(mx===g)h=(b-r)/d+2;else h=(r-g)/d+4;h*=60}return[h,s,l]}
function _hsl2rgb(h,s,l){h=(((h%360)+360)%360)/360;function f(n){var k=(n+h*12)%12,a=s*Math.min(l,1-l);return l-a*Math.max(-1,Math.min(k-3,Math.min(9-k,1)))}return[f(0)*255,f(8)*255,f(4)*255]}
function _hsl(h,s,l,alpha){var c=_hsl2rgb(h,s,l);return alpha==null?_rgb2hex(c[0],c[1],c[2]):'rgba('+Math.round(c[0])+','+Math.round(c[1])+','+Math.round(c[2])+','+alpha+')'}
function _lum(hex){var c=_hex2rgb(hex).map(function(v){v/=255;return v<=0.03928?v/12.92:Math.pow((v+0.055)/1.055,2.4)});return 0.2126*c[0]+0.7152*c[1]+0.0722*c[2]}
function _contrast(a,b){var l1=_lum(a),l2=_lum(b);return (Math.max(l1,l2)+0.05)/(Math.min(l1,l2)+0.05)}
function _clamp(v,a,b){return Math.max(a,Math.min(b,v))}
/* canvas 不支持 CSS 变量，用计算样式反查 rgb 分量 */
function _cv(name,a){
  var fb={accent:'185,167,224',accent2:'230,166,205',gold:'214,165,103',good:'130,184,153',warn:'212,145,140',ink:'74,68,88'};
  try{var v=getComputedStyle(document.documentElement).getPropertyValue('--'+name+'-rgb').trim();
    if(v)return 'rgba('+v.split(/\s+/).join(',')+','+a+')';}catch(e){}
  return 'rgba('+(fb[name]||fb.accent)+','+a+')';
}

const THEME_PRESETS={

    accent:'#b9a7e0',accentDeep:'#9d86c4',accentL1:'#d6cbed',accentL2:'#ebe5f6',
    accent2:'#e6a6cd',accent2Deep:'#d98ab5',accent2L1:'#f0cbe0',accent2L2:'#f9eaf2',
    gold:'#d6a567',goldDeep:'#c08f4e',good:'#82b899',goodDeep:'#5f9b7a',warn:'#d4918c',warnDeep:'#c07d77',
    bg:['#f4e1eb','#dfeffb','#e8d9f7','#eef4fb','#e0feff'],
    tint:['#dbc1f5','#f4bddb','#9fcef4','#9efcff'],
    ink:'#4a4458',inkSoft:'#8a8398',line:'#ecdcf2',lineSoft:'#f3edf8',link:'#8a6fc0'}},
  morandi:{n:'莫兰迪',c:['#c9d6df','#e4e9ee']},
  sage:   {n:'鼠尾草',c:['#a8c4b2','#dcebe2']},
  lilac:  {n:'淡紫',  c:['#dcd8e4','#e8e4ec']},
  ocean:  {n:'海雾',  c:['#a9c8d8','#d7e8f0']},
  sunrise:{n:'暖阳',  c:['#f0c9a8','#f7ddc6']}
};

/* —— 由 1~2 个种子色推导完整色彩系统 —— */
function buildPalette(seed1,seed2,fix){
  var A=_rgb2hsl.apply(null,_hex2rgb(seed1));
  var B=_rgb2hsl.apply(null,_hex2rgb(seed2||seed1));
  /* 中性灰种子（饱和度极低）保持中性，不强行染色 */
  var _gray1=A[1]<.12, _gray2=B[1]<.12;
  var H=A[0],H2=B[0],
      S=_gray1?_clamp(A[1],.02,.10):_clamp(A[1],.30,.60),
      S2=_gray2?_clamp(B[1],.02,.10):_clamp(B[1],.30,.60),
      LA=_clamp(A[2],.56,.66),LB=_clamp(B[2],.58,.70);
  /* 灰度模式下，派生色阶同样保持中性（不再强行拉高饱和度） */
  var Sd=_gray1?_clamp(S+.04,.02,.14):_clamp(S+.06,.32,.66);   /* deep 档 */
  var Sl=_gray1?_clamp(S+.08,.02,.18):_clamp(S+.12,.42,.75);   /* link 档 */
  var S2d=_gray2?_clamp(S2+.04,.02,.14):_clamp(S2+.06,.32,.66);
  var p={};
  p.accent=_hsl(H,S,LA);
  p.accentDeep=_hsl(H,Sd,_clamp(LA-.17,.34,.52));
  p.accentL1=_hsl(H,S,_clamp(LA+.10,.60,.82));
  p.accentL2=_hsl(H,S*.92,_clamp(LA+.22,.74,.93));
  p.accent2=_hsl(H2,S2,LB);
  p.accent2Deep=_hsl(H2,S2d,_clamp(LB-.16,.36,.54));
  p.accent2L1=_hsl(H2,S2,_clamp(LB+.09,.62,.84));
  p.accent2L2=_hsl(H2,S2*.92,_clamp(LB+.20,.76,.94));
  /* 文字链接：逐档压暗到对比度 ≥ 4.5:1，保证无障碍阅读 */
  p.link=_hsl(H,Sl,.44);
  var l=.44; while(_contrast(p.link,'#ffffff')<4.5&&l>.22){l-=.02;p.link=_hsl(H,Sl,l)}
  /* 语义色：保留色相语义（金/绿/红），仅饱和度明度跟随主题，维持家族感
     —— 灰度主题下语义色仍需可辨（好=绿/警=红），故不参与去饱和 */
  p.gold=_hsl(36,_clamp(S+.05,.34,.50),.60); p.goldDeep=_hsl(36,_clamp(S+.08,.36,.54),.44);
  p.good=_hsl(148,_clamp(S*.85,.24,.40),.58); p.goodDeep=_hsl(148,_clamp(S*.9,.26,.44),.42);
  p.warn=_hsl(6,_clamp(S+.02,.28,.46),.66);   p.warnDeep=_hsl(6,_clamp(S+.06,.30,.50),.48);
  /* 背景：5 段极浅色 + 4 团氛围光斑，全部跟随主色相 */
  p.bg=_gray1?[_hsl(H,.05,.93),_hsl(H+34,.06,.91),_hsl(H2,.05,.92),_hsl(H-22,.04,.95),_hsl(H2+26,.06,.94)]
             :[_hsl(H,.52,.93),_hsl(H+34,.58,.91),_hsl(H2,.52,.92),_hsl(H-22,.44,.95),_hsl(H2+26,.58,.94)];
  p.tint=_gray1?[_hsl(H,.07,.86),_hsl(H2,.07,.87),_hsl(H+38,.08,.86),_hsl(H2+30,.07,.90)]
              :[_hsl(H,.60,.86),_hsl(H2,.58,.87),_hsl(H+38,.62,.86),_hsl(H2+30,.58,.90)];
  p.ink=_hsl(H,_gray1?.06:.16,.27); p.inkSoft=_hsl(H,_gray1?.05:.13,.53);
  p.line=_hsl(H,_gray1?.10:.42,.90); p.lineSoft=_hsl(H,_gray1?.08:.38,.95);
  /* fix：预设可逐项覆盖，确保默认主题观感与线上完全一致 */
  if(fix){for(var k in fix){if(fix[k]!==undefined&&fix[k]!==null)p[k]=fix[k]}}
  /* —— 无障碍：主按钮表面与标签文字至少 3:1（WCAG 1.4.11 / 大号粗体适用）——
     不达标就沿"拉开差距"的方向微调明度，达标即停（aurora 预设 3.16:1，本就合格） */
  var dark='#2b2733', light='#ffffff';
  function pair(bg){return _contrast(bg,light)>=_contrast(bg,dark)?[light,_contrast(bg,light)]:[dark,_contrast(bg,dark)];}
  var guard=0, pr=pair(p.accentDeep);
  while(pr[1]<3.0 && guard<40){
    var hs=_rgb2hsl.apply(null,_hex2rgb(p.accentDeep));
    var towardsLight=_contrast(p.accentDeep,dark)>_contrast(p.accentDeep,light);
    p.accentDeep=_hsl(hs[0],hs[1],_clamp(hs[2]+(towardsLight?0.012:-0.012),0.06,0.96));
    pr=pair(p.accentDeep); guard++;
  }

  return p;
}

/* ---- 导出 / 导入：完整备份（个人数据 + 全部自定义配置）----
   导出的每一份文件都自带 _meta（版本、导出时间、字段清单），
   导入时经过 validateImport 严格校验 + migrateDB 迁移，
   并通过"预览 → 确认 → 合并"三步，杜绝静默失败。 */
function exportDB(){
  save(); // 先落盘，确保导出的是最新数据
  const payload=JSON.parse(JSON.stringify(DB)); // 深拷贝，避免污染运行时
  payload._meta={
    schemaVersion:DB_VERSION,
    exportedAt:new Date().toISOString(),
    appName:'游戏人生 · Life is a Game',
    // 字段完整性清单：导入时逐项核对，缺哪个一目了然
    fields:Object.keys(payload),
  };
  const b=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(b);
  a.download=`gamelife_${DB.playerName||'me'}_${todayStr()}.json`;a.click();
}

// 校验导入文件：返回 {ok, data, warn[]}；不合法则 ok=false
function validateImport(obj){
  const warn=[];
  if(!obj||typeof obj!=='object') return {ok:false,warn:['文件不是有效的 JSON 对象']};
  // —— 兼容新旧版：缺 version 也尽量救回（不再因 version<5 整体回退）——
  const v=Number(obj.version)||Number(obj.schemaVersion)||0;
  if(v>9) warn.push(`文件版本(${v})高于当前应用(9)，部分新字段可能无法识别，建议先更新应用`);
  if(v<5) warn.push(`文件较旧(version ${v})，将尝试兼容迁移；若任务名异常请重新导出`);
  // —— 关键字段完整性检查：这 8 项是"个人配置"的核心，缺一即视为损坏 ——
  const required=['mainQuests','sideQuests','extraFields','records','playerName','theme','progression','achievementBook'];
  const missing=required.filter(k=>obj[k]===undefined);
  // —— 关键字段缺失 = 文件损坏/不完整，硬拦截（ok:false），绝不静默覆盖原数据 ——
  if(missing.length) return {ok:false,warn:[`缺少关键字段：${missing.join('、')}，文件可能导出不完整或损坏`]};
  // —— 类型校验：防止导入后渲染崩溃 ——
  if(obj.mainQuests&&!Array.isArray(obj.mainQuests)) return {ok:false,warn:['mainQuests 应为数组']};
  if(obj.extraFields&&!Array.isArray(obj.extraFields)) return {ok:false,warn:['extraFields 应为数组']};
  if(obj.records&&typeof obj.records!=='object') return {ok:false,warn:['records 格式错误']};
  return {ok:true,data:obj,warn};
}

function importDB(e){
  const f=e.target.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=ev=>{
    let parsed;
    try{ parsed=JSON.parse(ev.target.result); }catch(err){ alert('❌ 文件格式错误：不是合法的 JSON\n'+err.message); return; }
    const {ok,data,warn}=validateImport(parsed);
    if(!ok){
      alert('❌ 导入校验失败，已中止（原数据未改动）：\n\n'+warn.join('\n'));
      e.target.value='';return;
    }
    if(warn.length){
      console.warn('[import] 警告：',warn.join('; ')); // 控制台留痕，不阻断
    }
    // —— 预览确认：让用户明确知道"要覆盖什么"，避免误操作丢数据 ——
    const stats=`任务名(主线${data.mainQuests.length}/支线${data.sideQuests.length}/碎片${data.extraFields.length})、记录${Object.keys(data.records||{}).length}天、余额¥${(data.savings||0)}`;
    if(!confirm(`确认用这份备份覆盖当前数据吗？\n\n将导入：${stats}\n\n⚠️ 此操作不可撤销，当前未保存的改动会丢失。`)){ e.target.value='';return; }
    // —— 迁移 → 写回 → 刷新，三步一气呵成 ——
    try{
      DB=migrateDB(data);          // 补齐缺失字段、升级旧数据
      DB.version=9;                // 强制标为最新，防止 load() 二次回退
      save();
      alert('✅ 导入成功！即将刷新页面。\n\n已恢复：'+stats);
      location.reload();
    }catch(err){
      alert('❌ 导入过程中出错（原数据未改动）：\n'+err.message);
      console.error(err);
    }
  };
  r.onerror=()=>alert('❌ 读取文件失败，请重试');
  r.readAsText(f); // 用 readAsText 而非 readAsDataURL，避免二进制误读
}

  function drawCover(){
    const c=$('#coverSea');if(!c)return;
    const ctx=c.getContext('2d');if(!ctx)return;
    const W=c.width=window.innerWidth||800, H=c.height=window.innerHeight||600;
    const g=ctx.createLinearGradient(0,0,0,H);
    g.addColorStop(0,'#1f3a5f');g.addColorStop(.4,'#2f5d8f');g.addColorStop(.75,'#4a86b5');g.addColorStop(1,'#cfe6ec');
    ctx.fillStyle=g;ctx.fillRect(0,0,W,H);

    // —— 礁石群(左下角，放大3倍：主礁 scale 3.0 + 陪衬) ——
    function reef(x,y,scale){
      ctx.save();ctx.translate(x,y);ctx.scale(scale,scale);ctx.fillStyle='#3a6b8a';
      ctx.fillRect(0,12,40,8);ctx.fillRect(4,6,32,8);ctx.fillRect(10,0,20,8);
      ctx.fillStyle='#5a8ba8';ctx.fillRect(10,0,20,3);ctx.restore();
    }
    reef(W*.05, H*.80, 3.0);reef(W*.22, H*.90, 1.4);reef(W*.005, H*.93, .9);

    // —— 像素帆船(右下角，原始尺寸 scale 1.0) ——
    function ship(x,y,scale){
      ctx.save();ctx.translate(x,y);ctx.scale(scale,scale);
      ctx.fillStyle='#8B5A2B';ctx.fillRect(8,14,44,6);ctx.fillRect(8,20,44,4);
      ctx.fillStyle='#C0A16B';ctx.fillRect(8,10,44,6);
      ctx.fillStyle='#fff';ctx.fillRect(28,0,3,16);
      ctx.fillRect(31,2,16,10);ctx.fillRect(31,2,3,10);
      ctx.fillStyle='#c08a7a';ctx.fillRect(31,2,16,3);ctx.restore();
    }
    ship(W*.80, H*.70, 1.0);

    // —— 云朵：复制「最早的云」(3圆弧)，伪随机位置/大小/透明度，每次排布不同 ——
    function cloud(x,y,scale,alpha){
      ctx.save();ctx.translate(x,y);ctx.scale(scale,scale);ctx.fillStyle='rgba(255,255,255,'+alpha+')';
      ctx.beginPath();ctx.arc(0,0,24,0,7);ctx.arc(20,0,20,0,7);ctx.arc(-18,2,18,0,7);ctx.fill();
      ctx.restore();
    }
    var seed=Math.sin(new Date().getDate()*7+new Date().getHours()*3);
    function rnd(){seed=Math.sin(seed*999+1)*10000;return seed-Math.floor(seed);}
    var clouds=[];
    for(var i=0;i<6;i++){clouds.push({x:.08+rnd()*.84, y:.04+rnd()*.20, s:.5+rnd()*.8, a:.15+rnd()*.15});}
    for(var i=0;i<clouds.length;i++){var b=clouds[i];cloud(W*b.x, H*b.y, b.s, b.a);}

    // 海面波光
    ctx.fillStyle='rgba(255,255,255,.25)';
    for(let i=0;i<60;i++){const x=Math.random()*W,y=H*.55+Math.random()*H*.4,w=Math.random()*30+10,h=2;ctx.fillRect(x,y,w,h);}
  }

  redHours:   [1, 5],     // 1~5h 红色（缺觉）
  pinkHours:  [9.5, 18],  // >9.5h 粉色（过多）
  bedBefore: '23:30',     // 入睡不晚于
  wakeStart: '06:00',     // 起床窗口
  wakeEnd:   '08:00',
};
/* ---------- 2. 工具函数（纯函数，便于测试） ---------- */
function hmToMin(hm){ // "23:05" → 分钟数
  if(!hm||typeof hm!=='string') return null;
  const m=/^(\d{1,2}):(\d{2})$/.exec(hm); if(!m) return null;
  return parseInt(m[1],10)*60+parseInt(m[2],10);
}
// 睡眠时长 → 颜色等级（1红 2黄 3绿 4粉）
function sleepColor(hours){
  if(hours==null) return {level:0,key:'none',label:'未记录',color:'var(--line)'};
  if(hours>=SLEEP.pinkHours[0]) return {level:4,key:'pink',label:'睡太多啦',color:'#e6a8c1'};
  if(hours>=SLEEP.idealHours[0]) return {level:3,key:'good',label:'刚刚好',color:'var(--good)'};
  if(hours>=SLEEP.lowHours[0]) return {level:2,key:'low',label:'有点不够',color:'var(--gold)'};
  return {level:1,key:'bad',label:'太少了',color:'var(--warn)'};
}
// 入睡时间评分：23:30 前 = 好
function bedTimeScore(hm){
  const m=hmToMin(hm); if(m==null) return null;
  return m<=hmToMin(SLEEP.bedBefore);
}
// 第二天起床是否在 6~8 点窗口
function wakeOnTime(hm){
  const m=hmToMin(hm); if(m==null) return null;
  const s=hmToMin(SLEEP.wakeStart), e=hmToMin(SLEEP.wakeEnd);
  return m>=s && m<=e;
}

/* ---------- 5. 睡眠记录 + 自动判定早睡/早起 ---------- */
/**
 * 记录睡眠（入睡时间属于「前一天」）
 * 返回 {sleepOk(昨天早睡是否成功), earlySleepDate, todayWake}
 * 规则（用户定义）：
 *  - 当天日期 D 的「早点睡觉」打卡 = 依据 D 当天入睡时间判定（入睡<=23:30 → 成功）
 *    但用户示例：2026-09-02 当前，关联 09-01 的早睡；09-01 入睡 01:05 → 09-01 早睡失败
 *  → 采用「入睡时间所在日期」作为归属日：bedDate = 入睡的日期
 *  - D 日的「早起」= D 当天起床时间是否在 6~8 点
 *  因此：09-01 入睡 01:05 → 归属 09-01 晚（bedDate=09-01），09-01 早睡失败 ✓
 *        09-02 起床 09:20 → 09-02 早起失败 ✓
 */

/**
 * 自动在主线置顶创建「早点睡觉」「早起」两条任务（周期外/周期内固定名，锁定不可删）
 * 判定：
 *   - 早睡(归属 bedDate)：bed <= 23:30 → ✅，否则 ⚠️（失败）
 *   - 早起(归属 wakeDate=入睡次日)：wake 在 06:00~08:00 → ✅，否则 ⚠️
 * 这两条 mark 走特殊 key，让其「计入统计（通过率分母）但不计入金钱结算」
 */
const Q_EARLY='auto_early', Q_RISE='auto_rise';   // 干净可读的 id（不再暴露 __rise_early__）
function ensureSleepQuests(){
  // 迁移：把旧版丑陋内部键（__rise_early__ 等）的打卡记录搬到新 id，避免历史丢失
  const OLD_EARLY=['__early_sleep__','__rise_early__','__early__'], OLD_RISE=['__rise_early__','__rise__'];
  for(const d of Object.keys(DB.records||{})){
    const mm=(DB.records[d]||{}).mainMarks||{};
    for(const o of OLD_EARLY){ if(mm[o]!=null && mm[Q_EARLY]==null){ mm[Q_EARLY]=mm[o]; delete mm[o]; } }
    for(const o of OLD_RISE){  if(mm[o]!=null && mm[Q_RISE]==null){ mm[Q_RISE]=mm[o];  delete mm[o]; } }
  }
  // 在周期外也创建（作息是每天的事），但只在有周期时纳入"今日小结"统计
  let mq=DB.mainQuests.find(q=>q.id===Q_EARLY || q.name==='早点睡觉' || q.name==='早睡');
  if(!mq){
    DB.mainQuests.unshift({id:Q_EARLY,name:'早点睡觉',desc:'23:30 前入睡即成功（根据入睡时间自动判定，不影响赚钱）',locked:true,auto:true});
  } else { mq.auto=true; mq.locked=true; if(mq.id!==Q_EARLY)mq.id=Q_EARLY; }
  let rq=DB.mainQuests.find(q=>q.id===Q_RISE || q.name==='早起');
  if(!rq){
    DB.mainQuests.unshift({id:Q_RISE,name:'早起',desc:'06:00~08:00 起床即成功（根据起床时间自动判定，不影响赚钱）',locked:true,auto:true});
  } else { rq.auto=true; rq.locked=true; if(rq.id!==Q_RISE)rq.id=Q_RISE; }
}

/**
 * 起床归属日 = 入睡（就寝）日期 + 1 天。
 * 例：09-01 夜里 23:05 入睡 → 09-02 07:20 起床。
 * 这样正好满足用户规则：
 *   ·「早点睡觉」归属入睡当天（09-01），由入睡时间判定
 *   ·「早起」归属起床当天（09-02），由起床时间判定
 */
function wakeDateOf(bedDate, wake){
  const d=new Date(bedDate+'T00:00:00');
  d.setDate(d.getDate()+1);
  return dateKey(d);
}

function markAutoQuest(qid, date, mark){
  const rec=DB.records[date] || (DB.records[date]={timeline:[],mainMarks:{},side:{},extra:{},wordCount:0,weight:null,moneyEarned:0,locked:false,date});
  // 自动判定的作息打卡：只在尚未记录时写入（保留手动修改）
  if(!rec.mainMarks[qid]){
    rec.mainMarks[qid]=mark;
  }
}
function clearAutoQuestMark(qid, date){
  const rec=DB.records[date]; if(!rec||!rec.mainMarks) return;
  // 只清除由本模块自动写入的 ✅/⚠️，不碰用户手动标记
  if(/^(✅|⚠️)$/.test(rec.mainMarks[qid])){
    delete rec.mainMarks[qid];
  }
}

/*
 * ═══════════════════════════════════════════════════════════════
 *  小问题② 答疑：主线打卡是【实时显示】还是【一天结算才显示】？
 *  ─────────────────────────────────────────────────────────────
 *  答案：实时显示。
 *    · 每次 markQuest() 都会 save() + render() → 周期打卡总览立即刷新
 *    · 矩阵是按「天 × 任务」把 DB.records 实时重绘的，无需等 10 天结算
 *    · 结算只在「开启新周期」那一刻发生一次（封存归档）
 *    · 今日小结同理：今天的点滴实时汇总在顶部
 *  所以：你现在打卡，周期打卡总览立刻就能看到 ✅
 *
 *  ※ 注：今日小结的「早起/早睡/体重/里程碑」已在 renderMatrix 源头
 *    直接渲染（见「📆 今日小结」卡片），不再需要 hook 追加，
 *    故原「今日小结增强」hook 块已移除，避免与源头渲染重复。
 * ═══════════════════════════════════════════════════════════════
 */

/* ---------- 11. 周期结算：让早睡/早起「不影响赚钱」 ----------
   原理：原 runCycleSummary 的统计循环是
     for(q of mainQuests){ total++; if(mark && mark!=='⚠️') done++ }
   作息任务若记为 ⚠️（熬夜/赖床），会把「通过率」拉低 → 你赚不到钱。
   解决办法：在结算统计运行前，把作息任务的 ⚠️ 临时当成"已完成"，
   这样它们对完成率 100% 中性（分子分母同增、且都算完成），
   但「今日小结 / 矩阵」里仍然真实显示 ✅/⚠️（统计可见）。
   这是在不改动原代码任何一行的前提下，用沙盒补丁实现的。
---------------------------------------- */
(function patchCycleSummary(){
  // 等 runCycleSummary 挂载到 window 后再补丁（脚本顺序保证：本模块在原函数之后执行不可控，
  // 所以用 defer 到首次调用）
  function apply(){
    if(!window.runCycleSummary || window.__sleepPatched) return false;
    const orig=window.runCycleSummary;
    window.runCycleSummary=function(){
      // 结算前：把作息任务的 ⚠️ 视为 ✅（中性化），备份以便恢复
      const backup=[];
      for(const d of Object.keys(DB.records)){
        const mm=DB.records[d].mainMarks||{};
        for(const q of DB.mainQuests){
          if(q.auto && mm[q.id]==='⚠️'){ backup.push([d,q.id,mm[q.id]]); mm[q.id]='✅(作息·中性)'; }
        }
      }
      try{ orig.call(this); }
      finally{ for(const [d,qid] of backup) DB.records[d].mainMarks[qid]='⚠️'; } // 还原真实状态
    };
    window.__sleepPatched=true;
    return true;
  }
  // 立即尝试，失败则等 DOMContentLoaded 后再试
  if(!apply()){ window.addEventListener('DOMContentLoaded', apply); }
})();

const _origSpawn = window.spawnParticles;
window.spawnParticles = function(layer, type, count){
  if(type==='leaf'||type==='feather'||type==='petal'){
    const map={leaf:['🍂','🍁','🍃'],feather:['🪶','✨'],petal:['🌸','🌺','🌼','🌷']};
    const set=map[type];
    if(!set) return;
    for(let i=0;i<count;i++){
      const el=document.createElement('span');
      el.className='fx-falling';
      el.textContent=set[i%set.length];
      el.style.left=Math.random()*100+'vw';
      el.style.animationDelay=(Math.random()*1)+'s';
      el.style.animationDuration=(3+Math.random()*2)+'s';
      el.style.fontSize=(14+Math.random()*10)+'px';
      layer.appendChild(el);
    }
    return;
  }
  return _origSpawn ? _origSpawn.apply(this,arguments) : null;
};
// 重要阶段随机扩展：加入 leaf/feather/petal/heart
const _origCelebrate=window.celebrate;
window.celebrate=function(reason, level){
  if(level==='major' && Math.random()<0.5){
    // 重要阶段有 50% 概率换成自然系效果（不固定）
    const nat=['leaf','feather','petal','heart','star','coin'];
    window.spawnParticles($('#fxLayer')||document.body, nat[Math.floor(Math.random()*nat.length)], 50);
  }
  return _origCelebrate ? _origCelebrate.apply(this,arguments) : null;
};
