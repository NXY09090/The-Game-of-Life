<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>游戏人生 · Life is a Game</title>
<style>
:root{
  --bg1:#c9d6df; --bg2:#e4e9ee; --bg3:#d5dde4;
  --panel:rgba(255,255,255,0.72);
  --panel-solid:#f4f6f8;
  --ink:#3a4250; --ink-soft:#6b7484; --line:#d8dfe6;
  --accent:#7d9eb0; --accent-2:#b8a9b0;
  --gold:#c0a16b; --good:#8fae8a; --warn:#c08a7a; --shadow:rgba(90,105,120,.18);
  --pixel:'Press Start 2P','Pixeboy',monospace;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{
  font-family:-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;
  background:linear-gradient(160deg,var(--bg1),var(--bg2),var(--bg3));
  background-size:400% 400%;
  animation:drift 28s ease infinite;
  color:var(--ink);
  min-height:100vh;overflow-x:hidden;
  transition:background .8s ease;
}
@keyframes drift{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,textarea,select{font-family:inherit;color:var(--ink)}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:var(--line);border-radius:4px}

/* ============ 封面 ============ */
#cover{
  position:fixed;inset:0;z-index:5000;
  background:linear-gradient(180deg,#1f3a5f 0%,#2f5d8f 35%,#4a86b5 65%,#8fc4d6 88%,#d9efe8 100%);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  cursor:pointer;overflow:hidden;
}
#cover canvas{position:absolute;inset:0;width:100%;height:100%}
.cover-title{position:relative;z-index:2;text-align:center;pointer-events:none;
  animation:floaty 5s ease-in-out infinite;padding:0 20px}
.cover-title h1{
  font-family:var(--pixel);font-size:clamp(52px,15vw,150px);color:#fff;line-height:1.05;max-width:95vw;word-break:keep-all;
  text-shadow:4px 4px 0 #1f3a5f,0 0 30px rgba(255,255,255,.4);letter-spacing:2px}
.cover-title .sub{
  margin-top:26px;font-family:var(--pixel);font-size:clamp(12px,3.4vw,22px);
  color:#d9efe8;letter-spacing:3px;opacity:.92}
.cover-hint{position:absolute;bottom:8%;z-index:2;font-size:13px;color:rgba(255,255,255,.75);
  letter-spacing:2px;animation:breathe 2.4s ease-in-out infinite;pointer-events:none}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@keyframes breathe{0%,100%{opacity:.45}50%{opacity:1}}

/* ============ 主框架 ============ */
#app{display:none;padding-left:0;transition:padding-left .35s cubic-bezier(.4,0,.2,1)}
#app.sidebar-open{padding-left:280px}
/* 宽屏（浏览器）下打开侧栏时，内容区宽度收缩到可视剩余空间，绝不再盖住侧栏 */
@media(min-width:721px){#app.sidebar-open .page{max-width:none!important;margin:0!important;padding-left:20px;padding-right:20px;width:auto}}
@media(max-width:720px){#app.sidebar-open{padding-left:0}}

/* ============ 顶栏 ============ */
.topbar{position:sticky;top:0;z-index:300;display:flex;align-items:center;gap:14px;
  padding:14px 20px;background:var(--panel);backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line)}
.hamburger{width:38px;height:38px;border:2px solid var(--ink);border-radius:6px;
  display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.stats{display:flex;gap:10px;flex-wrap:wrap;margin-left:auto}
.stat{background:var(--panel-solid);border:2px solid var(--line);border-radius:8px;
  padding:6px 14px;font-size:13px;font-weight:600;box-shadow:2px 2px 0 var(--shadow)}
.stat b{font-family:var(--pixel);font-size:14px;color:var(--accent)}

/* ============ 侧边栏（修复：确保可滚动、设置可见） ============ */
#sidebar{position:fixed;top:0;left:-300px;width:280px;height:100%;height:100dvh;z-index:400;
  background:linear-gradient(180deg,rgba(244,246,248,.96),rgba(232,236,240,.96));
  backdrop-filter:blur(16px);border-right:2px solid var(--line);
  transition:left .35s cubic-bezier(.4,0,.2,1);display:flex;flex-direction:column;overflow:hidden}
#sidebar.open{left:0}
@media(max-width:720px){#sidebar{left:-100%;width:82%;z-index:450}}
.side-head{flex:0 0 auto;padding:22px 20px 14px;border-bottom:1px solid var(--line)}
.side-head .logo{font-family:var(--pixel);font-size:15px;color:var(--accent);letter-spacing:1px}
.side-head .day{font-size:12px;color:var(--ink-soft);margin-top:4px}
.nav{flex:1 1 auto;overflow-y:auto;overflow-x:hidden;padding:8px 10px 16px;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;scrollbar-gutter:stable}
.nav button{display:flex;align-items:center;gap:12px;width:100%;text-align:left;
  padding:13px 14px;margin-bottom:3px;border-radius:8px;font-size:15px;color:var(--ink);
  transition:.15s}
.nav button:hover{background:rgba(125,158,176,.14)}
.nav button.active{background:var(--accent);color:#fff;box-shadow:3px 3px 0 var(--shadow)}
.nav .ico{font-size:18px;width:24px;text-align:center;flex-shrink:0}
.nav-sep{height:1px;background:var(--line);margin:10px 6px}

/* ============ 内容区 ============ */
.page{padding:20px;max-width:860px;margin:0 auto 100px}
.page-title{font-size:20px;font-weight:700;margin-bottom:4px}
.page-desc{font-size:12px;color:var(--ink-soft);margin-bottom:18px}
.card{background:var(--panel);backdrop-filter:blur(12px);border:2px solid var(--line);
  border-radius:14px;padding:18px;margin-bottom:16px;box-shadow:3px 3px 0 var(--shadow)}
.card h3{font-size:15px;margin-bottom:12px;display:flex;align-items:center;gap:8px}

/* ============ 首页（修复：Cycle/Day 断行、鼓励语不换行可滚动） ============ */
.home-hero{min-height:38vh;display:flex;flex-direction:column;justify-content:center;
  align-items:center;text-align:center;padding:40px 20px}
.welcome-name{font-size:clamp(28px,7vw,44px);font-weight:900;color:var(--ink);line-height:1.3;letter-spacing:1px}
.welcome-cycle{font-size:clamp(15px,4vw,19px);font-weight:700;color:var(--ink);margin-top:14px;line-height:1.5}
.welcome-quote-wrap{width:100%;max-width:640px;margin:14px auto 0;overflow:hidden}
.welcome-quote{font-size:14px;color:var(--accent);font-weight:400;letter-spacing:.5px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  animation:quoteScroll 8s linear infinite}
@keyframes quoteScroll{0%{transform:translateX(8%)}100%{transform:translateX(-8%)}}
.welcome-date{font-size:13px;color:var(--ink-soft);margin-top:12px;letter-spacing:1px}
.quick-add{width:100%;max-width:560px;margin:0 auto;display:flex;gap:8px;flex-wrap:wrap}
.quick-add input{flex:1;min-width:180px;padding:13px 15px;border:2px solid var(--line);
  border-radius:10px;background:var(--panel-solid);font-size:15px}
.quick-add button{background:var(--accent);color:#fff;font-weight:600;padding:0 22px;
  border-radius:10px;white-space:nowrap}

/* ============ 首页 🌏 一键打卡大按钮 ============ */
.checkin-btn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;width:100%;padding:18px 16px;margin:14px 0 4px;background:transparent;border:none;cursor:pointer;transition:.18s}
.checkin-globe{font-size:64px;line-height:1;transition:.3s;animation:floaty 4s ease-in-out infinite}
.checkin-btn:hover .checkin-globe{transform:scale(1.15) rotate(8deg)}
.checkin-text{font-size:20px;font-weight:800;color:var(--ink)}
.checkin-sub{font-size:11px;color:var(--ink-soft)}

/* ============ 今日记录 · 快捷打卡区 ============ */
.ci-head{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:700;color:var(--accent);margin-bottom:12px}
.ci-head .ci-globe{font-size:20px}
.ci-head .ci-sub{font-size:11px;color:var(--ink-soft);font-weight:400;margin-left:auto}
.ci-block{margin-bottom:14px;padding-bottom:12px;border-bottom:1px dashed var(--line)}
.ci-block:last-child{border-bottom:none;margin-bottom:0;padding-bottom:0}
.ci-title{font-size:12px;color:var(--ink-soft);font-weight:700;margin-bottom:8px;letter-spacing:.5px}
.ci-row{display:flex;align-items:center;gap:4px;padding:6px 0;flex-wrap:nowrap}
.ci-no{font-family:var(--pixel);font-size:9px;background:var(--accent);color:#fff;padding:2px 5px;border-radius:5px;flex-shrink:0}
.ci-name{flex:1;font-size:13px;font-weight:600;color:var(--ink);min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ci-marks{display:flex;gap:3px;flex-wrap:nowrap;align-items:center}
.ci-btn{padding:4px 7px;border:2px solid var(--line);border-radius:8px;font-size:11px;background:var(--panel);transition:.12s;line-height:1}
.ci-btn.on,.ci-btn.active{background:var(--good);color:#fff;border-color:var(--good)}
.ci-btn:hover:not(:disabled){border-color:var(--accent)}
.ci-btn:disabled{opacity:.4;cursor:not-allowed}
.ci-input{flex:1;min-width:120px;padding:7px 10px;border:1.5px solid var(--line);border-radius:8px;background:var(--panel-solid);font-size:13px}

/* ============ 表格/列表 ============ */
.row{display:flex;gap:8px;align-items:stretch;padding:8px 0;border-bottom:1px dashed var(--line);flex-wrap:wrap}
.row:last-child{border-bottom:none}
.row input,.row select,.row textarea{padding:9px 10px;border:1.5px solid var(--line);
  border-radius:8px;background:var(--panel-solid);font-size:14px}
.timeline .row>div{flex:1;min-width:120px}

/* ============ 时间线卡片（第10条：字号/颜色/粗细区分层级） ============ */
.tl-list{display:flex;flex-direction:column;gap:12px}
.tl-card{position:relative;background:var(--panel-solid);border:2px solid var(--line);border-radius:12px;padding:14px 40px 14px 16px;transition:.15s}
.tl-card.has-achv{border-color:rgba(192,161,107,.45)}
.tl-time{font-size:12px;color:var(--ink-soft);font-weight:600;letter-spacing:.5px;margin-bottom:4px}
.tl-content{font-size:16px;font-weight:700;color:var(--ink);line-height:1.5;margin-bottom:6px}
.tl-feel{font-size:13px;color:var(--accent);font-style:normal;margin-bottom:8px;line-height:1.5}
.tl-achv{font-size:13px}
.tl-del{position:absolute;top:10px;right:10px;background:transparent;border:none;font-size:15px;opacity:.45;cursor:pointer;transition:.15s}
.tl-del:hover{opacity:1}
.tl-legend{display:flex;flex-wrap:wrap;font-size:11px;color:var(--ink-soft);margin-bottom:14px}
.side-history{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px}
.achievement-tag{display:inline-block;background:linear-gradient(135deg,#fff3d6,#ffe6b3);
  border:1.5px solid var(--gold);color:#8a6d3b;padding:2px 9px;border-radius:12px;
  font-size:12px;margin:2px 4px 2px 0;cursor:pointer}
.achievement-tag:hover{border-color:var(--warn)}
.tag-input{width:100%;max-width:200px;padding:4px 8px;border:1.5px solid var(--accent);border-radius:8px;font-size:12px}

/* ============ 主线打卡 ============ */
.quest{border:2px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px;
  background:var(--panel-solid);position:relative}
.quest.locked{opacity:.55;pointer-events:none}
.quest .q-head{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.quest .q-no{font-family:var(--pixel);font-size:12px;background:var(--accent);color:#fff;
  padding:3px 8px;border-radius:6px;flex-shrink:0}
.quest .q-name{flex:1;font-weight:600;font-size:15px;border:none;background:transparent;width:100%}
.quest .q-del{flex:0 0 auto;width:32px;height:32px;display:flex;align-items:center;justify-content:center;
  color:var(--ink-soft);font-size:16px;line-height:1;opacity:.5;transition:.15s}
.quest .q-del:hover{opacity:1;color:var(--warn)}
.quest .q-desc{width:100%;font-size:13px;color:var(--ink);margin:4px 0 10px;padding:8px 10px;
  border:1.5px solid var(--line);border-radius:8px;background:var(--panel);resize:vertical;min-height:34px}
.quest .q-desc:focus{border-color:var(--accent);outline:none}
.quest .q-desc[readonly]{background:rgba(0,0,0,.03);color:var(--ink-soft);border-style:dashed;resize:none}
.marks{display:flex;gap:6px;flex-wrap:wrap}
.mark-btn{padding:7px 12px;border:2px solid var(--line);border-radius:8px;font-size:13px;
  background:var(--panel);transition:.12s}
.mark-btn.active{background:var(--good);color:#fff;border-color:var(--good);transform:scale(1.05)}
.mark-btn.undo{background:var(--warn);color:#fff;border-color:var(--warn)}
.q-meta{font-size:11px;color:var(--ink-soft);margin-top:8px}

/* ============ 进阶树 ============ */
.tree{display:flex;flex-direction:column;align-items:center;gap:6px;padding:20px 0}
.tree-tier{display:flex;gap:14px;justify-content:center;flex-wrap:wrap}
.tree-node{width:64px;height:80px;display:flex;flex-direction:column;align-items:center;
  justify-content:flex-end;position:relative;filter:grayscale(1);opacity:.4;transition:.4s}
.tree-node.reached{filter:none;opacity:1}
.tree-node.current{transform:scale(1.18);animation:glow 2s ease-in-out infinite}
@keyframes glow{0%,100%{filter:drop-shadow(0 0 4px var(--gold))}50%{filter:drop-shadow(0 0 14px var(--gold))}}
.tree-node .emoji{font-size:30px;line-height:1}
.tree-node .lv{font-family:var(--pixel);font-size:8px;margin-top:4px;color:var(--ink-soft)}
.tree-node.reached .lv{color:var(--accent)}
.tree-connector{width:2px;height:14px;background:var(--line)}
.tree-node.has-leaf::before{content:'';position:absolute;bottom:28px;left:-8px;width:14px;height:8px;
  background:#8fae8a;border-radius:0 8px 8px 0;transform:rotate(-20deg)}
.tree-node.has-flower .emoji{font-size:34px}

/* ============ 存钱 ============ */
.fund-bar{height:22px;border-radius:11px;background:var(--line);overflow:hidden;margin:10px 0 6px;
  border:2px solid var(--ink)}
.fund-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--gold));transition:width .6s}
.wish{display:flex;gap:10px;align-items:center;padding:11px;border:2px solid var(--line);
  border-radius:10px;margin-bottom:8px;background:var(--panel-solid);flex-wrap:wrap}
.wish.bought{opacity:.45;text-decoration:line-through}
.wish .w-name{flex:1;min-width:100px;font-weight:600}
.wish .w-price{color:var(--gold);font-weight:700;font-family:var(--pixel);font-size:12px}
.mini-btn{padding:5px 11px;border:1.5px solid var(--line);border-radius:7px;font-size:12px;background:var(--panel)}
.mini-btn.danger{border-color:var(--warn);color:var(--warn)}
.mini-btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.mini-btn.gold{background:var(--gold);color:#fff;border-color:var(--gold)}

/* ============ 回溯图表 ============ */
.chart-box{background:var(--panel-solid);border-radius:12px;padding:14px;border:2px solid var(--line)}
.summary-box{background:linear-gradient(135deg,var(--panel),rgba(255,255,255,.5));
  border:2px solid var(--gold);border-radius:14px;padding:20px;margin-bottom:18px}
.summary-box h4{color:var(--accent);margin-bottom:10px}
.heatmap{display:flex;gap:4px;flex-wrap:wrap;margin-top:8px}
.heat-day{width:26px;height:26px;border-radius:6px;border:1.5px solid var(--line);
  display:flex;align-items:center;justify-content:center;font-size:10px;position:relative;cursor:pointer}
.heat-day .tip{display:none;position:absolute;bottom:32px;left:50%;transform:translateX(-50%);
  background:var(--ink);color:#fff;padding:5px 9px;border-radius:6px;font-size:11px;white-space:nowrap;z-index:10}
.heat-day:hover .tip{display:block}

.btn{background:var(--accent);color:#fff;font-weight:600;padding:11px 20px;border-radius:10px;font-size:14px;
  box-shadow:2px 2px 0 var(--shadow)}
.btn.ghost{background:transparent;color:var(--ink);border:2px solid var(--line)}
.btn.sm{padding:6px 12px;font-size:12px}
.empty{text-align:center;color:var(--ink-soft);padding:30px;font-size:14px}
.lock-banner{background:linear-gradient(90deg,#fff3cd,#ffe6b3);border:2px solid var(--gold);
  border-radius:10px;padding:10px 14px;font-size:13px;margin-bottom:14px;color:#8a6d3b}
.log-list{max-height:260px;overflow-y:auto}
.log-item{font-size:12px;color:var(--ink-soft);padding:5px 0;border-bottom:1px dashed var(--line)}
.log-item b{color:var(--warn)}

.theme-swatch{width:38px;height:38px;border-radius:9px;border:3px solid var(--line);cursor:pointer;display:inline-block;margin:4px}
.modal{position:fixed;inset:0;z-index:600;background:rgba(40,50,65,.45);display:none;
  align-items:center;justify-content:center;padding:20px}
.modal.open{display:flex}
.modal-box{background:var(--panel-solid);border-radius:16px;padding:22px;max-width:480px;width:100%;
  max-height:86vh;overflow-y:auto;border:2px solid var(--line);box-shadow:6px 6px 0 var(--shadow)}
.modal-box h3{margin-bottom:14px}
.field{margin-bottom:14px}
.field label{display:block;font-size:13px;color:var(--ink-soft);margin-bottom:5px}
.field input,.field select,.field textarea{width:100%;padding:10px;border:2px solid var(--line);border-radius:8px;background:var(--panel)}
.split{display:flex;gap:8px;flex-wrap:wrap}
.split>*{flex:1;min-width:120px}
.hidden{display:none!important}
.pill{display:inline-block;padding:2px 9px;border-radius:10px;font-size:11px;font-weight:600;margin:2px}
/* ============ 礼物池：计划奖励 / 减重奖励 两个独立分区 ============ */
.pool-section{margin-bottom:16px}
.pool-section .pool-head{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:700;margin-bottom:10px}
.pool-section .pool-head .tag{font-size:11px;font-weight:600;padding:2px 9px;border-radius:10px}
.pool-plan .pool-head .tag{background:rgba(125,158,176,.18);color:var(--accent)}
.pool-weight .pool-head .tag{background:rgba(192,138,122,.18);color:var(--warn)}
.pool-desc{font-size:12px;color:var(--ink-soft);margin-bottom:10px;line-height:1.6}
.gift-tier{border:1.5px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:10px;background:var(--panel-solid)}
.gift-tier .tier-title{font-size:13px;font-weight:700;margin-bottom:6px}
.gift-tier input.tier-gifts{width:100%;padding:9px 10px;border:1.5px solid var(--line);border-radius:8px;background:var(--panel);font-size:13px;margin-top:6px}
.wt-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
.wt-row .wt-label{font-size:13px;color:var(--ink);min-width:120px}
.wt-row input{width:70px;padding:7px 8px;border:1.5px solid var(--line);border-radius:8px;background:var(--panel);font-size:13px;text-align:center}
.pill.g{background:#e2efe0;color:#5a7a55}.pill.b{background:#dde8f0;color:#4a6a80}
.pill.r{background:#f3ded8;color:#a05a48}

/* ============ 里程碑卡片 ============ */
.ms-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.ms-card{border:2px solid var(--line);border-radius:12px;padding:18px 14px;text-align:center;
  background:var(--panel-solid);transition:.18s;cursor:not-allowed;position:relative}
.ms-card.on{cursor:pointer;box-shadow:3px 3px 0 var(--shadow)}
.ms-card.on:hover{transform:translateY(-3px);box-shadow:4px 5px 0 var(--shadow)}
.ms-card.locked{opacity:.5;filter:grayscale(.6)}
.ms-card .ms-icon{font-size:34px;line-height:1;margin-bottom:8px}
.ms-card .ms-name{font-size:14px;font-weight:700;margin-bottom:4px}
.ms-card .ms-status{font-size:11px;color:var(--ink-soft)}
.ms-card.on .ms-status{color:var(--good);font-weight:600}
/* ============ 健康人生板块（LoseIt!/苹果健康风格） ============ */
.hg-guide{background:linear-gradient(135deg,rgba(125,158,176,.14),rgba(143,174,138,.14));border:2px dashed var(--accent);border-radius:12px;padding:16px 18px;margin-bottom:16px}
.hg-guide-title{font-size:15px;font-weight:800;color:var(--accent);margin-bottom:6px}
.hg-guide-txt{font-size:12px;color:var(--ink-soft);line-height:1.9}
.hg-tip{color:var(--good);font-weight:600}
.hg-form{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end}
.hg-field{flex:1;min-width:130px;display:flex;flex-direction:column;gap:4px}
.hg-field-wide{flex:2;min-width:200px}
.hg-field label{font-size:11px;color:var(--ink-soft);font-weight:600}
.hg-field input{width:100%;padding:9px 10px;border:2px solid var(--line);border-radius:8px;background:var(--panel-solid);font-size:14px}
.hg-save{white-space:nowrap;padding:0 22px;align-self:flex-end;height:38px}
.hg-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:16px}
@media(max-width:640px){.hg-stats{grid-template-columns:1fr}}
.hg-stat{background:var(--panel);border:2px solid var(--line);border-radius:14px;padding:16px;box-shadow:3px 3px 0 var(--shadow)}
.hg-stat-label{font-size:11px;color:var(--ink-soft);margin-bottom:6px}
.hg-stat-num{font-family:var(--pixel);font-size:30px;font-weight:900;color:var(--accent);line-height:1.1}
.hg-stat-num.hg-down{color:var(--good)}
.hg-stat-unit{font-size:13px;color:var(--ink-soft);font-weight:400;margin-left:2px}
.hg-stat-sub{font-size:11px;color:var(--ink-soft);margin-top:8px}
.hg-chart canvas{width:100%;display:block}
.hg-chart-card{padding:14px}
.hg-empty{text-align:center;color:var(--ink-soft);padding:30px;font-size:13px}
.hg-legend{font-size:11px;color:var(--ink-soft);margin-bottom:8px}
.hg-dot{display:inline-block;width:11px;height:11px;border-radius:3px;margin:0 3px 0 8px;vertical-align:middle}
.hg-dot.hg-both{background:rgba(143,174,138,.5)}
.hg-dot.hg-w{background:rgba(125,158,176,.4)}
.hg-dot.hg-food{background:rgba(192,138,122,.35)}
.hg-heat{display:grid;grid-template-columns:repeat(auto-fill,minmax(34px,1fr));gap:4px}
.hg-cell{aspect-ratio:1;border-radius:6px;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:10px;color:var(--ink-soft);position:relative;cursor:pointer}
.hg-cell.hg-both{background:rgba(143,174,138,.45);color:var(--ink)}
.hg-cell.hg-w{background:rgba(125,158,176,.3)}
.hg-cell.hg-food{background:rgba(192,138,122,.28)}
.hg-cell .hg-tip{display:none;position:absolute;bottom:115%;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:4px 8px;border-radius:5px;font-size:10px;white-space:nowrap;z-index:20}
.hg-cell:hover .hg-tip{display:block}
.hg-food-list{max-height:220px;overflow-y:auto}
.hg-food-row{display:flex;gap:8px;padding:5px 0;border-bottom:1px dashed var(--line);font-size:12px}
.hg-food-row:last-child{border-bottom:none}
.hg-food-date{color:var(--ink-soft);flex-shrink:0;width:52px}
.hg-food-content{flex:1;text-align:right}
.hg-tier{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px dashed var(--line);font-size:13px}
.hg-tier:last-of-type{border-bottom:none}
.hg-tier-dot{font-size:18px;flex-shrink:0;width:26px;text-align:center}
.hg-tier-txt b{color:var(--accent)}
.hg-reward-now{margin-top:10px;padding:10px;background:rgba(143,174,138,.12);border-radius:8px;font-size:13px}
.hg-cycle-bar{margin-top:10px}

/* ============ 成就图鉴 ============ */
.achv-filter{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.achv-filter button{padding:6px 12px;border:2px solid var(--line);border-radius:8px;font-size:12px;background:var(--panel);transition:.15s}
.achv-filter button.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.achv-group{margin-bottom:18px}
.achv-group-title{font-size:15px;font-weight:700;margin-bottom:10px;padding:6px 10px;border-radius:8px;color:#fff}
.achv-group-title.survival{background:linear-gradient(90deg,#8fae8a,#7d9eb0)}
.achv-group-title.pen{background:linear-gradient(90deg,#7d9eb0,#b8a9b0)}
.achv-group-title.mind{background:linear-gradient(90deg,#b8a9b0,#c0a16b)}
.achv-group-title.energy{background:linear-gradient(90deg,#c08a7a,#c0a16b)}
.achv-group-title.fun{background:linear-gradient(90deg,#b8a9b0,#8fae8a)}
.achv-task{margin-bottom:10px}
.achv-task-name{font-size:13px;font-weight:600;color:var(--ink);margin-bottom:6px;display:flex;align-items:center;gap:6px}
.achv-tier-row{display:flex;align-items:flex-start;gap:8px;padding:5px 0;border-bottom:1px dashed var(--line)}
.achv-tier-num{font-family:var(--pixel);font-size:10px;background:var(--accent);color:#fff;padding:2px 6px;border-radius:4px;flex-shrink:0;min-width:48px;text-align:center}
.achv-tier-names{font-size:12px;color:var(--ink-soft);line-height:1.6}
.achv-tier-names .got{color:var(--good);font-weight:600}
.achv-tier-names .current{border-bottom:2px solid var(--gold)}

/* ============ 徽章墙（荣誉墙·上半） ============ */
.badge-group{margin-bottom:16px}
.badge-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px}
.badge-cell{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:4px;padding:14px 6px;border:2px dashed var(--line);border-radius:12px;background:var(--panel-solid);
  transition:.18s;min-height:86px}
.badge-cell.locked{border-style:dashed;opacity:.55;filter:grayscale(.7)}
.badge-cell.on{border-style:solid;border-color:var(--accent);background:rgba(125,158,176,.10)}
.badge-cell.got{border-style:solid;border-color:var(--gold);background:linear-gradient(135deg,rgba(192,161,107,.16),rgba(255,230,179,.22))}
.badge-emoji{font-size:26px;line-height:1}
.badge-cell.locked .badge-emoji{font-size:16px;opacity:.7}
.badge-name{font-size:11px;color:var(--ink-soft);font-weight:600;letter-spacing:.3px}
.badge-cell.on .badge-name,.badge-cell.got .badge-name{color:var(--ink)}
.badge-cell.locked .badge-name{color:var(--line)}
.badge-mark{position:absolute;top:4px;right:6px;font-size:10px;font-weight:700;color:var(--gold)}
.badge-cell.locked .badge-mark{color:var(--line)}

/* ============ 里程碑（8档） ============ */
.ms8-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}


/* ============ 周期打卡一览矩阵 ============ */
.matrix-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;border:2px solid var(--line);border-radius:12px;background:var(--panel)}
.matrix{width:100%;border-collapse:collapse;min-width:520px}
.matrix th,.matrix td{border:1px solid var(--line);padding:6px 4px;text-align:center;font-size:12px;white-space:nowrap}
.matrix thead th{background:var(--panel-solid);position:sticky;top:0;z-index:2;font-weight:600}
.matrix .th-task{position:sticky;left:0;z-index:3;background:var(--panel-solid);text-align:left;padding-left:10px;min-width:110px}
.matrix td.cell-task{position:sticky;left:0;background:var(--panel-solid);text-align:left;padding-left:10px;font-weight:600}
.cell-mark{font-size:14px;line-height:1}
.cell-mark.ok{background:rgba(143,174,138,.28)}
.cell-mark.fail{background:rgba(192,138,122,.28)}
.cell-mark.miss{color:var(--ink-soft)}
.matrix-legend{font-size:12px;color:var(--ink-soft);margin-top:10px;display:flex;gap:16px;flex-wrap:wrap}
.matrix-legend span{display:inline-flex;align-items:center;gap:5px}
.lg{display:inline-block;width:14px;height:14px;border-radius:3px;border:1px solid var(--line)}

/* 里程碑: 锁定显示真实图标(灰) + 🔒角标 */
.ms-lockbadge{position:absolute;top:6px;right:8px;font-size:11px;opacity:.75}
.ms-icon{font-size:26px;line-height:1;flex-shrink:0;transition:.3s}
.ms-icon-locked{filter:grayscale(1);opacity:.4}
.ms-name{flex:1;font-size:14px;font-weight:700;color:var(--ink)}
.ms-status{font-size:11px;color:var(--ink-soft)}
.compact-path .path-row{display:flex;flex-wrap:wrap;align-items:center;gap:4px 2px;row-gap:6px}
.path-node{display:inline-flex;flex-direction:column;align-items:center;gap:2px;padding:6px 8px;border:2px solid var(--line);border-radius:10px;background:var(--panel-solid);transition:.2s;max-width:84px}
.path-node.reached{border-color:var(--good)}
.path-node.current{border-color:var(--gold);box-shadow:0 0 8px rgba(192,161,107,.5)}
.path-emoji{font-size:22px;line-height:1}
.path-lv{font-family:var(--pixel);font-size:8px;color:var(--ink-soft)}
.path-name{font-size:10px;color:var(--ink);text-align:center;line-height:1.2;word-break:break-all}
.path-arrow{color:var(--line);font-size:14px;align-self:center}
.uni-tabs .mini-btn{padding:7px 14px;border:2px solid var(--line);border-radius:20px;background:var(--panel)}
.uni-tabs .mini-btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
/* ============ 成就庆祝动画（彩纸雨 + 像素烟花 + 文案） ============ */
#fxLayer{position:fixed;inset:0;z-index:6000;pointer-events:none;overflow:hidden;opacity:0;transition:opacity .3s}
#fxLayer.fx-show{opacity:1}
.confetti{position:absolute;top:-20px;width:10px;height:14px;border-radius:2px;opacity:.9;
  animation:confettiFall linear forwards;image-rendering:pixelated}
@keyframes confettiFall{0%{transform:translateY(0) rotate(0)}100%{transform:translateY(105vh) rotate(540deg)}}
.firework{position:absolute;width:14px;height:14px;border-radius:50%;background:#fff;
  box-shadow:0 0 0 4px rgba(192,161,107,.7),0 0 0 10px rgba(125,158,176,.4);
  animation:fireworkPop .9s ease-out forwards;image-rendering:pixelated}
@keyframes fireworkPop{0%{transform:scale(0);opacity:1}60%{transform:scale(1);opacity:1}100%{transform:scale(2.4);opacity:0}}
.fx-text{position:absolute;top:32%;left:50%;transform:translateX(-50%);font-family:var(--pixel);
  font-size:clamp(20px,6vw,40px);color:#fff;text-shadow:3px 3px 0 #1f3a5f,0 0 24px rgba(255,255,255,.6);
  letter-spacing:2px;animation:fxText .3s ease;white-space:nowrap}
@keyframes fxText{0%{transform:translate(-50%,20px) scale(.6);opacity:0}100%{transform:translate(-50%,0) scale(1);opacity:1}}

/* ============ 属性点条 ============ */
.attr-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-top:10px}
.attr-cell{background:var(--panel-solid);border:2px solid var(--line);border-radius:12px;padding:12px}
.attr-cell .a-head{display:flex;align-items:center;gap:6px;font-weight:700;font-size:14px;margin-bottom:6px}
.attr-cell .a-val{font-family:var(--pixel);font-size:13px;color:var(--accent)}
.attr-bar{height:8px;border-radius:4px;background:var(--line);overflow:hidden;margin-top:6px}
.attr-bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--gold));transition:width .5s}
.attr-tier{font-size:11px;color:var(--ink-soft);margin-top:4px}
.attr-tier .got{color:var(--good);font-weight:700}

/* 徽章墙：属性徽章与成就徽章并列 */
.badge-cell.attr{border-color:rgba(192,161,107,.5)}
.badge-cell.attr .badge-emoji{font-size:22px}
.badge-cell.attr.on{background:linear-gradient(135deg,#fff3d6,#ffe6b3)}
.badge-cell.attr.got{background:linear-gradient(135deg,#ffe6b3,#f5d98a)}

/* ============ 习惯记录 · 多条例表（时间+内容+感受，从新到旧，计数） ============ */
.frag-card{background:var(--panel-solid);border:2px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
.frag-head{display:flex;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.frag-head .f-name{flex:1;min-width:100px;font-weight:700;font-size:15px;border:none;background:transparent}
.frag-count{font-size:11px;font-weight:700;padding:3px 9px;border-radius:10px;background:rgba(125,158,176,.16);color:var(--accent)}
.frag-count .total{color:var(--ink-soft);font-weight:600}
.frag-logs{display:flex;flex-direction:column;gap:8px;margin-bottom:10px}
.frag-log{position:relative;background:var(--panel);border:1.5px solid var(--line);border-radius:10px;padding:10px 34px 10px 12px;animation:logIn .25s ease}
@keyframes logIn{0%{opacity:0;transform:translateY(-6px)}100%{opacity:1;transform:translateY(0)}}
.frag-log .f-time{font-family:var(--pixel);font-size:11px;color:var(--accent);font-weight:700;letter-spacing:.5px}
.frag-log .f-text{font-size:14px;color:var(--ink);line-height:1.5;margin-top:2px;word-break:break-word}
.frag-log .f-feel{font-size:12px;color:var(--ink-soft);margin-top:3px;font-style:normal}
.frag-log .f-del{position:absolute;top:8px;right:8px;background:transparent;border:none;font-size:14px;opacity:.4;cursor:pointer;transition:.15s}
.frag-log .f-del:hover{opacity:1;color:var(--warn)}
.frag-empty{font-size:12px;color:var(--ink-soft);padding:6px 2px 10px}
.frag-add{display:flex;flex-direction:column;gap:8px;padding:10px;background:rgba(125,158,176,.08);border-radius:10px}
.frag-add .f-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.frag-add input,.frag-add textarea{font-family:inherit;color:var(--ink);padding:9px 10px;border:1.5px solid var(--line);border-radius:8px;background:#fff;font-size:14px}
.frag-add .f-time-input{width:78px;text-align:center;flex-shrink:0}
.frag-add .f-text-input{flex:1;min-width:140px}
.frag-add .f-feel-input{flex:1;min-width:120px}
.frag-add button{background:var(--accent);color:#fff;font-weight:700;padding:9px 18px;border-radius:8px;white-space:nowrap;font-size:14px}

/* ============ 习惯记录 · 日期分组 + 折叠 + 封存 ============ */
.frag-groups{display:flex;flex-direction:column;gap:8px;margin-bottom:10px}
.frag-group{background:var(--panel);border:1.5px solid var(--line);border-radius:10px;overflow:hidden;transition:.2s}
.frag-group[open]{box-shadow:2px 2px 0 var(--shadow)}
.frag-group-header{display:flex;align-items:center;gap:8px;padding:10px 14px;cursor:pointer;user-select:none;
  font-size:13px;font-weight:600;color:var(--ink);list-style:none}
.frag-group-header::-webkit-details-marker{display:none}
.frag-group-date{flex:1;font-weight:700}
.frag-group-count{font-size:11px;color:var(--accent);background:rgba(125,158,176,.14);padding:2px 8px;border-radius:8px;white-space:nowrap}
.frag-group-seal{font-size:11px;color:var(--ink-soft)}
.frag-group-arrow{font-size:12px;color:var(--ink-soft);transition:transform .2s}
.frag-group[open] .frag-group-arrow{transform:rotate(180deg)}
.frag-group-body{padding:4px 12px 12px;border-top:1px dashed var(--line)}
.frag-group-sealed .frag-group-header{color:var(--ink-soft)}
.frag-group-sealed .frag-group-date{color:var(--ink-soft)}
.frag-group-sealed .frag-log{opacity:.7;background:rgba(0,0,0,.02)}
.frag-group-sealed .frag-log .f-text{color:var(--ink-soft)}
.frag-log-sealed{position:relative}
.frag-del-placeholder{width:24px;height:24px;flex-shrink:0;display:inline-block}

/* ============ 定时信箱 · 神秘感 ============ */
.letter-sealed{transition:transform .2s}
.letter-sealed:active{transform:scale(.97)}
@keyframes shakeLetter{0%,100%{transform:translateX(0)}20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
.letter-opened{border-left:3px solid var(--gold)}

  </style>
</head>
<body>

<!-- ========== 封面 ========== -->
<div id="cover">
  <canvas id="coverSea"></canvas>
  <div class="cover-title">
    <h1>游戏人生</h1>
    <div class="sub">LIFE IS A GAME</div>
  </div>
  <div class="cover-hint">— click anywhere to enter —</div>
</div>

<!-- ========== 主应用 ========== -->
<div id="app">
  <div class="topbar">
    <button class="hamburger" onclick="toggleSidebar()">☰</button>
    <div class="stats">
      <div class="stat">Be born <b id="statDay">1</b></div>
      <div class="stat">💰 <b id="statMoney">0</b></div>
      <div class="stat">✍️ <b id="statWord">0</b></div>
    </div>
  </div>

  <div id="sidebar">
    <div class="side-head">
      <div class="logo">🎮 游戏人生</div>
      <div class="day" id="sideDay">Day 1 · LIFE IS A GAME</div>
    </div>
    <div class="nav" id="nav"></div>
  </div>

  <div class="page" id="page"></div>
</div>

<!-- ========== 修正日志弹窗 ========== -->
<div class="modal" id="correctionModal">
  <div class="modal-box">
    <h3>📝 申请修正</h3>
    <div class="field">
      <label>原内容</label>
      <div id="corrOrig" style="padding:8px;background:var(--bg2);border-radius:8px;font-size:13px"></div>
    </div>
    <div class="field">
      <label>修正为</label>
      <input id="corrNew" placeholder="留空表示删除该条">
    </div>
    <div class="field">
      <label>原因（留档）</label>
      <input id="corrReason" placeholder="如：记录有误">
    </div>
    <div class="split">
      <button class="btn ghost" onclick="closeCorrection()">取消</button>
      <button class="btn" onclick="submitCorrection()">提交（将记入修正日志）</button>
    </div>
  </div>
</div>

<script>
/* ════════════════════════════════════════════════════════════════
   💫 属性点系统 + 改名继承 + 成就庆祝动画
   注入到主脚本之前（通过 _inject.py 拼接到 <script> 顶部）
════════════════════════════════════════════════════════════════ */

/* ---------- 属性点定义（5类 × 3档徽章：30/60/100） ---------- */
const ATTR_DEFS = {
  health:  { icon:'💪', name:'健康', desc:'运动、饮食、作息、睡觉、体重管理、瑜伽、体态' },
  beauty:  { icon:'✨', name:'美貌', desc:'化妆、护肤、穿搭、面膜、穿搭、戒指、项链、口号、美甲' },
  wisdom:  { icon:'🧠', name:'智慧', desc:'阅读、学习、语言、写作、书籍、日语、韩语、英语、辩论' },
  will:    { icon:'🔥', name:'意志', desc:'坚持打卡、早起、完成任务、日记、复盘' },
  charm:   { icon:'💖', name:'魅力', desc:'社交、心情、画画、朋友、丙烯、练字、普通话、自媒体、兴趣爱好' }
};
const ATTR_TIERS = [30, 60, 100];   // 每档阈值
const ATTR_PER_TASK = {             // 每个任务打卡时加哪些属性、各加几点
  '做菜':{health:1,charm:1},  '做饭':{health:1,charm:1}, '运动':{health:2,will:1}, '散步':{health:1,charm:1},
  '拖地':{health:1,will:1}, '擦家具':{health:1,will:1}, '宠物':{charm:2}, '家务':{health:1,charm:1}, 
  '写日记':{wisdom:1,will:1}, '影评':{wisdom:2}, '自媒体':{wisdom:1,charm:1},
  '日程设计':{will:2}, '普通话':{wisdom:2}, '英语':{wisdom:2}, '韩语':{wisdom:2},
  '日语':{wisdom:1}, '阅读':{wisdom:1}, '专业':{wisdom:1},
  '艺术':{wisdom:1}, '心理学':{wisdom:1}, '体重管理':{health:2,will:1},
  '朋友':{charm:1}, '美甲':{beauty:2}, '化妆':{beauty:2},
  '丙烯画画':{charm:2}, '毛笔字':{wisdom:1,charm:1}, '数字油画':{charm:2},
  '电影':{charm:2}, '看电视剧':{charm:1},'影视':{charm:1}
};
function attrGainsFor(taskName){
  return ATTR_PER_TASK[taskName] || {will:1};   // 未列出的默认加意志力
}

/* ---------- 属性点 → 金钱：汇率随「总阶级和」阶梯提升（幂等，刷新不重复加） ---------- */
// 「总阶级和」= 所有主线任务的当前阶级(level)之和，衡量"整体走到多远了"
function totalStageSum(){
  const prog=DB.progression||{};
  let sum=0;
  for(const id of Object.keys(prog)){ sum+=(prog[id]&&prog[id].level)||1; }
  return sum;
}
// 阶梯汇率：总阶级和 30/50/80/100 为临界点
//   0-29阶→¥0.10   30-49阶→¥0.15   50-79阶→¥0.20   80-99阶→¥0.25   100+阶→¥0.30
function attrPointRate(){
  const stage=totalStageSum();
  if(stage>=100) return 0.30;
  if(stage>=80)  return 0.25;
  if(stage>=50)  return 0.20;
  if(stage>=30)  return 0.15;
  return 0.10;
}
// 当前总属性点
function totalAttrPoints(){return Object.values(DB.attrPoints||{}).reduce((s,v)=>s+(v||0),0)}
// 新增属性点按【当前汇率】折算进余额，只补差额、绝不重复加
function recalcGold(){
  if(DB._lastAttrTotal===undefined) DB._lastAttrTotal=0;
  const now=totalAttrPoints();
  if(now>DB._lastAttrTotal){
    const deltaPts=now-DB._lastAttrTotal;
    const rate=attrPointRate();
    DB.savings=Number(((DB.savings||0)+deltaPts*rate).toFixed(2));
    DB._lastAttrTotal=now;
  }
}
// 累计"属性点折算"总额（余额的一部分），用于明细展示
function totalAttrGold(){return Number((totalAttrPoints()*attrPointRate()).toFixed(2))}
function fmtGold(){return totalAttrGold().toFixed(2)}

/* ---------- 属性点累加（在主线/支线打卡时调用） ---------- */
function awardAttrs(taskName, amt){
  if(!DB.attrPoints) DB.attrPoints={health:0,beauty:0,wisdom:0,will:0,charm:0};
  const gains = attrGainsFor(taskName);
  const unlocked=[];
  for(const k of Object.keys(gains)){
    const before=DB.attrPoints[k]||0;
    DB.attrPoints[k]=before+(gains[k]||1)*(amt||1);
    // 检查是否跨过新档位
    ATTR_TIERS.forEach((th,idx)=>{
      if(before<th && DB.attrPoints[k]>=th){ unlocked.push({attr:k, tier:idx+1, th}); }
    });
  }
  recalcGold();   // 每次属性点变化 → 同步换算成钱（幂等，只补差额）
  return unlocked;   // 返回新解锁的属性徽章，供动画播放
}

/* ---------- 连续打卡检测（支线/碎片连续≥5天） ---------- */
function checkStreak(taskName){
  // 从 healthSeries 之外的 sideHistory / timeline 里按天统计——此处简化为：记录最近打卡日期序列
  // 实际：DB.sideQuests 的 history 已存 {time, note}；用 records 里 extra.side 标记
  let streak=0;
  const days=Object.keys(DB.records).sort().reverse();
  for(const d of days){
    const ex=DB.records[d]&&DB.records[d].extra;
    const side=ex&&ex.side||{};
    if(side[taskName] || (DB.sideQuests||[]).some(s=>s.name===taskName && (s.history||[]).some(h=>h.date===d))){
      streak++; 
    } else break;
  }
  return streak;
}

/* ---------- 庆祝动画：彩纸雨 + 烟花（像素风） ---------- */
function celebrate(reason){
  if(!reason) reason='升级啦！';
  let layer=$('#fxLayer');
  if(!layer){ layer=document.createElement('div'); layer.id='fxLayer'; document.body.appendChild(layer); }
  layer.classList.add('fx-show');

  const colors=['#c0a16b','#7d9eb0','#8fae8a','#c08a7a','#b8a9b0','#4a86b5'];
  for(let i=0;i<48;i++){
    const c=document.createElement('span');
    c.className='confetti';
    c.style.left=Math.random()*100+'vw';
    c.style.background=colors[i%colors.length];
    c.style.animationDelay=(Math.random()*0.6)+'s';
    c.style.animationDuration=(1.6+Math.random()*1.2)+'s';
    layer.appendChild(c);
  }
  // 烟花粒子
  for(let i=0;i<5;i++){

/* ---------- 统一成就解锁入口（整合：改名继承 + 属性点 + 动画触发） ---------- */
// 每次主线/支线/碎片打卡，传入任务名 + 所属类型
function onTaskProgress(taskName, kind){
  const wasNew = !(DB.achievementBook||(DB.achievementBook={}))[taskName];
  const achvName = recordAchievement(taskName);   // 内部已处理阶级升级
  const data = (DB.achievementBook||{})[taskName]||{count:0,tier:0};
  const prevTier = data.tier - (achvName&&wasNew?0:0);  // 近似：由下方精确判断
  const newTier = data.tier;
  // 精确判断是否升阶或首次解锁
  const justPromoted = (newTier > 1 && data.count && getTierByCount(data.count-1) < newTier);
  const justFirst = (newTier===1 && data.count===1);
  // 属性点（打卡1次）
  const attrUnlocked = awardAttrs(taskName, 1);
  // 连续打卡≥5天
  const streak = checkStreak(taskName);
  let reason=null;
  if(justFirst) reason='🏅 新成就解锁！';
  if(justPromoted) reason='🌟 成就升阶！';
  if(attrUnlocked.length){ reason=(reason?reason+' · ':'')+'✨ 属性徽章点亮'; }
  if(streak>=5 && streak%5===0) reason=(reason?reason+' · ':'')+`🔥 ${streak}天连击！`;
  if(reason) celebrate(reason);
  return achvName;
}

  if(!r.giftPool||typeof r.giftPool!=='object') r.giftPool={low:def.giftPool.low,mid:def.giftPool.mid,high:def.giftPool.high};
  if(!r.giftPool.tiers) r.giftPool.tiers={low:def.giftPool.low,mid:def.giftPool.mid,high:def.giftPool.high};
  if(!r.weightReward){
    r.weightReward={t1:{loss:1,gift:'10元以下礼品（如发圈/贴纸）'},t2:{loss:3,gift:'20元以下礼品（如护手霜/书签）'},t3:{loss:5,gift:'20元以下礼品 + ¥10 游戏金'}};
  }
  if(!Array.isArray(r.healthHistory)) r.healthHistory=[];
  if(!r.healthCycle||typeof r.healthCycle!=='object') r.healthCycle={active:false,startDate:null,length:10,dayInCycle:0};
  if(!Array.isArray(r.cycleArchive)) r.cycleArchive=[];   // 赛季归档数组
  if(!r.achievementBook||typeof r.achievementBook!=='object') r.achievementBook={};
  // —— 习惯记录：旧版用 value(字符串) 存单条，迁移为 logs(数组) 支持多条记录 ——
  if(!Array.isArray(r.extraFields)) r.extraFields=def.extraFields;
  r.extraFields.forEach(function(f){
    if(typeof f.value==='string' && !Array.isArray(f.logs)){f.logs=f.value.trim()?[{time:'',text:f.value,feel:''}]:[]}
    if(!Array.isArray(f.logs)) f.logs=[];
    delete f.value;
    if(!f.key) f.key='ex'+(Date.now()+Math.random());
  });
  r.version=9;
  // —— 属性点 → 金钱：初始化"已结算基准"，再补齐差额 ——
  if(r._lastAttrTotal===undefined||r._lastAttrTotal===0){
    // 老数据/首次：把当前已有属性点视为"已结算"，避免刷新后重复加钱
    const tot=Object.values(r.attrPoints||{}).reduce((s,v)=>s+(v||0),0);
    r._lastAttrTotal=tot;
  }
  // 生存工资：已发到哪个日期（首次初始化为昨天，今天由 dailyTick 发）
  if(!r._survivalUpTo){ const d=new Date(todayStr()); d.setDate(d.getDate()-1); r._survivalUpTo=dateKey(d); }
  if(r._survivalTotal===undefined) r._survivalTotal=0;   // ⑤ 生存工资累计

  if(r._limitedReward===undefined) r._limitedReward=0;     // ② 限时计划奖励累计
  return r;
};

function processDailyMoney(){
  const start=new Date(DB.startDate), end=new Date(todayStr());
  for(let d=new Date(start);d<=end;d.setDate(d.getDate()+1)){
    const key=dateKey(d);
    if(key===todayStr()) break;
    const rec=DB.records[key];
    if(rec && !rec.moneyEarned && hasAnyRecord(rec)){rec.moneyEarned=1;DB.savings+=1;DB._recordBonus=(DB._recordBonus||0)+1}
  }
  save();
}

/* ⑤ 生存工资 ¥0.5/天 —— 过零点自动发，奖励自己又活了一天，用来买东西
   按真实日期逐个补发：断更不漏、重复不多（_survivalUpTo 记录已发到哪天） */
function processSurvivalWage(){
  const start=new Date(DB.startDate), end=new Date(todayStr());
  for(let d=new Date(start);d<=end;d.setDate(d.getDate()+1)){
    const key=dateKey(d);
    if(key===todayStr()) break;            // 今天留到"下一次打开/过零点"再发，只发过去的完整一天
    if(key<=DB._survivalUpTo) continue;    // 已发过的绝不再发
    DB.savings=Number((DB.savings+0.5).toFixed(2));
    DB._survivalTotal=(DB._survivalTotal||0)+0.5;
    DB._survivalUpTo=key;
  }
  save();
}

  if(Object.keys(rec.side||{}).length>0) return true;
  return false;
}

function tierType(idx){
  if(idx<=1) return 'trunk';
  if(idx===2) return 'leaf';
  if(idx===3||idx===4) return 'leaf';
  return 'flower';
}
function treeEmoji(tier,reached){
  const map={trunk:'🪵',leaf:'🍃',flower:'🌸'};
  return reached?map[tier]:'·';
}

════════════════════════════════════════════════════════════════ */
function cycleDays(){
  const cyc=DB.cycle||{};
  if(!cyc.active||!cyc.startDate) return [];
  const start=new Date(cyc.startDate),len=cyc.length||10;
  const list=[];
  for(let i=0;i<len;i++){const d=new Date(start);d.setDate(start.getDate()+i);const key=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;list.push(key)}
  // 只返回已经"发生过的"天（含今天），未到来的不显示
  const today=todayStr();
  return list.filter(k=>k<=today);
}
function markGlyph(m){if(m==='✅')return '✅';if(m==='⭐')return '⭐';if(m==='❤️')return '❤️';if(m==='⚠️')return '⚠️';return ''}

const PAGES=['home','timeline','health','universe','matrix','challenges','retro','letters','savings','gifts','honor','settings'];
const PAGE_META={
  home:{t:'🏠 主界面',d:''},
  timeline:{t:'🌸 今日记录',d:''},
  health:{t:'🏆 健康人生',d:''},
  universe:{t:'🎮 任务面板',d:'主线计划 · 每日支线 · 习惯记录'},
  matrix:{t:'📅 周期打卡一览',d:''},
  challenges:{t:'⏰ 限时挑战',d:''},
  retro:{t:'📜 时光回溯',d:''},
  letters:{t:'✉️ 定时信箱',d:''},
  savings:{t:'💎 存钱计划',d:''},
  gifts:{t:'🎁 礼物池',d:''},
  honor:{t:'🏆 荣誉墙',d:''},
  settings:{t:'⚙️ 设置',d:''},
  // 保留旧 key 别名（兼容迁移）
  tree:undefined, achievements:undefined,
};

function navHTML(){
  let html='';
  for(const k of PAGES){
    const m=PAGE_META[k];
    html+=`<button data-p="${k}" class="${k===currentPage?'active':''}" onclick="go('${k}')">
      <span class="ico">${m.t.split(' ')[0]}</span><span>${m.t.split(' ').slice(1).join(' ')||m.t}</span></button>`;
  }
  return html;
}
function bornDays(){return totalDays()}
function currentCycle(){
  const cyc=DB.cycle||{};
  const finished=(DB.successfulCycles||0)+(cyc.active?1:0);
  if(!cyc.active){return {cycle:finished+1, day:null, active:false}}
  return {cycle:finished, day:cyc.dayInCycle||1, active:true};
}
function refreshStats(){
  $('#statDay').textContent=bornDays();
  $('#statMoney').textContent=DB.savings;
  const t=today();
  $('#statWord').textContent=t.wordCount||0;
  const c=currentCycle();
  const cycTxt=c.active?`Cycle ${c.cycle} · Day ${c.day}`:`Cycle ${c.cycle} · 还未开始计划`;
  $('#sideDay').textContent=cycTxt+` · ${DB.playerName||''}`;
  const hc=$('#homeCycle'); if(hc){hc.textContent=cycTxt}
}

function render(){
  $('#nav').innerHTML=navHTML();
  refreshStats();
  const page=$('#page');
  page.innerHTML='';
  const renderMap={
    home:renderHome,timeline:renderTimeline,universe:renderUniverse,
    quests:renderUniverse,side:renderUniverse,extras:renderUniverse,
    tree:renderHonor,matrix:renderMatrix,savings:renderSavings,gifts:renderGifts,
    retro:renderRetro,letters:renderLetters,challenges:renderChallenges,settings:renderSettings,
    health:renderHealth,achievements:renderHonor,honor:renderHonor
  };
  (renderMap[currentPage]||renderHome)(page);
  refreshStats();
  window.scrollTo(0,0);
}

/* ---------- 成就生成引擎 ---------- */
function getTaskLabelGroup(taskName){
  // 根据任务名找到所属标签和key
  for(const gk of Object.keys(ACHIEVEMENT_GROUPS)){
    const g=ACHIEVEMENT_GROUPS[gk];
    if(g.tasks.includes(taskName)){
      return {group:gk, key:taskName};
    }
  }
  // 默认归入生存印记
  return {group:'survival', key:taskName};
}

function genAchievementName(taskName, count){
  // count: 该任务已完成次数（>=1）
  const {group, key} = getTaskLabelGroup(taskName);
  const taskData = ACHIEVEMENT_WORDS[group] && ACHIEVEMENT_WORDS[group][key];
  if(!taskData){
    // 未预设词库的任务，用通用规则
    return genGenericAchievement(taskName, count);
  }
  // 计算当前阶级 (1-7)
  const tier = Math.min(7, Math.max(1, Math.ceil(count / 10) * 0 + getTierByCount(count)));
  // 从词库中随机选一个
  const names = taskData[tier] || taskData[7];
  return pick(names);
}

function getTierByCount(count){
  // 阶级阈值：1-10次=阶级1, 11-20=2, ... 每10次升一阶
  // 但用更细的密度：1,2,3,5,10,20,30,50,80,100...
  const th=[1,2,3,5,10,20,30];
  for(let i=th.length-1;i>=0;i--){
    if(count>=th[i]) return i+1;
  }
  return 1;
}

function genGenericAchievement(taskName, count){
  const tier = getTierByCount(count);
  const generic = {
    1:['初次接触','初体验','第一回'],
    2:['渐入佳境','再次挑战','又进一步'],
    3:['小有所成','渐入佳境','略有心得'],
    4:['熟练上手','得心应手','渐入佳境'],
    5:['行家里手','游刃有余','小有所成'],
    6:['炉火纯青','登堂入室','行家里手'],
    7:['登峰造极','出神入化','一代宗师']
  };
  const names = generic[tier] || generic[7];
  return `${taskName}·${pick(names)}`;
}

/* ---------- 成就解锁/记录 ---------- */
function recordAchievement(taskName){
  // 在时间线记录时调用，自动生成成就名并解锁阶级
  const book = DB.achievementBook;
  const {group, key} = getTaskLabelGroup(taskName);
  if(!book[key]) book[key]={count:0, tier:0};
  book[key].count++;
  const newTier = getTierByCount(book[key].count);
  let achvName = null;
  if(newTier > book[key].tier){
    book[key].tier = newTier;
    achvName = genAchievementName(key, book[key].count);
  } else {
    // 同阶级内换名称
    achvName = genAchievementName(key, book[key].count);
  }
  return achvName;
}

function healthDays(){
  const hc=DB.healthCycle||{};
  if(!hc.active||!hc.startDate) return [];
  const start=new Date(hc.startDate), len=hc.length||10;
  const list=[];
  for(let i=0;i<len;i++){const d=new Date(start);d.setDate(start.getDate()+i);const key=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;list.push(key)}
  return list.filter(k=>k<=todayStr());
}

function ensureHealthFields(rec){
  rec.extra=rec.extra||{};
  if(typeof rec.extra!=='object'||Array.isArray(rec.extra)) rec.extra={};
  return rec.extra;
}
function healthSeries(){
  const out=[];
  for(const d of Object.keys(DB.records).sort()){
    const v=(DB.records[d]&&DB.records[d].extra&&DB.records[d].extra.weight);
    if(v!=null&&v!==''){const n=parseFloat(v);if(!isNaN(n))out.push({date:d,weight:n});}
  }
  return out;
}

function saveHealth(){
  const w=parseFloat($('#hwInput').value);
  const f=($('#hfInput').value||'').trim();
  const water=parseFloat($('#hWaterInput').value)||0;
  const sleep=parseFloat($('#hSleepInput').value)||0;
  if(isNaN(w)&&!f&&!water&&!sleep){alert('至少填一项吧～');return}
  const today=todayStr();
  const rec=DB.records[today]||(DB.records[today]={timeline:[],mainMarks:{},side:{},extra:{},wordCount:0,weight:null,moneyEarned:0,locked:false,date:today});
  const ex=ensureHealthFields(rec);
  if(!isNaN(w)){ex.weight=w;rec.weight=w;}
  if(f) ex.food=f;
  if(water) ex.water=water;
  if(sleep) ex.sleep=sleep;
  const hh=DB.healthHistory;
  let idx=hh.findIndex(h=>h.date===today);
  const snap={date:today,weight:ex.weight||null,food:f||ex.food||''};
  if(idx>=0)hh[idx]=snap;else hh.push(snap);
  if(DB.healthCycle.active){DB.healthCycle.dayInCycle=healthDays().length;}
  recordAchievement('体重管理');
  tryEarnToday();save();
  $('#hwInput').value='';$('#hfInput').value='';$('#hWaterInput').value='';$('#hSleepInput').value='';
  render();
}

function startHealthCycle(){
  DB.healthCycle={active:true,startDate:todayStr(),length:10,dayInCycle:1};
  save();render();
}
function endHealthCycle(){
  const span=healthSeries().slice(-10);
  if(span.length>=2){
    const lost=-(span[span.length-1].weight-span[0].weight);
    const wr=DB.weightReward;
    let granted=null;
    if(lost>=wr.t3.loss)granted=wr.t3;else if(lost>=wr.t2.loss)granted=wr.t2;else if(lost>=wr.t1.loss)granted=wr.t1;
    if(granted){
      const moneyMatch=(String(granted.gift).match(/¥(\d+)/)||[])[1];
      const money=moneyMatch?parseInt(moneyMatch):0;
      if(money>0){DB.savings+=money;DB._limitedReward=(DB._limitedReward||0)+money;}
      DB.correctionLog.push({date:todayStr(),action:'【健康人生·10天减重奖励】自动发放',orig:`10天减重${lost.toFixed(1)}斤`,new:(money>0?`+¥${money} + `:'')+granted.gift});
    }
  }
  DB.healthCycle.active=false;save();render();
}

function drawHealthChart(ws){
  const c=$('#healthChart');if(!c)return;
  const dpr=window.devicePixelRatio||1;
  const W=Math.max(240,(c.parentElement?c.parentElement.clientWidth:0)||(window.innerWidth||360)-80);
  const H=150;
  c.width=W*dpr;c.height=H*dpr;c.style.width=W+'px';c.style.height=H+'px';
  const ctx=c.getContext('2d');ctx.scale(dpr,dpr);
  const padL=30,padR=12,padT=16,padB=20;
  const vals=ws.map(w=>w.weight);
  let min=Math.min(...vals),max=Math.max(...vals);
  if(max-min<1){min-=0.5;max+=0.5;}
  const iw=W-padL-padR,ih=H-padT-padB;
  const stepX=iw/(ws.length-1);
  const yOf=v=>padT+ih-(v-min)/(max-min)*ih;
  ctx.strokeStyle='rgba(125,158,176,.18)';ctx.lineWidth=1;
  for(let g=0;g<=3;g++){const y=padT+ih*g/3;ctx.beginPath();ctx.moveTo(padL,y);ctx.lineTo(W-padR,y);ctx.stroke();}
  ctx.setLineDash([4,4]);ctx.strokeStyle='rgba(192,161,107,.6)';
  ctx.beginPath();ctx.moveTo(padL,yOf(ws[0].weight));ctx.lineTo(W-padR,yOf(ws[0].weight));ctx.stroke();ctx.setLineDash([]);
  ctx.strokeStyle='#7d9eb0';ctx.lineWidth=3;ctx.lineJoin='round';ctx.lineCap='round';
  ctx.beginPath();
  ws.forEach((w,i)=>{const x=padL+i*stepX,y=yOf(w.weight);if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y);});
  ctx.stroke();
  ws.forEach((w,i)=>{
    const x=padL+i*stepX,y=yOf(w.weight);
    ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(x,y,4,0,7);ctx.fill();
    ctx.fillStyle='#c0a16b';ctx.beginPath();ctx.arc(x,y,2.6,0,7);ctx.fill();
    ctx.fillStyle='#3a4250';ctx.font='10px sans-serif';
    ctx.textAlign=(i===0?'left':(i===ws.length-1?'right':'center'));
    ctx.fillText(w.weight.toFixed(1),x,i===0?y+14:y-8);
  });
}

/* ════════════════════════════════════════════════════════════════
   📋 习惯记录 · 按日期分组 + 折叠 + 跨天封存
   - 每条记录自动带完整时间戳（YYYY-MM-DD HH:MM）
   - 当天写的 = 可编辑/可删除；跨天后自动封存 → 🔒 只读
   - 按日期分组，默认折叠（点击展开），新的在上面
════════════════════════════════════════════════════════════════ */
// 获取某条记录所属的日期（优先用 _date 字段，兼容旧数据）
function logDate(l){return l._date||todayStr()}
// 判断某条记录是否已封存（日期 < 今天）
function isLogSealed(l){return logDate(l)<todayStr()}
// 按日期分组，返回 [{date, logs:[...]}]，日期从新到旧
function groupLogsByDate(logs){
  var groups={};
  for(var i=0;i<logs.length;i++){
    var d=logDate(logs[i]);
    if(!groups[d])groups[d]=[];
    groups[d].push(logs[i]);
  }
  var dates=Object.keys(groups).sort(function(a,b){return a>b?-1:1}); // 从新到旧
  return dates.map(function(d){
    // 每组内也从新到旧
    var arr=groups[d].slice().sort(function(a,b){
      var ta=(a.time||'00:00'), tb=(b.time||'00:00');
      return ta>tb?-1:1;
    });
    return {date:d, logs:arr};
  });
}

  var locked=isLocked();var out='';
  for(var i=0;i<DB.extraFields.length;i++){
    var f=DB.extraFields[i];
    var logs=(f.logs||[]);
    var groups=groupLogsByDate(logs);
    var todayN=fragTodayCount(f), totalN=fragTotalCount(f);

    // —— 渲染每个日期分组（折叠卡片）——
    var groupHtml=groups.map(function(grp,gi){
      var isToday=(grp.date===todayStr());
      var sealed=!isToday; // 非今天的全部封存
      var dateLabel=isToday?'今天':grp.date;
      var countBadge=grp.logs.length+'条';
      var sealIcon=sealed?'🔒 已封存':'📝 当日可编辑';
      var sealClass=sealed?'frag-group-sealed':'frag-group-today';

      var logHtml=grp.logs.map(function(l){
        // realIdx：在原数组中的下标（用于删除）
        var realIdx=f.logs.indexOf(l);
        // 只有"当天的"才可以删除
        var canDelete=isToday && !locked;
        return '<div class="frag-log '+(sealed?'frag-log-sealed':'')+'">'+
          (canDelete?'<button class="f-del" onclick="delFragLog('+i+','+realIdx+')" title="删除这条">🗑️</button>':'<span class="f-del-placeholder"></span>')+
          '<div class="f-time">'+(l.time||'--:--')+'</div>'+
          '<div class="f-text">'+esc(l.text||'')+'</div>'+
          (l.feel?'<div class="f-feel">💭 '+esc(l.feel)+'</div>':'')+
        '</div>';
      }).join('');

      // 默认：今天展开，历史折叠
      var defaultOpen=isToday?' open':'';
      return '<details class="frag-group '+sealClass+defaultOpen+'" data-group="'+grp.date+'">'+
        '<summary class="frag-group-header">'+
          '<span class="frag-group-date">📅 '+esc(dateLabel)+'</span>'+
          '<span class="frag-group-count">'+countBadge+'</span>'+
          '<span class="frag-group-seal">'+sealIcon+'</span>'+
          '<span class="frag-group-arrow">▾</span>'+
        '</summary>'+
        '<div class="frag-group-body">'+logHtml+'</div>'+
      '</details>';
    }).join('');

    out+='<div class="frag-card">'+
      '<div class="frag-head">'+
        '<input class="f-name" value="'+esc(f.name)+'" '+(locked?'readonly':'')+' onchange="renameExtra('+i+',this.value)" placeholder="习惯名称">'+
        '<span class="frag-count">今日 <b>'+todayN+'</b> · 总计 <span class="total">'+totalN+'</span></span>'+
        (locked?'':'<button class="q-del" onclick="delExtra('+i+')" title="删除此习惯">🗑️</button>')+
      '</div>'+
      '<div class="frag-groups">'+(groupHtml||'<div class="frag-empty">还没有记录，在下方添加第一条 ✍️</div>')+'</div>'+
      (locked?'':'<div class="frag-add">'+
        '<div class="f-row">'+
          '<input class="f-time-input" type="text" value="'+nowHM()+'" id="fragTime'+i+'" placeholder="HH:MM">'+
          '<input class="f-text-input" type="text" id="fragText'+i+'" placeholder="我做了什么…（如：蹲了20分钟刷手机）">'+
          '<input class="f-feel-input" type="text" id="fragFeel'+i+'" placeholder="感受（可选，如：腿麻了有点懊恼）">'+
        '</div>'+
        '<button onclick="onAddFrag('+i+')">＋ 添加记录</button>'+
      '</div>')+
    '</div>';
  }
  return out||'<div class="empty" style="padding:10px">还没有碎片字段，点击下方添加。</div>';
}

  const d=today();d.mainMarks=d.mainMarks||{};

function startCycle(){
  if(isLocked())return;
  const len=parseInt($('#cycleLen').value)||10;
  DB.cycle={active:true,length:len,dayInCycle:1,startDate:todayStr(),mainSnap:null,sideSnap:null,extraSnap:null};
  DB.successfulCycles=DB.successfulCycles||0;
  snapshot();save();render();
}
function endCycle(){
  if(!confirm('确定结算此周期？\n\n结算后将：\n① 计为【成功完成】1个周期，Cycle 编号 +1\n② 当前周期的所有记录自动封存归档（不可再改，可在「📜 时光回溯」查看）\n③ 主线/支线/碎片全部清空，从零开始新赛季 ✨\n\n注意：强制删除/清除数据导致的失败不会计入统计。'))return;

  // —— ① 封存归档：把当前 10 天的 records 打包存到 cycleArchive ——
  const cycleNo=(DB.successfulCycles||0)+1;
  const cycleStart=DB.cycle.startDate;
  const cycleDays=Object.keys(DB.records).filter(d=>d>=cycleStart).sort();
  DB.cycleArchive=DB.cycleArchive||[];
  DB.cycleArchive.push({
    no:cycleNo,
    startDate:cycleStart,
    endDate:todayStr(),
    days:cycleDays,
    mainQuests:JSON.parse(JSON.stringify(DB.mainQuests)),
    sideQuests:JSON.parse(JSON.stringify(DB.sideQuests)),
    extraFields:JSON.parse(JSON.stringify(DB.extraFields)),
    progression:JSON.parse(JSON.stringify(DB.progression||{})),
    summary:null, // 由 runCycleSummary 填充
  });

  // —— ② 赛季清空：主线/支线/碎片全部重置为默认值，从零开始 ——
  DB.mainQuests=defaultDB().mainQuests.map((q,idx)=>({...q,id:'M'+(idx+1)}));
  DB.sideQuests=defaultDB().sideQuests.map((q,idx)=>({...q,count:0,locked:false}));
  DB.extraFields=defaultDB().extraFields.map(f=>({...f,logs:[]}));
  // 进阶进度也清零
  DB.progression={};
  for(const q of DB.mainQuests){
    DB.progression[q.id]={level:1,tiers:defaultDB().progression[q.id]?.tiers||['初阶','进阶','高阶','大师','宗师','巅峰','传奇']};
  }

  // —— ③ 清空当前周期 records（已归档，不丢）——
  if(cycleStart){
    cycleDays.forEach(d=>{delete DB.records[d]});
  }

  // —— ④ 重置周期状态 ——
  DB.successfulCycles=(DB.successfulCycles||0)+1;
  DB.cycle={active:false,length:10,dayInCycle:0,startDate:null,mainSnap:null,sideSnap:null,extraSnap:null};

  // —— ⑤ 迁移进阶路线：标记赛季重置（成就书保留）
  DB.correctionLog.push({date:todayStr(),action:'赛季重置',orig:'Cycle '+cycleNo+' 已封存归档',new:'新赛季从零开始'});

  save();render();
  alert('✅ 第 '+cycleNo+' 周期已封存归档！\n\n📜 旧记录可在「时光回溯」查看\n🎮 新赛季已开始，主线/支线/碎片全部清空，从零出发 ✨');
}

/* ---- 进阶 ---- */
function checkProgression(){
  const prog=DB.progression;
  for(const q of DB.mainQuests){
    const p=prog[q.id];if(!p)continue;
    const marks=Object.values(today().mainMarks||{});
    if(marks.includes('✅')||marks.includes('⭐')||marks.includes('❤️')){
      p._count=(p._count||0)+1;
      const th=[1,3,7,15,30,60,100];
      for(let i=0;i<7;i++){if(p._count>=th[i])p.level=i+1}
    }
  }
}

function buyWish(i){
  const w=DB.wishlist[i];if(DB.savings<w.price)return alert('余额不足');

function runCycleSummary(){
  const days=Object.keys(DB.records).sort();
  if(!days.length)return $('#cycleResult').innerHTML='<div class="empty">暂无数据</div>';
  let total=0,done=0;
  for(const d of days.slice(-10)){
    const rec=DB.records[d];
    for(const q of DB.mainQuests){total++;if((rec.mainMarks||{})[q.id]&&(rec.mainMarks[q.id]!=='⚠️'))done++}
  }
  const rate=total?Math.round(done/total*100):0;
  let grade='C',gcol='r',rewardMoney=0,rewardPhysical='无';
  if(rate>=80){grade='S';gcol='g';rewardMoney=DB.rewardRules.r3.money;rewardPhysical=DB.rewardRules.r3.physical;}
  else if(rate>=60){grade='A';gcol='b';rewardMoney=DB.rewardRules.r2.money;rewardPhysical=DB.rewardRules.r2.physical;}
  else if(rate>=40){grade='B';gcol='b';rewardMoney=DB.rewardRules.r1.money;rewardPhysical=DB.rewardRules.r1.physical;}
  if(rewardMoney>0){
    DB.savings+=rewardMoney;
    DB.correctionLog.push({date:todayStr(),action:'周期主线奖励自动发放',orig:`完成率${rate}%`,new:`+¥${rewardMoney}`});
  }
  const promo=DB.sideQuests.filter(s=>s.count>=10).map(s=>s.name).join('、')||'无';
  const ws=days.map(d=>DB.records[d].weight).filter(v=>v!=null);
  const delta=ws.length>=2?(ws[ws.length-1]-ws[0]):null;
  ensureGiftPool();
  const wTiers=[DB.weightReward.t1,DB.weightReward.t2,DB.weightReward.t3].slice().sort((a,b)=>b.loss-a.loss);
  let weightRewardMsg='无（未达奖励阈值）';
  if(delta!==null){
    const lost=-delta;
    let granted=null;
    for(const t of wTiers){if(lost>=t.loss){granted=t;break}}
    if(granted){
      const moneyMatch=String(granted.gift).match(/¥(\d+)/);
      const add=moneyMatch?parseInt(moneyMatch[1]):0;
      if(add>0){DB._cycleReward=(DB._cycleReward||0)+add;}
      if(add>0){DB.savings+=add}
      weightRewardMsg=`减${lost.toFixed(1)}斤 → ${granted.gift}`;
      DB.correctionLog.push({date:todayStr(),action:'【减重奖励·独立】自动发放',orig:`减重${lost.toFixed(1)}斤`,new:(add>0?`+¥${add} + `:'')+granted.gift});
    } else {
      weightRewardMsg=`变化${lost.toFixed(1)}斤，未达奖励阈值`;
    }
  }
  // 第12条：总结集合化 —— 食物热力 + 每日打卡快照（主线/支线/碎片）
  const spanDays=days.slice(-10);
  const foodHeat=spanDays.map(d=>{
    const rec=DB.records[d];if(!rec)return '';
    const food=(rec.extra||[]).find(e=>e.key==='food')?.value||rec.food||'';
    const mm=rec.mainMarks||{};
    const mainDone=DB.mainQuests.filter(q=>mm[q.id]&&mm[q.id]!=='⚠️').length;
    if(!food&&mainDone===0) return '';
    const cls=food?'has-food':'';
    return `<div class="heat-day ${cls}" style="width:auto;padding:0 8px;font-size:11px">${d.slice(5)}<span class="tip">${d}${food?'\n🍽️ '+esc(food.slice(0,20)):''}\n主线 ${mainDone}/${DB.mainQuests.length}</span></div>`;
  }).join('');
  const snapRows=spanDays.map(d=>{
    const rec=DB.records[d]||{mainMarks:{},side:{},extra:{}};
    const mm=rec.mainMarks||{};
    const mainGlyph=q=>{const m=mm[q.id];if(!m)return '<span style="color:#ddd">·</span>';if(m==='⚠️')return '⚠️';return '✅';};
    const sideDone=Object.keys(rec.side||{}).length;
    const extraDone=Object.keys(rec.extra||{}).length;
    return `<tr>
      <td style="font-weight:600;color:var(--ink-soft)">${d.slice(5)}</td>
      ${DB.mainQuests.map(q=>`<td style="text-align:center">${mainGlyph(q)}</td>`).join('')}
      <td style="text-align:center;color:var(--accent)">${sideDone}</td>
      <td style="text-align:center;color:var(--warn)">${extraDone}</td>
    </tr>`;
  }).join('');
  const theadSnap=`<tr style="font-size:10px;color:var(--ink-soft)">
    <th>日期</th>${DB.mainQuests.map(q=>`<th>${q.id}</th>`).join('')}
    <th>支线</th><th>碎片</th></tr>`;
  const html=`
  <div class="summary-box" style="padding:0;overflow:hidden">
    <div style="background:var(--panel-solid);padding:14px 20px;border-bottom:2px solid var(--gold);font-size:16px;font-weight:700;color:var(--accent)">
      📍 开新地图前总结（近10天）
    </div>
    <div style="padding:18px">
      <div style="margin-bottom:18px">
        <div style="font-size:13px;color:var(--ink-soft);margin-bottom:6px;font-weight:600">📊 主线完成率</div>
        <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap">
          <span style="font-size:36px;font-weight:900;color:var(--ink);font-family:var(--pixel)">${rate}%</span>
          <span class="pill ${gcol}" style="font-size:14px;padding:4px 14px">评级 ${grade}</span>
        </div>
        <div style="margin-top:10px;font-size:14px;color:var(--ink)">
          💰 奖励：<strong style="color:var(--gold);font-size:16px">¥${rewardMoney}</strong> + 实物【${rewardPhysical}】
          <span style="color:var(--good);font-size:12px;margin-left:4px">（已自动发放）</span>
        </div>
      </div>
      <div style="background:rgba(125,158,176,.08);border:1.5px solid var(--accent);border-radius:10px;padding:14px;margin-bottom:16px">
        <div style="font-size:13px;color:var(--ink-soft);margin-bottom:8px;font-weight:600">🌳 进阶进度</div>
        <div style="font-size:13px;color:var(--ink);line-height:1.8">
          ${DB.mainQuests.map(q=>{
            const iconMap={M1:'🌙',M2:'✍️',M3:'⚖️',M4:'🧠',M5:'🧴',M6:'🦷'};
            return `${iconMap[q.id]||'🔹'} ${q.name} <strong>Lv.${((DB.progression[q.id]||{}).level||1)}</strong>`;
          }).join('<br>')}
        </div>
        <div style="font-size:13px;color:var(--ink-soft);margin-top:10px;padding-top:8px;border-top:1px dashed var(--line)">
          🔄 支线晋升：<strong>${promo}</strong>
        </div>
      </div>
      <div style="background:rgba(192,138,122,.06);border:1.5px solid var(--warn);border-radius:10px;padding:14px;margin-bottom:16px">
        <div style="font-size:13px;color:var(--ink-soft);margin-bottom:8px;font-weight:600">⚖️ 体重变化</div>
        <div style="font-size:14px;color:var(--ink);margin-bottom:6px">
          ${ws[0]||'—'} <span style="color:var(--ink-soft)">→</span> ${ws[ws.length-1]||'—'}
          <span style="font-size:13px;color:var(--ink-soft);margin-left:4px">(${delta!==null?(delta>0?'+':'')+delta.toFixed(1):'—'})</span>
        </div>
        <div style="font-size:13px;color:var(--warn);margin-top:8px;padding-top:8px;border-top:1px dashed var(--line)">
          🎁 <strong>减重奖励（独立分区）</strong>：<span style="color:var(--ink)">${weightRewardMsg}</span>
          <span style="color:var(--good);font-size:12px">（已自动判定）</span>
        </div>
      </div>
      <div style="background:rgba(143,174,138,.08);border:1.5px solid var(--good);border-radius:10px;padding:14px;margin-bottom:16px">
        <div style="font-size:13px;color:var(--ink-soft);margin-bottom:8px;font-weight:600">🍽️ 饮食习惯 & 每日打卡（近10天）</div>
        <div style="font-size:11px;color:var(--ink-soft);margin-bottom:8px">每个色块 = 一天（悬停查看当日进食 / 主线进度）</div>
        <div class="heatmap" style="display:flex;gap:6px;flex-wrap:wrap">${foodHeat||'<span style="color:var(--ink-soft)">暂无记录</span>'}</div>
        <div style="margin-top:12px;overflow-x:auto">
          <table style="width:100%;border-collapse:collapse;font-size:12px;min-width:420px">
            <thead>${theadSnap}</thead>
            <tbody>${snapRows||'<tr><td colspan="20" style="text-align:center;color:var(--ink-soft)">暂无打卡数据</td></tr>'}</tbody>
          </table>
        </div>
        <div style="font-size:11px;color:var(--ink-soft);margin-top:6px">列：主线任务打卡 ✅ / 支线打卡数 / 碎片记录数（碎片不影响主线完成率）</div>
      </div>
      <div style="background:var(--ink);color:#fff;border-radius:10px;padding:14px;text-align:center;font-size:15px">
        🐷 存钱余额：<strong style="font-size:20px;color:var(--gold)">¥${DB.savings}</strong>
      </div>
    </div>
  </div>`;
  $('#cycleResult').innerHTML=html;
  DB.archive.push({date:todayStr(),type:'10day',content:html});
  save();refreshStats();
}

function drawWeightChart(weights,allDays){
  requestAnimationFrame(()=>{
    const c=$('#weightChart');if(!c)return;
    const ctx=c.getContext('2d');
    const W=c.width=c.parentElement.clientWidth-28, H=200;
    c.height=H;
    const vals=weights.map(w=>w.w);
    const min=Math.min(...vals)-2, max=Math.max(...vals)+2;
    const step=W/(weights.length-1);
    ctx.strokeStyle='#7d9eb0';ctx.lineWidth=3;
    ctx.beginPath();
    weights.forEach((w,i)=>{const x=i*step,y=H-((w.w-min)/(max-min))* (H-30)-15;if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y)});
    ctx.stroke();
    weights.forEach((w,i)=>{
      const x=i*step,y=H-((w.w-min)/(max-min))* (H-30)-15;
      const rec=DB.records[w.date];
      const food=(rec.extra||[]).find(e=>e.key==='food')?.value||rec.food||'';
      ctx.fillStyle=food.length>0?'#c08a7a':'#b8c4cf';
      ctx.beginPath();ctx.arc(x,y,6,0,7);ctx.fill();
      ctx.fillStyle='#3a4250';ctx.font='11px sans-serif';
      ctx.fillText(w.w,x-8,y-10);
    });
  });
}

// 8档里程碑定义（天数 → 游戏化名称 + 图标）
const MILESTONES = [
  {days:7,  icon:'🌱', name:'破土重生日'},
  {days:10, icon:'🗺️', name:'新新世界'},
  {days:15, icon:'⚔️', name:'试炼进阶'},
  {days:30, icon:'⛰️', name:'登高望远'},
  {days:45, icon:'🌲', name:'独木成林'},
  {days:60, icon:'🌕', name:'双月交汇'},
  {days:80, icon:'🔮', name:'破晓之光'},
  {days:100,icon:'👑', name:'王者加冕日'},
];

function milestoneCard(n){
  const cfg=MILESTONES.find(m=>m.days===n);
  if(!cfg) return '';
  const day=totalDays();
  const reached=day>=cfg.days;
  const left=reached?0:cfg.days-day;
  const iconCls = reached ? 'ms-icon' : 'ms-icon ms-icon-locked';
  const lockBadge = reached ? '' : '<span class="ms-lockbadge">🔒</span>';
  const click = reached ? `onclick="runMilestone(${cfg.days})"` : '';
  return `<div class="ms-card ${reached?'on':'locked'}" ${click}>
      <div class="${iconCls}">${cfg.icon}</div>
      ${lockBadge}
      <div class="ms-name">${cfg.days} 天 · ${cfg.icon}${cfg.name}</div>
      <div class="ms-status">${reached?'点击生成总结 ✨':'还需 '+left+' 天'}</div>
    </div>`;
}
function runMilestone(n){
  const days=Object.keys(DB.records).sort();
  const span=days.slice(-n);
  if(span.length<Math.min(n,2)){return $('#milestoneResult').innerHTML='<div class="empty">该里程碑天数不足，暂无足够数据</div>'}
  let total=0,done=0;
  for(const d of span){
    const rec=DB.records[d];
    for(const q of DB.mainQuests){total++;if((rec.mainMarks||{})[q.id]&&(rec.mainMarks[q.id]!=='⚠️'))done++}
  }
  const rate=total?Math.round(done/total*100):0;
  let grade='C',gcol='r',rewardMoney=0,rewardPhysical='无';
  if(rate>=80){grade='S';gcol='g';rewardMoney=DB.rewardRules.r3.money;rewardPhysical=DB.rewardRules.r3.physical;}
  else if(rate>=60){grade='A';gcol='b';rewardMoney=DB.rewardRules.r2.money;rewardPhysical=DB.rewardRules.r2.physical;}
  else if(rate>=40){grade='B';gcol='b';rewardMoney=DB.rewardRules.r1.money;rewardPhysical=DB.rewardRules.r1.physical;}
  if(rewardMoney>0){
    DB.savings+=rewardMoney;
    DB.correctionLog.push({date:todayStr(),action:`里程碑${n}天主线奖励自动发放`,orig:`完成率${rate}%`,new:`+¥${rewardMoney}`});
  }
  const promo=DB.sideQuests.filter(s=>s.count>=10).map(s=>s.name).join('、')||'无';
  const ws=span.map(d=>DB.records[d].weight).filter(v=>v!=null);
  const delta=ws.length>=2?(ws[ws.length-1]-ws[0]):null;
  ensureGiftPool();
  const wTiers=[DB.weightReward.t1,DB.weightReward.t2,DB.weightReward.t3].slice().sort((a,b)=>b.loss-a.loss);
  let weightRewardMsg='无（未达奖励阈值）';
  if(delta!==null){
    const lost=-delta;
    let granted=null;
    for(const t of wTiers){if(lost>=t.loss){granted=t;break}}
    if(granted){
      const moneyMatch=String(granted.gift).match(/¥(\d+)/);
      const add=moneyMatch?parseInt(moneyMatch[1]):0;
      if(add>0){DB.savings+=add}
      weightRewardMsg=`减${lost.toFixed(1)}斤 → ${granted.gift}`;
      DB.correctionLog.push({date:todayStr(),action:`【里程碑${n}天·减重奖励·独立】自动发放`,orig:`减重${lost.toFixed(1)}斤`,new:(add>0?`+¥${add} + `:'')+granted.gift});
    } else {
      weightRewardMsg=`变化${lost.toFixed(1)}斤，未达奖励阈值`;
    }
  }
  const cfg=MILESTONES.find(m=>m.days===n);
  const iconTitle = cfg ? cfg.icon : '🏆';
  const html=`
  <div class="summary-box" style="padding:0;overflow:hidden">
    <div style="background:var(--panel-solid);padding:14px 20px;border-bottom:2px solid var(--gold);font-size:16px;font-weight:700;color:var(--accent)">
      ${iconTitle} ${n} 天里程碑 · ${cfg?cfg.name:n+'天总结'}
    </div>
    <div style="padding:18px">
      <div style="margin-bottom:18px">
        <div style="font-size:13px;color:var(--ink-soft);margin-bottom:6px;font-weight:600">📊 主线完成率（该里程碑窗口内）</div>
        <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap">
          <span style="font-size:36px;font-weight:900;color:var(--ink);font-family:var(--pixel)">${rate}%</span>
          <span class="pill ${gcol}" style="font-size:14px;padding:4px 14px">评级 ${grade}</span>
        </div>
        <div style="margin-top:10px;font-size:14px;color:var(--ink)">💰 里程碑奖励：<strong style="color:var(--gold);font-size:16px">¥${rewardMoney}</strong> + 实物【${rewardPhysical}】<span style="color:var(--good);font-size:12px">（已自动发放）</span></div>
      </div>
      <div style="background:rgba(125,158,176,.08);border:1.5px solid var(--accent);border-radius:10px;padding:14px;margin-bottom:16px">
        <div style="font-size:13px;color:var(--ink-soft);margin-bottom:8px;font-weight:600">🌳 进阶进度（${DB.mainQuests.length} 个主线）</div>
        <div style="font-size:13px;color:var(--ink);line-height:1.8">
          ${DB.mainQuests.map(q=>{
            const iconMap={M1:'🌙',M2:'✍️',M3:'⚖️',M4:'🧠',M5:'🧴',M6:'🦷'};
            return `${iconMap[q.id]||'🔹'} ${q.name} <strong>Lv.${((DB.progression[q.id]||{}).level||1)}</strong>`;
          }).join('<br>')}
        </div>
        <div style="font-size:13px;color:var(--ink-soft);margin-top:10px;padding-top:8px;border-top:1px dashed var(--line)">🔄 支线晋升：<strong>${promo}</strong></div>
      </div>
      <div style="background:rgba(192,138,122,.06);border:1.5px solid var(--warn);border-radius:10px;padding:14px;margin-bottom:16px">
        <div style="font-size:13px;color:var(--ink-soft);margin-bottom:8px;font-weight:600">⚖️ 体重变化</div>
        <div style="font-size:14px;color:var(--ink);margin-bottom:6px">${ws[0]||'—'} <span style="color:var(--ink-soft)">→</span> ${ws[ws.length-1]||'—'} <span style="font-size:13px;color:var(--ink-soft);margin-left:4px">(${delta!==null?(delta>0?'+':'')+delta.toFixed(1):'—'})</span></div>
        <div style="font-size:13px;color:var(--warn);margin-top:8px;padding-top:8px;border-top:1px dashed var(--line)">🎁 <strong>减重奖励（独立分区）</strong>：${weightRewardMsg}</div>
      </div>
      <div style="background:var(--ink);color:#fff;border-radius:10px;padding:14px;text-align:center;font-size:15px">🐷 存钱余额：<strong style="font-size:20px;color:var(--gold)">¥${DB.savings}</strong></div>
    </div>
  </div>`;
  $('#milestoneResult').innerHTML=html;
  DB.archive.push({date:todayStr(),type:'milestone'+n,content:html});
  save();refreshStats();
}

function renderLetters(page){
  // 仅在有 page 容器（首次由 render() 驱动）时重建整块骨架；否则只刷新列表
  if(page){
    page.innerHTML=`
    <div class="page-title">✉️ 定时信箱</div>
    <p style="font-size:13px;color:var(--ink-soft);margin:-8px 0 14px">
      写给未来的一封信。封存后不可更改、不可删除，直到送达那天自动解锁 🌺
    </p>
    <div class="card" id="letterComposer">
      <div class="field"><label>写给未来的自己</label><textarea id="letterBody" rows="4" placeholder="想对未来的自己说什么…"></textarea></div>
      <div class="field"><label>送达日期</label><input type="date" id="letterDate"></div>
      <button class="btn" id="sealBtn" type="button">封存</button>
    </div>
    <div id="letterList"></div>`;
    // 默认送达日期 = 明天
    const dt=$('#letterDate'); if(dt){ const d=new Date();d.setDate(d.getDate()+1); dt.value=dateKey(d); }
    // 【关键修复】用事件监听代替内联 onclick，彻底避免重绘竞态导致"点了没反应"
    const btn=$('#sealBtn');
    if(btn){ btn.onclick=sendLetter; }
  }

function sendLetter(){
  const bodyEl=$('#letterBody'), dateEl=$('#letterDate');
  const body=bodyEl?bodyEl.value.trim():'', date=dateEl?dateEl.value:'';
  if(!body||!date){ alert('写点内容并选个日期吧'); return; }
  if(date<todayStr()){ alert('送达日期不能选过去，写给未来的自己嘛 💐'); if(dateEl)dateEl.focus(); return; }
  // 读值、push、存档 —— 全程不触碰输入框，避免重绘导致内容丢失
  DB.letters.push({id:Date.now(),body,date,sent:false,createdAt:todayStr()});
  try{ save(); }catch(e){ alert('存档失败：可能是浏览器隐私模式或存储空间已满'); return; }
  // 成功后仅清空输入 + 局部刷新列表（不再整块重绘）
  if(bodyEl)bodyEl.value='';
  if(dateEl){ const d=new Date();d.setDate(d.getDate()+1); dateEl.value=dateKey(d); }
  renderLetterList();
  // 明确成功反馈
  const btn=$('#sealBtn'); if(btn){ btn.textContent='✓ 已封存'; btn.style.background='var(--good)';
    setTimeout(()=>{ if(btn){btn.textContent='封存';btn.style.background='';} },900); }
}

function renderLetterList(){
  const box=$('#letterList'); if(!box)return;
  const today=todayStr();
  // 送达日期从近到远；未送达在前
  const all=[...DB.letters].sort((a,b)=>(a.date>b.date?1:-1));
  const pending=all.filter(l=>l.date>today);   // 未送达：锁定
  const arrived=all.filter(l=>l.date<=today);  // 已送达：解锁

  const renderCard=(l,locked)=>{
    const daysLeft=diffDays(today,l.date);
    // 未送达：只显示密封信封占位，完全不暴露内容（时间胶囊的神秘感）
    if(locked){
      return `<div class="card letter-sealed" style="text-align:center;padding:24px 18px;cursor:pointer" data-preview="${l.id}">
        <div style="font-size:42px;margin-bottom:10px;animation:floaty 3s ease-in-out infinite">✉️</div>
        <div style="font-size:14px;font-weight:700;color:var(--ink)">一封写给未来的信</div>
        <div style="font-size:12px;color:var(--ink-soft);margin-top:6px">
          📅 送达日期：${esc(l.date)}
        </div>
        <div style="font-size:12px;color:var(--accent);margin-top:4px">
          🔒 距离揭晓还有 <b>${daysLeft}</b> 天
        </div>
        <div style="font-size:11px;color:var(--ink-soft);margin-top:10px;padding-top:8px;border-top:1px dashed var(--line)">
          「内容已封存，送达前不可查看」<br>
          封存于 ${esc(l.createdAt||'-')}
        </div>
      </div>`;
    }
    // 已送达：完整展示内容
    return `<div class="card letter-opened">
      <div style="font-size:12px;color:var(--ink-soft)">
        📅 送达 ${esc(l.date)}
        <span class="pill g">已送达 · 已解锁</span>
        <span style="float:right;color:var(--accent)">封存于 ${esc(l.createdAt||'-')}</span>
      </div>
      <div style="margin-top:10px;padding:12px;background:rgba(192,161,107,.08);border-radius:8px;border-left:3px solid var(--gold)">
        <div style="font-size:11px;color:var(--gold);font-weight:600;margin-bottom:6px">🕰️ 来自过去的自己 · ${esc(l.createdAt||'-')}</div>
        <div style="white-space:pre-wrap;font-size:14px;line-height:1.7">${esc(l.body)}</div>
      </div>
      <button class="mini-btn danger" data-del="${l.id}" style="margin-top:10px">删除</button>
    </div>`;
  };

  let html='';
  html+=`<div style="font-size:13px;font-weight:600;margin:16px 0 8px;color:var(--ink)">📬 未送达（${pending.length}）</div>`;
  html+=pending.length?pending.map(l=>renderCard(l,true)).join(''):'<div style="font-size:13px;color:var(--ink-soft);padding:8px 0">暂无未送达的信 ✨</div>';
  html+=`<div style="font-size:13px;font-weight:600;margin:16px 0 8px;color:var(--ink)">📭 已送达（${arrived.length}）</div>`;
  html+=arrived.length?arrived.map(l=>renderCard(l,false)).join(''):'<div style="font-size:13px;color:var(--ink-soft);padding:8px 0">还没有已送达的信，等待时间开启 🕰️</div>';

  box.innerHTML=html;

  // 事件委托：删除按钮 + 密封信件点击预览（不用内联 onclick，避免重绘丢失）
  box.querySelectorAll('button[data-del]').forEach(btn=>{
    btn.onclick=()=>{
      const id=Number(btn.getAttribute('data-del'));
      const letter=DB.letters.find(l=>l.id===id);
      if(!letter)return;
      const ok=confirm(
        '⚠️ 确定要删除这封信吗？\n\n'+
        '送达日期：'+letter.date+'\n'+
        '内容预览：'+(letter.body||'').slice(0,40)+(letter.body.length>40?'…':'')+'\n\n'+
        '此操作无法撤销。'
      );
      if(ok){ delLetter(id); }
    };
  });

  // 点击密封的信 → 弹出"时间未到"的神秘提示
  box.querySelectorAll('.letter-sealed').forEach(el=>{
    el.onclick=()=>{
      const id=Number(el.getAttribute('data-preview'));
      const letter=DB.letters.find(l=>l.id===id);
      if(!letter)return;
      const daysLeft=diffDays(todayStr(),letter.date);
      if(daysLeft<=0){
        // 刚好到期了 → 刷新列表自动解锁
        renderLetterList();
        return;
      }
      // 摇晃动画 + 神秘提示
      el.style.animation='shakeLetter .5s';
      setTimeout(()=>{el.style.animation=''},500);
      alert('🔒 这封信还未到送达日期\n\n📅 送达：'+letter.date+'\n⏳ 还有 '+daysLeft+' 天\n\n耐心等待时间的揭晓吧 🌱');
    };
  });
}

function delLetter(id){
  DB.letters=DB.letters.filter(l=>l.id!==id);
  save();renderLetterList();
}

// 计算两个 YYYY-MM-DD 之间的天数差（date - today），供倒计时使用
function diffDays(todayStr,targetStr){
  const t=new Date(todayStr+'T00:00:00');
  const d=new Date(targetStr+'T00:00:00');
  const ms=Math.ceil((d-t)/86400000);
  return ms<0?0:ms;
}
