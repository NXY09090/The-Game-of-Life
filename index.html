<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>游戏人生 · Life is a Game</title>
<style>
:root{
  /* ===== 浅色单色渐变主题（用户指定色板，由浅入深）=====
     · 粉：#f4e1eb → #f4bddb
     · 蓝：#dfeffb → #9fcef4
     · 紫：#e8d9f7 → #dbc1f5
     · 青：#e0feff → #9efcff
     主色 accent 取柔和紫 #b9a7e0，强调色取柔粉 #e6a6cd ===== */
  --bg1:#f4e1eb; --bg2:#dfeffb; --bg3:#e8d9f7; --bg4:#eef4fb; --bg5:#e0feff;
  --panel:rgba(255,255,255,0.60);
  --panel-solid:#fdfbff;
  --ink:#4a4458; --ink-soft:#8a8398; --line:#ecdcf2;
  --accent:#b9a7e0; --accent-2:#e6a6cd;
  --gold:#d6a567; --good:#82b899; --warn:#d4918c; --shadow:rgba(150,130,190,.09);
  --pixel:'Press Start 2P','Pixeboy',monospace;
  /* ===== 同色系层次色阶：deep(实底/文字) > 主色 > l1(常规边框) > l2(重点框边框·调浅两倍) ===== */
  --accent-deep:#9d86c4;  --accent-l1:#d6cbed;  --accent-l2:#ebe5f6;
  --accent-2-deep:#d98ab5; --accent-2-l1:#f0cbe0; --accent-2-l2:#f9eaf2;
  --gold-deep:#c08f4e;    --gold-l1:#e7cda2;    --gold-l2:#f4e6cf;
  --good-deep:#5f9b7a;    --good-l1:#add0bd;    --good-l2:#d8e8de;
  --warn-deep:#c07d77;    --warn-l1:#e6bcb7;    --warn-l2:#f5e3e0;
  --line-soft:#f3edf8;

  /* ===== 主题联动：颜色分量（供 rgb(var(--x) / a) 动态取透明度）=====
     下面这些初始值 = 「极光 aurora」预设，与上方默认色板一致；
     切换主题时由 applyTheme() 整体覆写，实现"改一个主色，全局联动"。 */
  --accent-rgb:185 167 224;      --accent-2-rgb:230 166 205;
  --gold-rgb:214 165 103;        --good-rgb:130 184 153;   --warn-rgb:212 145 140;
  --ink-rgb:74 68 88;            --line-rgb:236 220 242;
  /* 背景氛围光斑（4 团柔光，跟随主题色漂移） */
  --tint1-rgb:219 193 245;  --tint2-rgb:244 189 219;
  --tint3-rgb:159 206 244;  --tint4-rgb:158 252 255;
  /* —— 同色系层次：文字链接 / 实底按钮 / 次级按钮 / 焦点环 —— */
  --link:#8a6fc0;                /* 亮一档，保证在浅底上对比度 >= 4.5:1 */
  --on-accent:#ffffff;           /* 主色实底上的文字色（按对比度自动取白/深） */
  --btn-primary:var(--accent-deep);
  --btn-primary-ink:var(--on-accent);
  --btn-soft:rgb(var(--accent-rgb) / .12);
  --btn-soft-ink:var(--accent-deep);
  --btn-soft-line:rgb(var(--accent-rgb) / .30);
  --focus-ring:rgb(var(--accent-rgb) / .28);
  --icon:var(--accent-deep);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{
  font-family:-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;
  background:
      radial-gradient(circle at 20% 18%, rgb(var(--tint2-rgb) / .45) 0%, rgb(var(--tint2-rgb) / 0) 45%),
      radial-gradient(circle at 85% 20%, rgb(var(--tint3-rgb) / .42) 0%, rgb(var(--tint3-rgb) / 0) 43%),
      radial-gradient(circle at 55% 90%, rgb(var(--tint1-rgb) / .72) 0%, rgb(var(--tint1-rgb) / 0) 45%),
      radial-gradient(circle at 78% 78%, rgb(var(--tint4-rgb) / .32) 0%, rgb(var(--tint4-rgb) / 0) 42%),
      linear-gradient(150deg,var(--bg1),var(--bg2),var(--bg3),var(--bg4),var(--bg5));
  background-size:100% 100%,100% 100%,100% 100%,100% 100%,400% 400%;
  animation:drift 36s ease infinite;
  color:var(--ink);
  min-height:100vh;overflow-x:hidden;
  transition:background .8s ease;
}
@keyframes drift{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,textarea,select{font-family:inherit;color:var(--ink)}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:var(--line);border-radius:4px}

/* ============ 封面 ============ */
#cover{
  position:fixed;inset:0;z-index:5000;
  background:linear-gradient(180deg,#1f3a5f 0%,#2f5d8f 35%,#4a86b5 65%,#8fc4d6 88%,#d9efe8 100%);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  cursor:pointer;overflow:hidden;
}
#cover canvas{position:absolute;inset:0;width:100%;height:100%}
.cover-title{position:relative;z-index:2;text-align:center;pointer-events:none;
  animation:floaty 5s ease-in-out infinite;padding:0 20px}
.cover-title h1{
  font-family:var(--pixel);font-size:clamp(52px,15vw,150px);color:#fff;line-height:1.05;max-width:95vw;word-break:keep-all;
  text-shadow:4px 4px 0 #1f3a5f,0 0 30px rgba(255,255,255,.4);letter-spacing:2px}
.cover-title .sub{
  margin-top:26px;font-family:var(--pixel);font-size:clamp(12px,3.4vw,22px);
  color:#d9efe8;letter-spacing:3px;opacity:.92}
.cover-hint{position:absolute;bottom:8%;z-index:2;font-size:13px;color:rgba(255,255,255,.75);
  letter-spacing:2px;animation:breathe 2.4s ease-in-out infinite;pointer-events:none}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@keyframes breathe{0%,100%{opacity:.45}50%{opacity:1}}

/* ============ 主框架 ============ */
#app{display:none;padding-left:0;transition:padding-left .35s cubic-bezier(.4,0,.2,1)}
#app.sidebar-open{padding-left:280px}
/* 宽屏（浏览器）下打开侧栏时，内容区宽度收缩到可视剩余空间，绝不再盖住侧栏 */
@media(min-width:721px){#app.sidebar-open .page{max-width:none!important;margin:0!important;padding-left:20px;padding-right:20px;width:auto}}
@media(max-width:720px){#app.sidebar-open{padding-left:0}}

/* ============ 顶栏 ============ */
.topbar{position:sticky;top:0;z-index:300;display:flex;align-items:center;gap:14px;
  padding:14px 20px;background:var(--panel);backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line)}
.hamburger{width:38px;height:38px;border:2px solid var(--ink);border-radius:6px;
  display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.stats{display:flex;gap:10px;flex-wrap:wrap;margin-left:auto}
.stat{background:var(--panel-solid);border:2px solid var(--line);border-radius:8px;
  padding:6px 14px;font-size:13px;font-weight:600;box-shadow:2px 2px 0 var(--shadow)}
.stat b{font-family:var(--pixel);font-size:14px;color:var(--accent)}

/* ============ 侧边栏（修复：确保可滚动、设置可见） ============ */
#sidebar{position:fixed;top:0;left:-300px;width:280px;height:100%;height:100dvh;z-index:400;
  background:linear-gradient(180deg,rgb(var(--accent-rgb) / .13),rgb(var(--accent-2-rgb) / .10));
  backdrop-filter:blur(16px);border-right:2px solid var(--line);
  transition:left .35s cubic-bezier(.4,0,.2,1);display:flex;flex-direction:column;overflow:hidden}
#sidebar.open{left:0}
@media(max-width:720px){#sidebar{left:-100%;width:82%;z-index:450}}
.side-head{flex:0 0 auto;padding:22px 20px 14px;border-bottom:1px solid var(--line)}
.side-head .logo{font-family:var(--pixel);font-size:15px;color:var(--accent);letter-spacing:1px}
.side-head .day{font-size:12px;color:var(--ink-soft);margin-top:4px}
.nav{flex:1 1 auto;overflow-y:auto;overflow-x:hidden;padding:8px 10px 16px;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;scrollbar-gutter:stable}
.nav button{display:flex;align-items:center;gap:12px;width:100%;text-align:left;
  padding:13px 14px;margin-bottom:3px;border-radius:8px;font-size:15px;color:var(--ink);
  transition:.15s}
.nav button:hover{background:rgb(var(--accent-rgb) / .09)}
.nav button.active{background:var(--accent);color:#fff;box-shadow:3px 3px 0 var(--shadow)}
.nav .ico{font-size:18px;width:24px;text-align:center;flex-shrink:0}

/* ============ 内容区 ============ */
.page{padding:20px;max-width:860px;margin:0 auto 100px}
.page-title{font-size:20px;font-weight:700;margin-bottom:10px;line-height:1.4}
.page-desc{font-size:12px;color:var(--ink-soft);margin-bottom:18px;line-height:1.75}
/* 标题下没有描述文字、直接接卡片时，补足间距，避免"标题压着卡片" */
.page-title + .card{margin-top:6px}
/* 卡片内 h3 与其下方说明文字之间留出呼吸 */
.card > h3 + .page-desc{margin-top:-4px}
.card{background:var(--panel);backdrop-filter:blur(12px);border:2px solid var(--line);
  border-radius:14px;padding:18px;margin-bottom:16px;box-shadow:3px 3px 0 var(--shadow)}
.card h3{font-size:15px;margin-bottom:12px;display:flex;align-items:center;gap:8px}

/* ============ 首页（修复：Cycle/Day 断行、鼓励语不换行可滚动） ============ */
.home-hero{min-height:22vh;display:flex;flex-direction:column;justify-content:center;
  align-items:center;text-align:center;padding:30px 20px 4px}
.welcome-name{font-size:clamp(28px,7vw,44px);font-weight:900;color:var(--ink);line-height:1.3;letter-spacing:1px}
.welcome-cycle{font-size:clamp(15px,4vw,19px);font-weight:700;color:var(--ink);margin-top:14px;line-height:1.5}
.welcome-quote-wrap{width:100%;max-width:640px;margin:14px auto 0;overflow:hidden}
.welcome-quote{font-size:14px;color:var(--accent);font-weight:400;letter-spacing:.5px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  animation:quoteScroll 8s linear infinite}
@keyframes quoteScroll{0%{transform:translateX(8%)}100%{transform:translateX(-8%)}}
.welcome-date{font-size:13px;color:var(--ink-soft);margin-top:12px;letter-spacing:1px}
/* 快速记录：清晰的视觉层级 —— 主输入（大/深/实）vs 可选输入（小/浅/淡）vs 按钮（强调色块） */
.quick-add{width:100%;max-width:none;margin:0;display:flex;flex-direction:column;gap:12px}
.quick-add input{width:100%;min-width:0;box-sizing:border-box;border:2px solid var(--line);border-radius:12px;background:#fff;transition:.15s}
.quick-add input:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px rgb(var(--accent-rgb) / .11)}
.quick-add .qa-primary{padding:16px 16px;font-size:17px;font-weight:700;color:var(--ink);box-shadow:inset 0 2px 6px rgba(140,120,170,.05)}              /* 主内容：最大/最重/深色实心 */
.quick-add .qa-optional{padding:11px 16px;font-size:13px;font-weight:400;color:var(--ink-soft);background:transparent;border-style:dashed;border-color:#d8cfe8}  /* 感想：小/细/浅，虚线=非必填 */
.quick-add .qa-optional:focus{color:var(--ink)}
.quick-add .qa-primary::placeholder{color:var(--ink-soft);font-weight:400;font-size:15px}
.quick-add .qa-optional::placeholder{color:#b5afc4}
.quick-add .qa-btn{width:100%;box-sizing:border-box;background:linear-gradient(135deg,var(--accent),var(--gold));
  color:#fff;font-weight:700;letter-spacing:.5px;padding:14px 22px;border:none;border-radius:12px;cursor:pointer;font-size:15px;transition:.15s}
.quick-add .qa-btn:hover{transform:translateY(-1px);box-shadow:0 4px 10px rgb(var(--accent-rgb) / .3)}

/* ============ 首页 🌏 一键打卡大按钮（响应式放大 · 与快速记录卡片同宽）============
   · 字号 clamp(104px, 23vw, 168px)：手机约 104px（原 64px 的 1.6 倍），
     宽屏最大 168px（约 2.6 倍）；随屏幕线性缩放，不再固定 64px 显得小
   · 宽度与下方快速记录卡片对齐，视觉上是一体的
   ============ */
.checkin-btn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  width:100%;max-width:820px;margin:2px auto 8px;padding:6px 16px 14px;background:transparent;border:none;cursor:pointer;transition:.18s}
.checkin-globe{font-size:clamp(104px,23vw,168px);line-height:1;display:block;
  transition:transform .35s cubic-bezier(.34,1.56,.64,1);
  animation:floaty 4s ease-in-out infinite;
  filter:drop-shadow(0 12px 26px rgb(var(--accent-rgb) / .26))}
.checkin-btn:hover .checkin-globe{transform:scale(1.08) rotate(8deg)}
.checkin-btn:active .checkin-globe{transform:scale(.97)}
/* 金句 8 小时轮换时的淡入 */
@keyframes quoteFade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.welcome-quote.q-fade{animation:quoteFade .7s ease both}

/* ============ 今日记录 · 快捷打卡区 ============ */
.ci-head{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:700;color:var(--accent);margin-bottom:12px}
.ci-head .ci-globe{font-size:20px}
.ci-head .ci-sub{font-size:11px;color:var(--ink-soft);font-weight:400;margin-left:auto}
.ci-block{margin-bottom:10px;padding-bottom:8px;border-bottom:1px dashed var(--line)}
.ci-block:last-child{border-bottom:none;margin-bottom:0;padding-bottom:0}
.ci-title{font-size:11px;color:var(--ink-soft);font-weight:700;margin-bottom:6px;letter-spacing:.5px;
  text-transform:uppercase}
.ci-row{display:flex;align-items:center;gap:10px;padding:9px 0;flex-wrap:wrap}
.ci-row-auto{background:rgb(var(--accent-rgb) / .06);border-radius:10px;padding:9px 12px;margin:-2px 0}
.ci-no{flex:0 0 auto;min-width:30px;font-family:var(--pixel);font-size:10px;background:var(--accent);color:#fff;padding:3px 6px;border-radius:6px;text-align:center}
.ci-name{flex:1 1 auto;min-width:0;font-size:14px;font-weight:600;color:var(--ink)}
.ci-name small{font-size:10px;color:var(--ink-soft);font-weight:400;margin-left:6px}
.ci-count{font-size:10px;color:var(--accent);background:rgb(var(--accent-rgb) / .10);padding:1px 7px;border-radius:8px;margin-left:6px}
.ci-marks{flex:1 1 auto;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.ci-btn{padding:7px 12px;border:2px solid var(--line);border-radius:9px;font-size:13px;background:var(--panel);transition:.12s;line-height:1;white-space:nowrap}
.ci-auto{flex:0 0 auto;font-size:12px;font-weight:800;padding:5px 12px;border-radius:9px;border:2px solid var(--line)}
.ci-auto-ok{color:var(--good);border-color:var(--good);background:rgb(var(--good-rgb) / .10)}
.ci-auto-fail{color:var(--warn);border-color:var(--warn);background:rgb(var(--warn-rgb) / .09)}
.ci-auto-wait{color:var(--ink-soft)}
.ci-block-auto{background:rgb(var(--accent-rgb) / .05);border-radius:12px;padding:4px 6px}
.ci-btn.on,.ci-btn.active{background:var(--good);color:#fff;border-color:var(--good)}
.ci-btn:hover:not(:disabled){border-color:var(--accent)}
.ci-btn:disabled{opacity:.4;cursor:not-allowed}
.ci-input{width:100%;min-width:0;padding:9px 11px;border:1.5px solid var(--line);border-radius:9px;background:var(--panel-solid);font-size:14px;box-sizing:border-box}

/* ============ 快速记录（重设计 · 清晰的视觉层级）============
   参考：Habitica / 习惯打卡 App ——
   · 主输入（做了什么）：最大 · 粗体 · 深色 · 实心
   · 感想（可选）      ：小 · 细 · 浅灰 · 虚线（一眼区分"非必填"）
   · 按钮             ：强调色块 · 独立突出
   字体大小 / 颜色 / 粗细 三层分明，不再"全是框框" ============ */
.quick-add{width:100%;max-width:none;margin:0;display:flex;flex-direction:column;gap:14px}
.quick-add input{width:100%;min-width:0;box-sizing:border-box;border-radius:14px;background:#fff;transition:.15s}
/* —— ① 主输入：最大 / 最粗 / 深色 / 实心 —— */
.quick-add .qa-primary{padding:18px 18px;font-size:18px;font-weight:700;color:var(--ink);
  border:2px solid var(--accent);box-shadow:inset 0 2px 8px rgba(140,120,170,.06)}
/* —— ② 可选输入：小 / 细 / 浅 / 虚线 —— */
.quick-add .qa-optional{padding:12px 18px;font-size:13px;font-weight:400;color:var(--ink-soft);
  background:transparent;border:1.5px dashed var(--line);border-color:#dcd3e8}
.quick-add .qa-optional::placeholder{color:#b3acbf}
.quick-add .qa-optional:focus{color:var(--ink);border-color:var(--accent)}
/* —— ③ 按钮：强调渐变色块，独立突出 —— */
.quick-add .qa-btn{width:100%;box-sizing:border-box;background:linear-gradient(135deg,var(--accent),var(--accent-2));
  color:#fff;font-weight:800;letter-spacing:.5px;padding:15px 22px;border:none;border-radius:14px;cursor:pointer;font-size:16px;transition:.15s}
.quick-add .qa-btn:hover{transform:translateY(-2px);box-shadow:0 6px 16px rgb(var(--accent-rgb) / .20)}
.quick-add .qa-btn:active{transform:translateY(0)}
/* —— 成就预览：小字弱化，让输入框成为视觉中心 —— */
.quick-add-achv{margin-top:14px;padding-top:12px;border-top:1px dashed var(--line);
  font-size:12px;color:var(--ink-soft);line-height:1.8}
.quick-add-achv .qa-achv-label{font-weight:700;color:var(--accent)}

/* ============ 表格/列表 ============ */
.row{display:flex;gap:8px;align-items:stretch;padding:8px 0;border-bottom:1px dashed var(--line);flex-wrap:wrap}
.row:last-child{border-bottom:none}
.row input,.row select,.row textarea{padding:9px 10px;border:1.5px solid var(--line);
  border-radius:8px;background:var(--panel-solid);font-size:14px}
.timeline .row>div{flex:1;min-width:120px}

/* ============ 时间线卡片（第10条：字号/颜色/粗细区分层级） ============ */
.tl-list{display:flex;flex-direction:column;gap:12px}
.tl-card{position:relative;background:var(--panel-solid);border:2px solid var(--line);border-radius:12px;padding:14px 40px 14px 16px;transition:.15s}
.tl-card.has-achv{border-color:rgb(var(--gold-rgb) / .28)}
.tl-time{font-size:12px;color:var(--ink-soft);font-weight:600;letter-spacing:.5px;margin-bottom:4px}
.tl-content{font-size:16px;font-weight:700;color:var(--ink);line-height:1.5;margin-bottom:6px}
.tl-feel{font-size:13px;color:var(--accent);font-style:normal;margin-bottom:8px;line-height:1.5}
.tl-achv{font-size:13px}
.tl-del{position:absolute;top:10px;right:10px;background:transparent;border:none;font-size:15px;opacity:.45;cursor:pointer;transition:.15s}
.tl-del:hover{opacity:1}
.achievement-tag{display:inline-block;background:linear-gradient(135deg,rgb(var(--gold-rgb) / .22),rgb(var(--gold-rgb) / .40));
  border:1.5px solid var(--gold);color:#8a6d3b;padding:2px 9px;border-radius:12px;
  font-size:12px;margin:2px 4px 2px 0;cursor:pointer}
.achievement-tag:hover{border-color:var(--warn)}

/* ============ 主线打卡 ============ */
.quest{border:2px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px;
  background:var(--panel-solid);position:relative}
.quest.locked{opacity:.55;pointer-events:none}
.quest .q-head{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.quest .q-no{font-family:var(--pixel);font-size:12px;background:var(--accent);color:#fff;
  padding:3px 8px;border-radius:6px;flex-shrink:0}
.quest .q-name{flex:1;font-weight:600;font-size:15px;border:none;background:transparent;width:100%}
.quest .q-del{flex:0 0 auto;width:32px;height:32px;display:flex;align-items:center;justify-content:center;
  color:var(--ink-soft);font-size:16px;line-height:1;opacity:.5;transition:.15s}
.quest .q-del:hover{opacity:1;color:var(--warn)}
.quest .q-desc{width:100%;font-size:13px;color:var(--ink);margin:4px 0 10px;padding:8px 10px;
  border:1.5px solid var(--line);border-radius:8px;background:var(--panel);resize:vertical;min-height:34px}
.quest .q-desc:focus{border-color:var(--accent);outline:none}
.quest .q-desc[readonly]{background:rgba(0,0,0,.03);color:var(--ink-soft);border-style:dashed;resize:none}
.marks{display:flex;gap:6px;flex-wrap:wrap}
.mark-btn{padding:7px 12px;border:2px solid var(--line);border-radius:8px;font-size:13px;
  background:var(--panel);transition:.12s}
.mark-btn.active{background:var(--good);color:#fff;border-color:var(--good);transform:scale(1.05)}
.mark-btn.undo{background:var(--warn);color:#fff;border-color:var(--warn)}
.q-meta{font-size:11px;color:var(--ink-soft);margin-top:8px}

/* —— 作息置顶条：在主线打卡区显示为 M1/M2，成功绿 / 失败红 —— */
.quest.quest-auto{border-style:solid;box-shadow:3px 3px 0 var(--shadow)}
.quest.quest-auto .q-head{margin-bottom:0}
.quest.quest-auto .q-name{font-weight:800}
.quest.quest-auto-ok{border-color:rgb(var(--good-rgb) / .85);background:rgb(var(--good-rgb) / .09)}
.quest.quest-auto-ok .q-no{background:var(--good)}
.quest.quest-auto-ok .q-name{color:var(--good)}
.quest.quest-auto-fail{border-color:rgb(var(--warn-rgb) / .85);background:rgb(var(--warn-rgb) / .09)}
.quest.quest-auto-fail .q-no{background:var(--warn)}
.quest.quest-auto-fail .q-name{color:var(--warn)}
/* 作息打卡的勾选标记：成功绿勾 / 失败红叉，不用普通 mark-btn 配色 */
.quest.quest-auto .mark-btn.active{background:var(--good);border-color:var(--good)}
.quest.quest-auto .mark-btn.undo{background:var(--warn);border-color:var(--warn)}
/* 周期结算总览里的作息列（早起 / 早睡）颜色标识 */
.routine-cell.ok{color:var(--good)}
.routine-cell.fail{color:var(--warn)}

/* ============ 进阶树 ============ */
.tree{display:flex;flex-direction:column;align-items:center;gap:6px;padding:20px 0}
.tree-node.reached{filter:none;opacity:1}
.tree-node.current{transform:scale(1.18);animation:glow 2s ease-in-out infinite}
@keyframes glow{0%,100%{filter:drop-shadow(0 0 4px var(--gold))}50%{filter:drop-shadow(0 0 14px var(--gold))}}
.tree-node .emoji{font-size:30px;line-height:1}
.tree-node .lv{font-family:var(--pixel);font-size:8px;margin-top:4px;color:var(--ink-soft)}
.tree-node.reached .lv{color:var(--accent)}
/* ============ 存钱 ============ */
.fund-bar{height:22px;border-radius:11px;background:var(--line);overflow:hidden;margin:10px 0 6px;
  border:2px solid var(--ink)}
.fund-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--gold));transition:width .6s}
.wish{display:flex;gap:10px;align-items:center;padding:11px;border:2px solid var(--line);
  border-radius:10px;margin-bottom:8px;background:var(--panel-solid);flex-wrap:wrap}
.wish.bought{opacity:.45;text-decoration:line-through}
.wish .w-name{flex:1;min-width:100px;font-weight:600}
.wish .w-price{color:var(--gold);font-weight:700;font-family:var(--pixel);font-size:12px}
.mini-btn{padding:5px 11px;border:1.5px solid var(--line);border-radius:7px;font-size:12px;background:var(--panel)}
.mini-btn.danger{border-color:var(--warn);color:var(--warn)}
.mini-btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.mini-btn.gold{background:var(--gold);color:#fff;border-color:var(--gold)}

/* ============ 回溯图表 ============ */
.chart-box{background:var(--panel-solid);border-radius:12px;padding:14px;border:2px solid var(--line)}
.summary-box{background:linear-gradient(135deg,var(--panel),rgba(255,255,255,.5));
  border:2px solid var(--gold);border-radius:14px;padding:20px;margin-bottom:18px}
.summary-box h4{color:var(--accent);margin-bottom:10px}
.heatmap{display:flex;gap:4px;flex-wrap:wrap;margin-top:8px}
.heat-day{width:26px;height:26px;border-radius:6px;border:1.5px solid var(--line);
  display:flex;align-items:center;justify-content:center;font-size:10px;position:relative;cursor:pointer}
.heat-day .tip{display:none;position:absolute;bottom:32px;left:50%;transform:translateX(-50%);
  background:var(--ink);color:#fff;padding:5px 9px;border-radius:6px;font-size:11px;white-space:nowrap;z-index:10}
.heat-day:hover .tip{display:block}

.btn{background:var(--accent);color:#fff;font-weight:600;padding:11px 20px;border-radius:10px;font-size:14px;
  box-shadow:2px 2px 0 var(--shadow)}
.btn.ghost{background:transparent;color:var(--ink);border:2px solid var(--line)}
.btn.sm{padding:6px 12px;font-size:12px}
.empty{text-align:center;color:var(--ink-soft);padding:30px;font-size:14px}
.lock-banner{background:linear-gradient(90deg,#fff3cd,#ffe6b3);border:2px solid var(--gold);
  border-radius:10px;padding:10px 14px;font-size:13px;margin-bottom:14px;color:#8a6d3b}
.log-item b{color:var(--warn)}

.modal{position:fixed;inset:0;z-index:600;background:rgba(40,50,65,.28);display:none;
  align-items:center;justify-content:center;padding:20px}
.modal.open{display:flex}
.modal-box{background:var(--panel-solid);border-radius:16px;padding:22px;max-width:480px;width:100%;
  max-height:86vh;overflow-y:auto;border:2px solid var(--line);box-shadow:6px 6px 0 var(--shadow)}
.modal-box h3{margin-bottom:14px}
.field{margin-bottom:14px}
.field label{display:block;font-size:13px;color:var(--ink-soft);margin-bottom:5px}
.field input,.field select,.field textarea{width:100%;padding:10px;border:2px solid var(--line);border-radius:8px;background:var(--panel)}
.split{display:flex;gap:8px;flex-wrap:wrap}
.split>*{flex:1;min-width:120px}
.hidden{display:none!important}
.pill{display:inline-block;padding:2px 9px;border-radius:10px;font-size:11px;font-weight:600;margin:2px}
/* ============ 惊喜匣子：计划奖励 / 减重奖励 两个独立分区 ============ */
.pool-section{margin-bottom:16px}
.pool-section .pool-head{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:700;margin-bottom:10px}
.pool-section .pool-head .tag{font-size:11px;font-weight:600;padding:2px 9px;border-radius:10px}
.pool-plan .pool-head .tag{background:rgb(var(--accent-rgb) / .11);color:var(--accent)}
.pool-weight .pool-head .tag{background:rgb(var(--warn-rgb) / .11);color:var(--warn)}
.pool-desc{font-size:12px;color:var(--ink-soft);margin-bottom:10px;line-height:1.6}
/* 惊喜匣子页头：标题 + 状态标签同行，底部空行与下方内容分隔 */
.gift-title-wrap{margin-bottom:26px}
.gift-title-row{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;
  padding-bottom:16px;border-bottom:1px dashed var(--line-soft)}
.gift-title-row .page-title{margin-bottom:0}
.gift-title-tag{font-size:11.5px;font-weight:600;color:var(--accent-deep);
  background:rgb(var(--accent-rgb) / .12);padding:4px 11px;border-radius:20px;line-height:1.4}
.gift-tier{border:1.5px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:10px;background:var(--panel-solid)}
.gift-tier .tier-title{font-size:13px;font-weight:700;margin-bottom:6px}
.gift-tier input.tier-gifts{width:100%;padding:9px 10px;border:1.5px solid var(--line);border-radius:8px;background:var(--panel);font-size:13px;margin-top:6px}
.gift-num{width:58px;padding:6px 4px;border:2px solid var(--line);border-radius:8px;background:var(--panel);font-size:14px;font-weight:700;color:var(--accent);text-align:center}
.wt-row .gift-num{width:52px}
.wt-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
.wt-row .wt-label{font-size:13px;color:var(--ink);min-width:120px}
.wt-row input{width:70px;padding:7px 8px;border:1.5px solid var(--line);border-radius:8px;background:var(--panel);font-size:13px;text-align:center}
.pill.g{background:#e2efe0;color:#5a7a55}.pill.b{background:#dde8f0;color:#4a6a80}
.pill.r{background:#f3ded8;color:#a05a48}

/* ============ 里程碑卡片 ============ */
.ms-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.ms-card{border:2px solid var(--line);border-radius:12px;padding:18px 14px;text-align:center;
  background:var(--panel-solid);transition:.18s;cursor:not-allowed;position:relative}
.ms-card.on{cursor:pointer;box-shadow:3px 3px 0 var(--shadow)}
.ms-card.on:hover{transform:translateY(-3px);box-shadow:4px 5px 0 var(--shadow)}
.ms-card.locked{opacity:.5;filter:grayscale(.6)}
.ms-card .ms-icon{font-size:34px;line-height:1;margin-bottom:8px}
.ms-card .ms-name{font-size:14px;font-weight:700;margin-bottom:4px}
.ms-card .ms-status{font-size:11px;color:var(--ink-soft)}
.ms-card.on .ms-status{color:var(--good);font-weight:600}

/* ============ 今日小结 v2（问题1：%在标题行 / 副标题下移 / 作息小方块 / 加体重） ============ */
.ms-v2 .ms-top{display:flex;align-items:baseline;gap:10px;margin-bottom:2px}
.ms-v2 .ms-title{font-size:16px;font-weight:800;color:var(--ink)}
.ms-v2 .ms-rate{margin-left:auto;font-family:var(--pixel);font-size:20px;font-weight:900;
  background:linear-gradient(135deg,var(--accent),var(--accent-2));-webkit-background-clip:text;background-clip:text;color:transparent}
.ms-v2 .ms-sub{font-size:11px;color:var(--ink-soft);margin-bottom:10px;line-height:1.5}
.ms-v2 .ms-line{font-size:13px;color:var(--ink);line-height:1.8}
.ms-v2 .ms-chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.ms-chip{display:inline-flex;align-items:center;gap:5px;padding:6px 12px;border-radius:20px;
  font-size:12px;font-weight:600;border:1.5px solid var(--line);background:var(--panel-solid);color:var(--ink);
  box-shadow:2px 2px 0 var(--shadow)}
.ms-chip.ok{border-color:var(--good);color:var(--good);background:rgba(127,184,154,.08)}
.ms-chip.fail{border-color:var(--warn);color:var(--warn);background:rgba(208,139,134,.08)}
.ms-chip.wait{color:var(--ink-soft)}
/* ============ 浅色单色渐变主题增强：玻璃卡片 + 柔和阴影 ============ */
.card{background:rgba(255,255,255,0.66);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  border-color:#ece2f4;box-shadow:0 6px 22px rgba(150,130,190,.06),0 2px 6px rgba(150,130,190,.05)}
.topbar{background:rgba(255,255,255,0.58)}
#sidebar{background:linear-gradient(180deg,rgba(252,250,255,.92),rgba(248,242,252,.94))}
.hg-rec,.hg-stat,.hg-chart-card{background:rgba(255,255,255,0.70);backdrop-filter:blur(8px)}
.hg-stat-num{font-size:20px}

/* ============ 健康人生板块（重设计 · 紧凑 / 分区清晰 / 折叠卡片有背景） ============ */
/* —— 0. 周期置顶条 —— */
.hg-topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;
  background:linear-gradient(135deg,rgb(var(--accent-rgb) / .10),rgb(var(--good-rgb) / .10));
  border:2px solid var(--accent);border-radius:14px;padding:14px 18px;margin-bottom:14px}
.hg-topbar .hg-top-title{font-size:15px;font-weight:800;color:var(--accent)}
.hg-topbar .hg-top-txt{font-size:12px;color:var(--ink-soft);line-height:1.6;margin-top:2px}
.hg-topbar .hg-cycle-btn{flex-shrink:0}
/* —— 1. 记录区（紧凑 · 整体缩小高度） —— */
.hg-rec{background:var(--panel-solid);border:2px solid var(--line);border-radius:12px;padding:11px 12px;position:relative;transition:.15s}
.hg-rec:focus-within{border-color:var(--accent)}
.hg-rec input{width:100%;padding:7px 9px;border:2px solid var(--line);border-radius:8px;background:#fff;font-size:14px;color:var(--ink)}
.hg-rec input:focus{border-color:var(--accent);outline:none}
.hg-rec .hg-rec-sub{font-size:10px;color:var(--ink-soft);margin-top:4px;line-height:1.35;min-height:13px}
.hg-rec .hg-rec-sub b{color:var(--accent)}
.hg-rec .hg-calout{font-size:11px;color:var(--ink);line-height:1.5;padding:8px;border-radius:8px;min-height:44px;background:rgb(var(--accent-rgb) / .05)}
.hg-sleep-preview{margin-top:10px;padding:10px 14px;border-left:4px solid var(--line);background:rgb(var(--accent-rgb) / .05);border-radius:8px;display:flex;align-items:center;gap:10px}
.hg-sleep-preview-val{font-family:var(--pixel);font-size:18px;font-weight:900;color:var(--accent)}
/* —— 2. 统计卡（5个：当前体重/本轮变化/今日喝水/昨日睡眠/累计运动）—— */
.hg-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(115px,1fr));gap:10px;margin:14px 0}
.hg-stat{background:var(--panel);border:2px solid var(--line);border-radius:12px;padding:12px 13px;box-shadow:3px 3px 0 var(--shadow)}
.hg-stat-label{font-size:10px;color:var(--ink-soft);margin-bottom:4px}
.hg-stat-num{font-family:var(--pixel);font-size:22px;font-weight:900;color:var(--accent);line-height:1.1}
.hg-stat-num.hg-down{color:var(--good)}
.hg-stat-unit{font-size:11px;color:var(--ink-soft);font-weight:400;margin-left:2px}
.hg-stat-sub{font-size:10px;color:var(--ink-soft);margin-top:5px;line-height:1.3}
/* —— 3. 图表 2×2 分栏 —— */
.hg-chart-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start}
@media(max-width:720px){.hg-chart-grid{grid-template-columns:1fr;gap:14px}}
.hg-chart-card{height:100%;padding:14px}
.hg-chart-card h4{font-size:13px;font-weight:800;margin-bottom:8px;display:flex;align-items:center;gap:6px;line-height:1.4}
.hg-chart-card .hg-card-sub{font-size:11px;color:var(--ink-soft);margin-bottom:10px;line-height:1.5}
.hg-chart canvas{width:100%;display:block}
/* —— 4. 睡眠条形图（横向进度条，颜色分级，可上下日期对比） —— */
.hg-sleepbar-list{display:flex;flex-direction:column;gap:8px;margin-top:6px}
.hg-sleepbar-row{display:grid;grid-template-columns:60px 1fr 100px;align-items:center;gap:8px}
.hg-sleepbar-date{font-family:var(--pixel);font-size:10px;color:var(--ink-soft);font-weight:700;text-align:right}
.hg-sleepbar-track{position:relative;height:24px;border-radius:12px;background:rgba(0,0,0,.05);overflow:hidden}
.hg-sleepbar-fill{position:absolute;top:0;bottom:0;left:0;border-radius:12px 0 0 12px;transition:width .5s}
.hg-sleepbar-meta{font-size:10px;font-weight:700;text-align:right;white-space:nowrap}
/* —— 5. 折叠历史（关键修复：summary + body 都有背景卡片） —— */
.hg-collapsible > summary{display:flex;align-items:center;gap:10px;cursor:pointer;list-style:none;user-select:none;
  font-size:14px;font-weight:800;color:var(--ink);padding:13px 16px;
  border:none;border-radius:12px;transition:.18s;
  background:linear-gradient(135deg, rgb(var(--accent-rgb) / .12), rgb(var(--good-rgb) / .11))}
.hg-collapsible > summary::-webkit-details-marker{display:none}
.hg-collapsible > summary:hover{background:rgb(var(--accent-rgb) / .13)}
.hg-collapsible .hg-sec-count{font-size:11px;font-weight:800;color:var(--accent);background:rgb(var(--accent-rgb) / .10);padding:3px 10px;border-radius:9px;margin-left:auto;white-space:nowrap}
.hg-collapsible .hg-sec-arrow{font-size:13px;color:var(--accent);transition:transform .25s;flex-shrink:0;
  width:22px;height:22px;border-radius:50%;background:rgb(var(--accent-rgb) / .09);display:inline-flex;align-items:center;justify-content:center;line-height:1}
.hg-collapsible[open]{border-color:var(--accent);box-shadow:3px 3px 0 var(--shadow)}
.hg-collapsible[open] > summary{background:linear-gradient(135deg, rgb(var(--accent-rgb) / .15), rgb(var(--good-rgb) / .14));border-radius:12px 12px 0 0}
.hg-collapsible[open] .hg-sec-arrow{transform:rotate(180deg);background:var(--accent);color:#fff}
@keyframes collapseIn{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:translateY(0)}}
.hg-sport-row{position:relative;padding:8px 24px 8px 0;border-bottom:1px dashed var(--line);font-size:12px}
.hg-sport-row:last-child{border-bottom:none}
.hg-sport-feel,.hg-sleep-feel{grid-column:1 / -1;font-size:11px;color:var(--accent)}
.hg-sport-del{position:absolute;top:8px;right:0;background:transparent;border:none;font-size:14px;opacity:.4;cursor:pointer;transition:.15s}
.hg-sport-del:hover{opacity:1;color:var(--warn)}
.hg-food-list{max-height:240px;overflow-y:auto}
.hg-food-row{display:flex;gap:8px;padding:6px 0;border-bottom:1px dashed var(--line);font-size:12px}
.hg-food-row:last-child{border-bottom:none}
.hg-food-date{color:var(--ink-soft);flex-shrink:0;width:54px}
.hg-food-content{flex:1;text-align:right}
.hg-heat{display:grid;grid-template-columns:repeat(auto-fill,minmax(34px,1fr));gap:4px}
.hg-cell{aspect-ratio:1;border-radius:6px;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:10px;color:var(--ink-soft);position:relative;cursor:pointer}
.hg-cell.hg-both{background:rgb(var(--good-rgb) / .28);color:var(--ink)}
.hg-cell.hg-w{background:rgb(var(--accent-rgb) / .3)}
.hg-cell.hg-food{background:rgb(var(--warn-rgb) / .16)}
.hg-cell .hg-tip{display:none;position:absolute;bottom:115%;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:4px 8px;border-radius:5px;font-size:10px;white-space:nowrap;z-index:20}
.hg-cell:hover .hg-tip{display:block}
.hg-legend{font-size:11px;color:var(--ink-soft);margin-bottom:8px}
.hg-dot{display:inline-block;width:11px;height:11px;border-radius:3px;margin:0 3px 0 8px;vertical-align:middle}
.hg-dot.hg-both{background:rgb(var(--good-rgb) / .5)}
.hg-dot.hg-w{background:rgb(var(--accent-rgb) / .4)}
.hg-dot.hg-food{background:rgb(var(--warn-rgb) / .20)}
.hg-empty{text-align:center;color:var(--ink-soft);padding:24px;font-size:13px}
/* —— 6. 减重奖励规则 —— */
.hg-tier{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px dashed var(--line);font-size:13px}
.hg-tier:last-child{border-bottom:none}
.hg-tier-dot{flex-shrink:0;font-size:16px}
.hg-tier-txt b{color:var(--accent)}
.hg-reward-now{margin-top:10px;padding:10px;background:rgb(var(--good-rgb) / .08);border-radius:8px;font-size:13px}

/* —— 减重奖励规则（独立判定） —— */
.hg-tier{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px dashed var(--line);font-size:13px}
.hg-tier-dot{flex-shrink:0;font-size:16px}
.hg-reward-now{font-size:13px;margin-top:12px;padding-top:12px;border-top:1px dashed var(--line)}
.hg-tip{color:var(--good);font-weight:600}
.hg-tier{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px dashed var(--line);font-size:13px}
.hg-tier:last-of-type{border-bottom:none}
.hg-tier-dot{font-size:18px;flex-shrink:0;width:26px;text-align:center}
.hg-reward-now{margin-top:10px;padding:10px;background:rgb(var(--good-rgb) / .08);border-radius:8px;font-size:13px}
.hg-cycle-bar{margin-top:10px}

/* ============ 健康板块 · 本轮优化（图表等高 / 字段层级 / 矩阵格子） ============ */
/* 图表 2×2：统一尺寸、严格等高、不溢出屏幕。
   每张卡片固定高度 250px，canvas 用 aspect-ratio 锁定比例，ResizeObserver 触发重绘。 */
.hg-chart-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;align-items:stretch}
@media(max-width:720px){.hg-chart-grid{grid-template-columns:1fr}}
.hg-chart-card{height:250px;padding:14px;display:flex;flex-direction:column;overflow:hidden}
.hg-chart-card .hg-card-sub{font-size:11px;color:var(--ink-soft);margin-bottom:8px;line-height:1.4;flex:0 0 auto}
.hg-chart-card .hg-chart{position:relative;flex:1 1 auto;min-height:0;width:100%;max-width:100%}
.hg-chart-card canvas{width:100%!important;height:100%!important;display:block;object-fit:contain}
.hg-chart-card canvas{width:100%!important;height:auto!important;display:block}
.hg-rec{display:flex;flex-direction:column;gap:5px}
.hg-rec input{font-size:16px;font-weight:700;color:var(--ink);padding:9px 10px}
.hg-rec .hg-rec-sub{font-size:10px;color:var(--ink-soft);line-height:1.35;min-height:13px}
.hg-rec select{width:100%;padding:9px 10px;border:2px solid var(--line);border-radius:8px;background:#fff;font-size:14px;color:var(--ink)}
.hg-rec select:focus{border-color:var(--accent);outline:none}
.matrix .auto-row .cell-task{color:var(--accent)}
.matrix .cell-total{font-weight:800;color:var(--accent);background:rgb(var(--accent-rgb) / .06)}
.matrix .has-count{font-weight:700;color:var(--good)}
.matrix-summary{background:linear-gradient(135deg,rgb(var(--accent-rgb) / .08),rgb(var(--gold-rgb) / .08));border-color:var(--accent)}
.ms-top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px}
.ms-title{font-size:14px;font-weight:800;color:var(--accent)}
.ms-rate{font-family:var(--pixel);font-size:20px;font-weight:900;color:var(--accent)}
.ms-line{font-size:13px;line-height:2;color:var(--ink)}
.ms-line b{color:var(--accent)}
.ms-auto-item.ok{color:var(--good);border-color:var(--good);background:rgb(var(--good-rgb) / .08)}
.ms-auto-item.fail{color:var(--warn);border-color:var(--warn);background:rgb(var(--warn-rgb) / .08)}
.ms-auto-item.wait{color:var(--ink-soft)}
.th-total,.cell-total{font-weight:700;color:var(--accent)}

/* ============ 成就图鉴 ============ */
.achv-filter button{padding:6px 12px;border:2px solid var(--line);border-radius:8px;font-size:12px;background:var(--panel);transition:.15s}
.achv-filter button.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.achv-tier-names .got{color:var(--good);font-weight:600}
.achv-tier-names .current{border-bottom:2px solid var(--gold)}

/* ============ 成长图鉴（荣誉圣殿·上半） ============ */
/* —— 分组折叠（与进阶之路 path-collapsible 风格统一） —— */
.badge-group{margin-bottom:14px}
.badge-group-summary{display:flex;align-items:center;gap:8px;padding:10px 14px;cursor:pointer;user-select:none;
  background:var(--panel-solid);border:2px solid var(--line);border-radius:12px;font-size:14px;font-weight:700;color:var(--ink);list-style:none;transition:.15s;margin-bottom:10px}
.badge-group-summary::-webkit-details-marker{display:none}
.badge-group-summary:hover{border-color:var(--accent)}
.badge-group-summary .bgs-name{flex:1;font-weight:700}
.badge-group-summary .bgs-count{font-size:11px;color:var(--accent);background:rgb(var(--accent-rgb) / .10);padding:2px 8px;border-radius:8px;white-space:nowrap}
.badge-group-summary .bgs-lock{font-size:11px;color:var(--gold);font-weight:600}
.badge-group-summary .bgs-arrow{font-size:12px;color:var(--ink-soft);transition:transform .2s}
.badge-group[open] .badge-group-summary .bgs-arrow{transform:rotate(180deg)}
/* —— 1 行 9 列（1×9）：尺寸参照进阶之路 .path-node（58~76px）——
   宽屏 9 枚一排；窄屏逐级降列自动换行，保证手机上不挤出屏幕 —— */
.badge-grid{display:grid;grid-template-columns:repeat(9,minmax(0,1fr));gap:8px;padding:4px 2px}
@media(max-width:860px){.badge-grid{grid-template-columns:repeat(7,minmax(0,1fr))}}
@media(max-width:720px){.badge-grid{grid-template-columns:repeat(5,minmax(0,1fr))}}
@media(max-width:480px){.badge-grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media(max-width:380px){.badge-grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
.badge-cell{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:4px;padding:10px 4px;border:2px dashed var(--line);border-radius:12px;background:var(--panel-solid);
  transition:.18s;aspect-ratio:1 / 1;width:100%;min-width:0;max-width:76px;
  box-shadow:0 3px 10px rgba(140,120,170,.05)}
.badge-cell.locked{border-style:dashed;opacity:.5;filter:grayscale(.85)}
.badge-cell.on{border-style:solid;border-color:var(--accent);background:rgb(var(--accent-rgb) / .07)}
.badge-cell.got{border-style:solid;border-color:var(--gold);background:linear-gradient(135deg,rgba(214,165,103,.10),rgba(255,230,210,.13))}
.badge-emoji{font-size:24px;line-height:1}
.badge-cell.locked .badge-emoji{font-size:18px;opacity:.6}
.badge-name{font-size:10px;color:var(--ink-soft);font-weight:700;letter-spacing:0;line-height:1.2;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.badge-cell.on .badge-name,.badge-cell.got .badge-name{color:var(--ink)}
.badge-cell.locked .badge-name{color:var(--line);letter-spacing:0}
.badge-mark{position:absolute;top:4px;right:5px;font-size:9px;font-weight:700;color:var(--gold);line-height:1}
.badge-cell.locked .badge-mark{color:var(--line)}

/* ============ 里程碑（8档） ============ */

/* ============ 周期打卡总览矩阵 ============ */
.matrix-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;border:2px solid var(--line);border-radius:12px;background:var(--panel)}
.matrix{width:100%;border-collapse:collapse;min-width:520px}
.matrix th,.matrix td{border:1px solid var(--line);padding:6px 4px;text-align:center;font-size:12px;white-space:nowrap}
.matrix thead th{background:var(--panel-solid);position:sticky;top:0;z-index:2;font-weight:600}
.matrix .th-task{position:sticky;left:0;z-index:3;background:var(--panel-solid);text-align:left;padding-left:10px;min-width:110px}
.matrix td.cell-task{position:sticky;left:0;background:var(--panel-solid);text-align:left;padding-left:10px;font-weight:600}
.cell-mark{font-size:14px;line-height:1}
.cell-mark.ok{background:rgb(var(--good-rgb) / .16)}
.cell-mark.fail{background:rgb(var(--warn-rgb) / .16)}
.cell-mark.miss{color:var(--ink-soft)}
.matrix-legend{font-size:12px;color:var(--ink-soft);margin-top:10px;display:flex;gap:16px;flex-wrap:wrap}
.matrix-legend span{display:inline-flex;align-items:center;gap:5px}
.lg{display:inline-block;width:14px;height:14px;border-radius:3px;border:1px solid var(--line)}

/* 里程碑: 锁定显示真实图标(灰) + 🔒角标 */
.ms-lockbadge{position:absolute;top:6px;right:8px;font-size:11px;opacity:.75}
.ms-icon{font-size:26px;line-height:1;flex-shrink:0;transition:.3s}
.ms-icon-locked{filter:grayscale(1);opacity:.4}
.ms-name{flex:1;font-size:14px;font-weight:700;color:var(--ink)}
.ms-status{font-size:11px;color:var(--ink-soft)}
/* ============ 进阶之路 · 神秘化 + 主题序列 + 默认折叠 ============ */
.path-theme-hint{font-size:12px;color:var(--ink-soft);margin-bottom:10px;line-height:1.6}
.path-theme-hint b{color:var(--accent)}
.path-collapsible{margin-bottom:14px}
.path-summary{display:flex;align-items:center;gap:8px;padding:10px 14px;cursor:pointer;user-select:none;
  background:var(--panel-solid);border:2px solid var(--line);border-radius:12px;font-size:14px;font-weight:700;color:var(--ink);list-style:none;transition:.15s}
.path-summary::-webkit-details-marker{display:none}
.path-summary:hover{border-color:var(--accent)}
.path-summary .ps-name{flex:1;font-weight:700}
.path-summary .ps-count{font-size:11px;color:var(--accent);background:rgb(var(--accent-rgb) / .09);padding:2px 8px;border-radius:8px;white-space:nowrap}
.path-summary .ps-lock{font-size:11px;color:var(--gold);font-weight:600}
.path-summary .ps-arrow{font-size:12px;color:var(--ink-soft);transition:transform .2s}
.path-collapsible[open] .path-summary .ps-arrow{transform:rotate(180deg)}
.path-body{padding:12px 4px 4px}
.path-node{display:inline-flex;flex-direction:column;align-items:center;gap:3px;padding:8px 6px;border:2px solid var(--line);border-radius:10px;background:var(--panel-solid);transition:.25s;min-width:58px;max-width:76px}
.path-node.reached{border-color:var(--good);background:rgb(var(--good-rgb) / .07)}
.path-node.current{border-color:var(--gold);box-shadow:0 0 10px rgb(var(--gold-rgb) / .5);transform:scale(1.08)}
.path-node.locked{opacity:.5;filter:grayscale(.6)}
.path-node.hidden-node{opacity:.35;border-style:dashed}
.path-emoji{font-size:20px;line-height:1;transition:.3s}
.path-node.reached .path-emoji{animation:nodePop .4s ease}
@keyframes nodePop{0%{transform:scale(.5)}60%{transform:scale(1.3)}100%{transform:scale(1)}}
.path-lv{font-family:var(--pixel);font-size:8px;color:var(--ink-soft)}
.path-name{font-size:9px;color:var(--ink);text-align:center;line-height:1.15;word-break:break-all;max-width:70px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.path-node.hidden-node .path-name{color:var(--line)}
.path-node.hidden-node .path-emoji{font-size:14px;opacity:.6}
.path-arrow{color:var(--line);font-size:14px;align-self:center}
.uni-tabs .mini-btn{padding:7px 14px;border:2px solid var(--line);border-radius:20px;background:var(--panel)}
.uni-tabs .mini-btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
/* ============ 成就庆祝动画（彩纸雨 + 像素烟花 + 文案） ============ */
#fxLayer{position:fixed;inset:0;z-index:6000;pointer-events:none;overflow:hidden;opacity:0;transition:opacity .3s}
#fxLayer.fx-show{opacity:1}
.confetti{position:absolute;top:-20px;width:10px;height:14px;border-radius:2px;opacity:.9;
  animation:confettiFall linear forwards;image-rendering:pixelated}
@keyframes confettiFall{0%{transform:translateY(0) rotate(0)}100%{transform:translateY(105vh) rotate(540deg)}}
.firework{position:absolute;width:14px;height:14px;border-radius:50%;background:#fff;
  box-shadow:0 0 0 4px rgb(var(--gold-rgb) / .7),0 0 0 10px rgb(var(--accent-rgb) / .4);
  animation:fireworkPop .9s ease-out forwards;image-rendering:pixelated}
@keyframes fireworkPop{0%{transform:scale(0);opacity:1}60%{transform:scale(1);opacity:1}100%{transform:scale(2.4);opacity:0}}
.fx-text{position:absolute;top:32%;left:50%;transform:translateX(-50%);font-family:var(--pixel);
  font-size:clamp(20px,6vw,40px);color:#fff;text-shadow:3px 3px 0 #1f3a5f,0 0 24px rgba(255,255,255,.6);
  letter-spacing:2px;animation:fxText .3s ease;white-space:nowrap}
@keyframes fxText{0%{transform:translate(-50%,20px) scale(.6);opacity:0}100%{transform:translate(-50%,0) scale(1);opacity:1}}

/* —— 泡泡 —— */
.fx-bubble{position:absolute;bottom:-30px;border-radius:50%;opacity:.8;animation:bubbleRise linear forwards}
@keyframes bubbleRise{0%{transform:translateY(0) scale(.6);opacity:.8}100%{transform:translateY(-105vh) scale(1.2);opacity:0}}
/* —— 爱心 —— */
.fx-heart{position:absolute;bottom:10%;font-size:20px;opacity:.9;animation:heartFloat linear forwards}
@keyframes heartFloat{0%{transform:translateY(0) scale(.5) rotate(-10deg);opacity:.9}100%{transform:translateY(-80vh) scale(1.3) rotate(15deg);opacity:0}}
/* —— 星星雨 —— */
.fx-star{position:absolute;top:-20px;font-size:16px;opacity:.9;animation:starFall linear forwards}
@keyframes starFall{0%{transform:translateY(0) rotate(0);opacity:.9}100%{transform:translateY(105vh) rotate(360deg);opacity:0}}
/* —— 雪花 —— */
.fx-snow{position:absolute;top:-20px;font-size:14px;opacity:.8;animation:snowFall linear forwards}
@keyframes snowFall{0%{transform:translateY(0) translateX(0);opacity:.8}100%{transform:translateY(105vh) translateX(30px);opacity:0}}
/* —— 金币雨 —— */
.fx-coin{position:absolute;top:-24px;font-size:18px;opacity:.95;animation:coinFall linear forwards}
@keyframes coinFall{0%{transform:translateY(0) rotateY(0);opacity:.95}100%{transform:translateY(105vh) rotateY(720deg);opacity:0}}
/* —— 屏幕震动 —— */
@keyframes screenShake{0%,100%{transform:translate(0)}20%{transform:translate(-4px,2px)}40%{transform:translate(4px,-2px)}60%{transform:translate(-3px,-3px)}80%{transform:translate(3px,3px)}}
body.fx-shake{animation:screenShake .35s ease}

/* ============ 属性点条 ============ */
.attr-cell .a-val{font-family:var(--pixel);font-size:13px;color:var(--accent)}
.attr-bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--gold));transition:width .5s}
.attr-tier .got{color:var(--good);font-weight:700}

/* 成长图鉴：属性徽章 —— 每条属性一个独立卡片行（图标+名称 / 进度条 / 点数档位） */
.attr-grid{display:none}                       /* 旧 5列徽章行已弃用，改由 .attr-summary 渲染 */
.badge-cell.attr{display:none}
.attr-summary{display:flex;flex-direction:column;gap:14px;padding-top:4px}
.attr-row{display:grid;grid-template-columns:minmax(0,92px) minmax(0,1fr) auto;align-items:center;gap:14px;min-width:0;
  padding:14px 16px;background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:2px 2px 0 rgba(90,105,120,.06)}
@media(max-width:420px){.attr-row{grid-template-columns:minmax(0,76px) minmax(0,1fr) auto;gap:10px;padding:12px 12px}}
.attr-row .a-name{display:flex;flex-direction:column;align-items:flex-start;gap:3px;font-size:15px;font-weight:700;color:var(--ink);white-space:nowrap;line-height:1.1}
.attr-row .a-name .ic{font-size:24px;line-height:1}
.attr-track{position:relative;height:16px;border-radius:9px;background:rgba(0,0,0,.05);overflow:hidden;border:1px solid var(--line)}
.attr-track>i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--gold));transition:width .5s;border-radius:9px}
.attr-track .a_tiers{position:absolute;inset:0;display:flex;justify-content:space-between;padding:0 3px;pointer-events:none}
.attr-track .a_tiers span{width:3px;height:10px;border-radius:2px;background:rgba(255,255,255,.9);margin-top:3px}
.attr-row .a_val{font-family:var(--pixel);font-size:12px;color:var(--accent);white-space:nowrap;text-align:right;line-height:1.15}
.attr-row .a_val .pt{display:block}
.attr-row .a_val .dots{display:block;font-size:11px;letter-spacing:1px;margin-top:3px}
.attr-row.on{border-color:var(--accent);background:rgb(var(--accent-rgb) / .07)}
.attr-row.got{border-color:var(--gold);background:linear-gradient(135deg,rgb(var(--gold-rgb) / .07),rgba(255,230,179,.11))}
.attr-row.got .a-name,.attr-row.got .a_val,.attr-row.got .a_val .dots{color:var(--gold)}
.attr-foot{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:11px;color:var(--ink-soft);
  padding-top:12px;margin-top:6px;border-top:1px dashed var(--line)}
.attr-foot .rate{font-weight:700;color:var(--accent)}
.attr-foot .money{font-family:var(--pixel);font-size:14px;color:var(--gold);font-weight:700}
.attr-foot .sep{color:var(--line)}

/* ============ 习惯记录 · 多条例表（时间+内容+感受，从新到旧，计数） ============ */
.frag-card{background:var(--panel-solid);border:2px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
.frag-head{display:flex;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.frag-head .f-name{flex:1;min-width:100px;font-weight:700;font-size:15px;border:none;background:transparent}
.frag-count{font-size:11px;font-weight:700;padding:3px 9px;border-radius:10px;background:rgb(var(--accent-rgb) / .10);color:var(--accent)}
.frag-count .total{color:var(--ink-soft);font-weight:600}
.frag-log{position:relative;background:var(--panel);border:1.5px solid var(--line);border-radius:10px;padding:10px 34px 10px 12px;animation:logIn .25s ease}
@keyframes logIn{0%{opacity:0;transform:translateY(-6px)}100%{opacity:1;transform:translateY(0)}}
.frag-log .f-time{font-family:var(--pixel);font-size:11px;color:var(--accent);font-weight:700;letter-spacing:.5px}
.frag-log .f-text{font-size:14px;color:var(--ink);line-height:1.5;margin-top:2px;word-break:break-word}
.frag-log .f-feel{font-size:12px;color:var(--ink-soft);margin-top:3px;font-style:normal}
.frag-log .f-del{position:absolute;top:8px;right:8px;background:transparent;border:none;font-size:14px;opacity:.4;cursor:pointer;transition:.15s}
.frag-log .f-del:hover{opacity:1;color:var(--warn)}
.frag-empty{font-size:12px;color:var(--ink-soft);padding:6px 2px 10px}
.frag-add{display:flex;flex-direction:column;gap:8px;padding:10px;background:rgb(var(--accent-rgb) / .06);border-radius:10px}
.frag-add .f-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.frag-add input,.frag-add textarea{font-family:inherit;color:var(--ink);padding:9px 10px;border:1.5px solid var(--line);border-radius:8px;background:#fff;font-size:14px}
.frag-add .f-time-input{width:78px;text-align:center;flex-shrink:0}
.frag-add .f-text-input{flex:1;min-width:140px}
.frag-add .f-feel-input{flex:1;min-width:120px}
.frag-add button{background:var(--accent);color:#fff;font-weight:700;padding:9px 18px;border-radius:8px;white-space:nowrap;font-size:14px}

/* ============ 习惯记录 · 日期分组 + 折叠 + 封存 ============ */
.frag-groups{display:flex;flex-direction:column;gap:8px;margin-bottom:10px}
.frag-group{background:var(--panel);border:1.5px solid var(--line);border-radius:10px;overflow:hidden;transition:.2s}
.frag-group[open]{box-shadow:2px 2px 0 var(--shadow)}
.frag-group-header{display:flex;align-items:center;gap:8px;padding:10px 14px;cursor:pointer;user-select:none;
  font-size:13px;font-weight:600;color:var(--ink);list-style:none}
.frag-group-header::-webkit-details-marker{display:none}
.frag-group-date{flex:1;font-weight:700}
.frag-group-count{font-size:11px;color:var(--accent);background:rgb(var(--accent-rgb) / .09);padding:2px 8px;border-radius:8px;white-space:nowrap}
.frag-group-seal{font-size:11px;color:var(--ink-soft)}
.frag-group-arrow{font-size:12px;color:var(--ink-soft);transition:transform .2s}
.frag-group[open] .frag-group-arrow{transform:rotate(180deg)}
.frag-group-body{padding:4px 12px 12px;border-top:1px dashed var(--line)}
.frag-group-sealed .frag-group-header{color:var(--ink-soft)}
.frag-group-sealed .frag-group-date{color:var(--ink-soft)}
.frag-group-sealed .frag-log{opacity:.7;background:rgba(0,0,0,.02)}
.frag-group-sealed .frag-log .f-text{color:var(--ink-soft)}
.frag-log-sealed{position:relative}

/* ============ 定时信箱 · 神秘感 ============ */
.letter-intro{font-size:12.5px;color:var(--ink-soft);margin:2px 0 22px;line-height:1.8;
  padding-bottom:16px;border-bottom:1px dashed var(--line-soft)}
/* 信件分区标题：与上方内容留出呼吸，右侧渐隐细线做视觉分组 */
.letter-sec-title{font-size:13px;font-weight:700;color:var(--ink);margin:24px 0 12px;
  display:flex;align-items:center;gap:8px;letter-spacing:.3px}
.letter-sec-title:first-child{margin-top:0}
.letter-sec-title::after{content:'';flex:1;height:1px;
  background:linear-gradient(90deg,var(--line-soft),transparent)}
.letter-empty{font-size:13px;color:var(--ink-soft);padding:10px 2px 4px;line-height:1.7}
.letter-composer{margin-bottom:24px}          /* 编辑卡片 ↓ 与下方列表留出明显间距 */
#letterList{margin-top:8px}
#letterList>div{margin-bottom:8px}            /* 分区标题与卡片之间不黏连 */
.letter-sealed{transition:transform .2s;margin-bottom:12px}
.letter-sealed:active{transform:scale(.97)}
@keyframes shakeLetter{0%,100%{transform:translateX(0)}20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
.letter-opened{border-left:3px solid var(--gold);margin-bottom:12px}

  
/* ============ 健康成就系统（三域独立统计） ============ */
.hg-achv-summary{background:var(--panel-solid);border:2px solid var(--accent-l2);border-radius:12px;
  padding:12px 14px;margin-bottom:12px;display:flex;flex-direction:column;gap:7px}
.hg-achv-row{display:flex;align-items:center;gap:8px;font-size:13px;flex-wrap:wrap}
.hg-achv-row>span:first-child{color:var(--ink-soft);font-weight:600;min-width:66px}
.hg-achv-row b{color:var(--accent);font-size:14px;font-weight:700}
.hg-achv-note{font-size:11px;color:var(--ink-soft);margin-left:auto}
/* ============ 健康人生 · 运动 / 睡眠 扩展 ============ */
/* 运动表单与统计卡（复用 .hg-* 体系，与主应用风格统一） */
.hg-stat{flex:1;min-width:120px;background:var(--panel-solid);border:2px solid var(--line);border-radius:12px;padding:12px 14px}
.hg-sport-rows{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.hg-sport-row{position:relative;display:flex;flex-direction:column;gap:2px;
  background:var(--panel);border:1.5px solid var(--line);border-radius:10px;padding:10px 34px 10px 12px;font-size:13px}
.hg-sport-date{font-family:var(--pixel);font-size:11px;color:var(--accent);font-weight:700}
.hg-sport-kpi{font-size:13px;color:var(--ink);font-weight:600}
.hg-sport-feel,.hg-sleep-feel{font-size:12px;color:var(--ink-soft);font-style:normal}
.hg-sport-del{position:absolute;top:8px;right:8px;background:transparent;border:none;font-size:14px;opacity:.4;cursor:pointer;transition:.15s}
.hg-mile-kpis{display:flex;gap:16px;flex-wrap:wrap;font-size:13px}
.hg-mile-tags{display:flex;flex-wrap:wrap;gap:6px}
.hg-empty{font-size:12px;color:var(--ink-soft)}
/* 睡眠进度条（起止时间 → 带颜色的条） */
.hg-sleepbar{position:relative;height:20px;border-radius:10px;background:rgba(0,0,0,.05);overflow:hidden;margin:8px 0}
.hg-sleepbar>i{position:absolute;top:0;bottom:0;display:block}
/* 彩蛋：落叶 / 羽毛 / 花瓣 / 泡泡（新增自然系效果） */
.fx-falling{position:absolute;top:-24px;opacity:.9;animation:falling linear forwards;pointer-events:none}
@keyframes falling{0%{transform:translateY(0) rotate(0);opacity:.9}100%{transform:translateY(105vh) rotate(360deg);opacity:0}}

/* ============================================================
   UI/UX 优化 · 覆盖层（2026-09-02）
   ① 重点框边框调浅两档（同色系层次：deep / 主色 / l1 / l2）
   ② 折叠面板展开区背景调浅，融入莫兰迪主题
   —— 主题色本身(--accent/--accent-2)不做修改，仅调整其边框与底纹层次
   ============================================================ */

/* ---------- ① 重点框边框：由 var(--accent) 降为 l2 / l1 两档 ---------- */
/* 大卡片 / 容器类重点框 → 最浅档 l2，弱化成"融入背景的柔边" */
.hg-collapsible[open]{border-color:var(--accent-l2)!important}
.matrix-summary{border-color:var(--accent-l2)!important}
.badge-cell.on{border-color:var(--accent-l1)!important;box-shadow:none!important}
.badge-cell.got{border-color:var(--gold-l1)!important}
.path-node.current{border-color:var(--gold-l1)!important;box-shadow:0 0 10px rgb(var(--gold-rgb) / .35)!important}
.path-node.reached{border-color:var(--good-l1)!important}
.quest .q-no,.ci-no{background:var(--accent-deep)}
.nav button.active{background:var(--accent);border-color:var(--accent-l1)}
.card,.stat,.quest{border-color:var(--line-soft)!important}
.hamburger{border-color:var(--accent-l1)!important;color:var(--accent-deep)}

/* 输入框 / 小控件 → 常规浅档 l1（可见但不抢眼） */
input:focus,textarea:focus,select:focus{border-color:var(--accent-l1)!important;
  box-shadow:0 0 0 3px rgb(var(--accent-rgb) / .13)!important;outline:none}
.quick-add .qa-primary{border-color:var(--accent-l1)!important}
.tag-input{border-color:var(--accent-l1)!important}
.ci-btn:hover:not(:disabled){border-color:var(--accent-l1)!important}
.badge-group-summary:hover,.path-summary:hover{border-color:var(--accent-l1)!important}

/* 强调色块（按钮/标签）保持主题色，仅描边降一档，避免"实色+深边"显脏 */
.btn,.mini-btn.primary,.qa-btn{box-shadow:0 2px 6px rgb(var(--accent-rgb) / .20)}
.achievement-tag{border-color:var(--gold-l1)!important;
  background:linear-gradient(135deg,#fdf6e8,#f9ecd6)!important;color:#9c7d4a!important}
.ci-btn.on,.ci-btn.active{background:var(--good)!important;border-color:var(--good-l1)!important}
.ci-auto-ok{border-color:var(--good-l1)!important;background:rgb(var(--good-rgb) / .13)!important}
.ci-auto-fail{border-color:var(--warn-l1)!important;background:rgb(var(--warn-rgb) / .12)!important}

/* ---------- ② 折叠面板：展开区背景调浅，与莫兰迪融合 ---------- */
.hg-collapsible{background:rgba(255,255,255,.42)!important;border-color:var(--line-soft)!important}
.hg-collapsible > summary{background:linear-gradient(135deg,rgb(var(--accent-rgb) / .09),rgb(var(--accent-rgb) / .05))!important}
.hg-collapsible > summary:hover{background:linear-gradient(135deg,rgb(var(--accent-rgb) / .13),rgb(var(--accent-rgb) / .07))!important}
.hg-collapsible[open] > summary{background:linear-gradient(135deg,rgb(var(--accent-rgb) / .14),rgb(var(--gold-rgb) / .08))!important;
  border-radius:12px 12px 0 0}
.hg-collapsible[open] .hg-sec-arrow{background:var(--accent-l1)!important;color:var(--accent-deep)!important}
.hg-collapsible .hg-sec-count{color:var(--accent-deep)!important;background:rgb(var(--accent-rgb) / .12)!important}

/* 折叠组：summary 与 body 视觉连续，消除"上下颜色不一致" */
.hg-group{border:2px solid var(--line-soft)!important;border-radius:14px;overflow:hidden;
  margin-bottom:10px;background:rgba(255,255,255,.42)}
.hg-group > summary{display:flex;align-items:center;gap:10px;cursor:pointer;list-style:none;
  user-select:none;padding:13px 16px;font-size:14px;font-weight:800;color:var(--ink);
  background:linear-gradient(135deg,rgb(var(--accent-rgb) / .10),rgb(var(--accent-rgb) / .05));
  transition:.18s}
.hg-group > summary::-webkit-details-marker{display:none}
.hg-group > summary:hover{background:linear-gradient(135deg,rgb(var(--accent-rgb) / .15),rgb(var(--accent-rgb) / .08))}
.hg-group[open] > summary{border-radius:12px 12px 0 0;
  background:linear-gradient(135deg,rgb(var(--accent-rgb) / .15),rgb(var(--gold-rgb) / .09))}
.hg-group .hg-group-body{padding:14px 16px;background:rgba(255,255,255,.42);
  border-top:1px solid var(--line-soft)}
.hg-group .hg-sec-count{font-size:11px;font-weight:800;color:var(--accent-deep);
  background:rgb(var(--accent-rgb) / .14);padding:3px 10px;border-radius:9px;margin-left:auto;white-space:nowrap}
.hg-group .hg-sec-arrow{font-size:13px;color:var(--accent-deep);transition:transform .25s;flex-shrink:0;
  width:22px;height:22px;border-radius:50%;background:rgb(var(--accent-rgb) / .16);
  display:inline-flex;align-items:center;justify-content:center;line-height:1}
.hg-group[open] .hg-sec-arrow{transform:rotate(180deg)}

/* ---------- ④ 荣誉圣殿：废除 3×3，改为 1 行 9 列（1×9），尺寸参照「进阶之路」path-node ----------
   宽屏：9 枚一行排开；窄屏：flex-wrap 自动换行，不挤压不变形 */
.badge-grid{display:flex!important;flex-wrap:wrap;gap:8px;padding:6px 2px;justify-content:flex-start}
.badge-cell{flex:0 0 64px!important;width:64px!important;height:68px!important;
  aspect-ratio:auto!important;max-width:76px;min-width:58px;
  padding:7px 3px!important;gap:2px!important;border-radius:12px!important;
  border-width:1.5px!important}
.badge-emoji{font-size:22px!important;line-height:1}
.badge-cell.locked .badge-emoji{font-size:17px!important;opacity:.55}
.badge-name{font-size:9px!important;line-height:1.15;letter-spacing:0!important;
  max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.badge-mark{font-size:8px!important;top:3px!important;right:4px!important}
/* 锁定态：emoji 已是 🔒，右上角再叠一个锁太挤，隐藏 */
.badge-cell.locked .badge-mark{display:none}
/* 极窄屏（<360px）再收一档，保证一行至少 4 枚 */
@media(max-width:360px){
  .badge-grid{gap:6px}
  .badge-cell{flex:0 0 56px!important;width:56px!important;height:62px!important;min-width:52px}
  .badge-emoji{font-size:19px!important}
}

/* ============================================================
   「健康人生」记录界面重构 —— 三大模块（参考 Keep / 薄荷健康 表单设计）
   快速记录（默认展开） · 睡眠记录（默认折叠） · 运动记录（默认折叠）
   每个模块右上角独立「记录今日」按钮，分区保存互不干扰
   ============================================================ */
.hg-mod{border:1.5px solid var(--line-soft);border-radius:14px;overflow:hidden;
  margin-bottom:10px;background:rgba(255,255,255,.45)}
.hg-mod > summary{display:flex;align-items:center;gap:9px;cursor:pointer;
  list-style:none;user-select:none;padding:11px 13px;transition:.18s;
  background:linear-gradient(135deg,rgb(var(--accent-rgb) / .10),rgb(var(--accent-rgb) / .05))}
.hg-mod > summary::-webkit-details-marker{display:none}
.hg-mod > summary:hover{background:linear-gradient(135deg,rgb(var(--accent-rgb) / .15),rgb(var(--accent-rgb) / .08))}
.hg-mod[open] > summary{border-bottom:1px solid var(--line-soft);
  background:linear-gradient(135deg,rgb(var(--accent-rgb) / .14),rgb(var(--gold-rgb) / .07))}
.hg-mod-ico{font-size:17px;flex-shrink:0}
.hg-mod-title{font-size:14px;font-weight:800;color:var(--ink);flex-shrink:0}
.hg-mod-sub{font-size:10px;color:var(--ink-soft);font-weight:500;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
/* 模块右上角「记录今日」按钮：小胶囊，弱化存在感但一点就到 */
.hg-mod-save{flex-shrink:0;margin-left:auto;font-size:11px;font-weight:700;
  padding:5px 11px;border-radius:20px;border:1.5px solid var(--accent-l1);
  background:rgba(255,255,255,.75);color:var(--accent-deep);transition:.15s;white-space:nowrap}
.hg-mod-save:hover{background:var(--accent-l1);color:#fff;border-color:var(--accent-l1)}
.hg-mod-save:active{transform:scale(.96)}
.hg-sec-arrow{font-size:11px;color:var(--accent-deep);flex-shrink:0;transition:transform .25s;
  width:20px;height:20px;border-radius:50%;background:rgb(var(--accent-rgb) / .16);
  display:inline-flex;align-items:center;justify-content:center;line-height:1}
.hg-mod[open] .hg-sec-arrow{transform:rotate(180deg)}
.hg-mod-body{padding:13px;background:rgba(255,255,255,.42)}
/* 表单网格：两列，窄屏单列 */
.hg-fields{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:480px){.hg-fields{grid-template-columns:1fr}}
.hg-field{display:flex;flex-direction:column;gap:5px;min-width:0}
.hg-field.hg-wide{grid-column:1 / -1}
.hg-field > span{font-size:10.5px;font-weight:700;color:var(--accent-deep);letter-spacing:.3px}
.hg-field input,.hg-field select,.hg-field textarea{
  padding:9px 11px;border:1.5px solid var(--line-soft);border-radius:10px;
  background:rgba(255,255,255,.9);font-size:13.5px;color:var(--ink);width:100%;
  box-sizing:border-box;transition:.15s;font-family:inherit}
.hg-field input:focus,.hg-field select:focus,.hg-field textarea:focus{
  border-color:var(--accent-l1);outline:none;box-shadow:0 0 0 3px rgb(var(--accent-rgb) / .12)}
.hg-field input::placeholder,.hg-field textarea::placeholder{color:#b9b2c6;font-size:12.5px}
/* 偏好选择区 */
.hg-pref{margin-top:11px}
.hg-pref-label{font-size:10.5px;font-weight:700;color:var(--accent-deep);margin-bottom:6px;letter-spacing:.3px}
.hg-chip-row{display:flex;flex-wrap:wrap;gap:6px}
.hg-chip{font-size:11px;padding:5px 11px;border-radius:20px;cursor:pointer;
  border:1.5px solid var(--line-soft);background:rgba(255,255,255,.7);
  color:var(--ink-soft);transition:.15s;user-select:none;white-space:nowrap}
.hg-chip:hover{border-color:var(--accent-l1);color:var(--accent-deep)}
.hg-chip.on{background:var(--accent-l1);border-color:var(--accent-l1);
  color:#fff;font-weight:700;box-shadow:0 2px 5px rgb(var(--accent-rgb) / .20)}
.hg-calout{margin-top:9px;font-size:12px;color:var(--accent-deep);font-weight:700;
  background:rgb(var(--gold-rgb) / .12);border-radius:10px;padding:9px 11px;line-height:1.6}
/* 睡眠时长预览条 */
.hg-sleep-preview{display:flex;align-items:baseline;gap:10px;margin:11px 0;
  padding:9px 12px;border-left:3px solid var(--line-soft);border-radius:0 10px 10px 0;
  background:rgba(255,255,255,.6)}
.hg-sleep-preview-val{font-size:20px;font-weight:800;line-height:1}
.hg-sleep-preview-txt{font-size:11px;color:var(--ink-soft);line-height:1.5}
/* 无睡眠数据时：引导语用小字细体，不套用数值的大号粗体样式 */
.hg-sleep-preview-empty{font-size:12.5px;font-weight:400;color:var(--ink-soft);line-height:1.5;letter-spacing:.2px}

/* 板块分组小标题（历史数据 / 成就与奖励） */
.hg-sec-head{display:flex;align-items:center;gap:8px;margin:24px 0 12px;
  font-size:12px;font-weight:800;color:var(--accent-deep);letter-spacing:.5px}
.hg-sec-head::after{content:'';flex:1;height:1px;background:linear-gradient(90deg,var(--line-soft),transparent)}
.hg-sec-head:first-of-type{margin-top:6px}

/* 轻量浮动提示 */
.hg-toast{position:fixed;left:50%;bottom:88px;transform:translateX(-50%) translateY(12px);
  background:rgba(74,68,88,.92);color:#fff;font-size:13px;font-weight:600;
  padding:10px 18px;border-radius:22px;z-index:9999;opacity:0;pointer-events:none;
  transition:opacity .25s,transform .25s;max-width:86vw;text-align:center;
  box-shadow:0 6px 18px rgba(74,68,88,.25)}
.hg-toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ---------- ⑤ 徽章点亮规则卡片 UI 优化 ---------- */
.rule-card{padding:16px}
.rule-head{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.rule-ico{font-size:20px;width:38px;height:38px;border-radius:11px;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  background:linear-gradient(135deg,rgb(var(--gold-rgb) / .20),rgb(var(--accent-rgb) / .14))}
.rule-title{flex:1;min-width:0}
.rule-title b{display:block;font-size:14px;font-weight:800;color:var(--ink)}
.rule-title small{font-size:11px;color:var(--ink-soft)}
.rule-state{font-size:10px;font-weight:700;padding:4px 11px;border-radius:20px;white-space:nowrap;flex-shrink:0}
.rule-state.on{background:rgb(var(--good-rgb) / .18);color:var(--good-deep)}
.rule-state.off{background:rgb(var(--accent-rgb) / .18);color:var(--accent-deep)}
.rule-switch-row{display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:10px 13px;border-radius:11px;background:rgba(255,255,255,.62);
  border:1.5px solid var(--line-soft);font-size:13px;font-weight:600;color:var(--ink)}
.rule-cmp{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:10px}
@media(max-width:480px){.rule-cmp{grid-template-columns:1fr}}
.rule-opt{padding:10px 12px;border-radius:11px;border:1.5px solid var(--line-soft);
  background:rgba(255,255,255,.55);transition:.18s}
.rule-opt.active{border-color:var(--accent-l1);
  background:linear-gradient(135deg,rgb(var(--accent-rgb) / .13),rgb(var(--gold-rgb) / .07));
  box-shadow:0 2px 8px rgb(var(--accent-rgb) / .14)}
.rule-opt .ro-ico{font-size:15px}
.rule-opt b{font-size:12px;font-weight:700;color:var(--ink);margin-left:5px}
.rule-opt small{display:block;font-size:10.5px;color:var(--ink-soft);line-height:1.65;margin-top:4px}

/* ============ 设置页 · 主题色系统（预设 / 色阶 / 联动预览） ============ */
.th-presets{display:flex;flex-wrap:wrap;gap:8px}
.th-preset{display:inline-flex;align-items:center;gap:6px;padding:6px 12px 6px 6px;border-radius:20px;
  border:2px solid var(--line-soft);background:var(--panel-solid);font-size:12px;color:var(--ink-soft);
  font-weight:600;transition:.15s}
.th-preset i{width:20px;height:20px;border-radius:50%;display:inline-block;border:1.5px solid rgba(255,255,255,.7)}
.th-preset:hover{border-color:var(--accent-l1);transform:translateY(-1px)}
.th-preset.on{border-color:var(--accent);color:var(--accent-deep);background:var(--btn-soft);
  box-shadow:0 0 0 3px var(--focus-ring)}
.th-pick{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.th-pick-item{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-soft)}
.th-pick-item input[type=color]{width:52px;height:34px;border:2px solid var(--line);border-radius:8px;
  background:none;padding:2px;cursor:pointer}
.th-pick-name{font-size:12px;font-weight:700;color:var(--accent-deep);background:var(--btn-soft);
  padding:4px 12px;border-radius:14px}
.th-preview{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:12px;border-radius:12px;
  background:linear-gradient(135deg,rgb(var(--accent-rgb) / .06),rgb(var(--accent-2-rgb) / .05));
  border:1.5px dashed var(--accent-l1)}
.th-pv{font-size:12px;font-weight:700;padding:8px 14px;border-radius:10px;line-height:1}
.th-pv-primary{background:var(--btn-primary);color:var(--btn-primary-ink);box-shadow:0 2px 6px rgb(var(--accent-rgb) / .28)}
.th-pv-soft{background:var(--btn-soft);color:var(--btn-soft-ink);border:1.5px solid var(--btn-soft-line)}
.th-pv-link{color:var(--link);text-decoration:underline;padding:8px 4px}
.th-pv-card{background:var(--panel-solid);color:var(--ink);border:2px solid var(--accent-l2)}
.th-pv-icon{color:var(--icon);background:rgb(var(--accent-rgb) / .10);border-radius:50%;padding:8px 10px}
.th-scale{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.th-scale-item{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 8px;border-radius:10px;
  background:var(--panel-solid);border:1.5px solid var(--line-soft);min-width:74px}
.th-scale-item i{width:100%;height:16px;border-radius:5px;display:block}
.th-scale-item b{font-size:10px;color:var(--ink-soft);font-weight:700}
.th-scale-item small{font-size:9px;color:var(--ink-soft);opacity:.75;font-family:var(--pixel)}

/* ============ 健康人生 · 自动画像卡片 + 重塑之路成就徽章 ============ */
.hg-auto{display:flex;align-items:center;gap:10px;padding:10px 12px;margin-top:10px;border-radius:12px;
  background:linear-gradient(135deg,rgb(var(--accent-rgb) / .10),rgb(var(--accent-2-rgb) / .07));
  border:1.5px solid var(--accent-l1);transition:.18s}
.hg-auto.muted{background:var(--panel-solid);border-style:dashed;border-color:var(--line);opacity:.85}
.hg-auto-ico{font-size:20px;line-height:1;flex-shrink:0;letter-spacing:-2px}
.hg-auto-txt{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:2px}
.hg-auto-txt b{font-size:13px;color:var(--ink);font-weight:800}
.hg-auto-txt small{font-size:11px;color:var(--ink-soft);line-height:1.5}
.hg-auto-badge{flex:0 0 auto;font-size:9px;font-weight:800;color:var(--accent-deep);
  background:rgb(var(--accent-rgb) / .16);padding:3px 8px;border-radius:10px;letter-spacing:.5px}
.hg-badge-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.hg-badge{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:12px;
  background:var(--panel-solid);border:1.5px solid var(--line-soft);opacity:.72;transition:.18s}
.hg-badge.on{opacity:1;border-color:var(--accent-l1);
  background:linear-gradient(135deg,rgb(var(--accent-rgb) / .09),rgb(var(--gold-rgb) / .07));
  box-shadow:0 2px 8px rgb(var(--accent-rgb) / .12)}
.hg-badge-ico{font-size:22px;line-height:1;flex:0 0 auto;margin-top:2px;filter:grayscale(.6)}
.hg-badge.on .hg-badge-ico{filter:none}
.hg-badge-body{flex:1 1 auto;min-width:0}
.hg-badge-body b{display:block;font-size:13px;color:var(--ink);font-weight:800;margin-bottom:2px}
.hg-badge-body small{display:block;font-size:10.5px;color:var(--ink-soft);line-height:1.5;margin-bottom:6px}
.hg-badge-bar{height:5px;border-radius:3px;background:var(--line-soft);overflow:hidden}
.hg-badge-bar i{display:block;height:100%;border-radius:3px;
  background:linear-gradient(90deg,var(--accent),var(--accent-2));transition:width .4s ease}
.hg-badge-num{font-size:10px;color:var(--ink-soft);margin-top:4px;font-family:var(--pixel)}
.hg-badge-num.ok{color:var(--good-deep)}
@media(max-width:520px){.hg-badge-grid{grid-template-columns:1fr}}

/* ================= 睡前仪式 chip ================= */
.hq-ritual-row{flex-wrap:wrap}
.hg-chip.hq-chip{position:relative;padding-right:12px}
.hg-chip.hq-chip.on{background:linear-gradient(135deg,rgb(var(--accent-rgb) / .22),rgb(var(--accent-2-rgb) / .16));
  border-color:var(--accent);color:var(--accent-deep);font-weight:800}
.hq-chip-n{position:absolute;top:-6px;right:-6px;min-width:16px;height:16px;line-height:16px;
  border-radius:8px;background:var(--accent);color:#fff;font-size:9px;font-weight:800;
  font-style:normal;text-align:center;padding:0 4px;box-shadow:0 1px 3px rgb(var(--accent-rgb) / .4)}

/* ================= 任务大厅 ================= */
.hq-legend{display:flex;flex-wrap:wrap;gap:12px;font-size:11px;color:var(--ink-soft);margin-bottom:10px}
.hq-dot{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:4px;vertical-align:middle}
.hq-dot.req{background:var(--gold);border:1.5px solid var(--gold-deep)}
.hq-dot.opt{background:#d8dee6;border:1.5px solid #aab5c2}
.hq-sec-label{font-size:11px;font-weight:800;color:var(--accent-deep);letter-spacing:.5px;
  margin:14px 0 8px;padding-bottom:5px;border-bottom:1px dashed var(--line-soft)}
.hq-sec-label:first-child{margin-top:0}
.hq-task-list{display:flex;flex-direction:column;gap:6px}
.hq-task{display:flex;align-items:center;gap:9px;padding:9px 11px;border-radius:11px;
  background:rgba(255,255,255,.55);border:1.5px solid var(--line-soft);transition:.15s}
.hq-task.req{border-left:3px solid var(--gold)}
.hq-task.opt{border-left:3px solid #c3ccd6}
.hq-task.done{background:linear-gradient(135deg,rgb(var(--good-rgb) / .13),rgb(var(--good-rgb) / .06));
  border-color:var(--good-l1)}
.hq-task-mark{width:17px;height:17px;line-height:16px;text-align:center;border-radius:50%;
  border:1.5px solid var(--line);font-size:10px;font-weight:800;color:var(--ink-soft);flex-shrink:0}
.hq-task.done .hq-task-mark{background:var(--good);border-color:var(--good);color:#fff}
.hq-task-ico{font-size:15px;flex-shrink:0}
.hq-task-name{flex:1 1 auto;min-width:0;font-size:13px;font-weight:600}
.hq-task.done .hq-task-name{color:var(--good-deep)}
.hq-task-exp{font-size:10px;font-weight:800;color:var(--gold-deep);
  background:var(--gold-l2);padding:2px 7px;border-radius:8px;flex-shrink:0}
.hq-foot{margin-top:9px;font-size:11px}
.hq-note{color:var(--ink-soft)}
.hq-note.ok{color:var(--good-deep);font-weight:700}

/* 任务大厅内的子折叠块（本周 / 本月，默认收起） */
.hq-sub{margin-top:12px;border-radius:12px;border:1.5px solid var(--line-soft);
  background:rgba(255,255,255,.42);overflow:hidden}
.hq-sub>summary{display:flex;align-items:center;gap:7px;cursor:pointer;list-style:none;
  padding:9px 12px;font-size:12px;font-weight:800;color:var(--accent-deep);
  background:linear-gradient(135deg,rgb(var(--accent-rgb) / .10),rgb(var(--accent-rgb) / .04));
  user-select:none}
.hq-sub>summary::-webkit-details-marker{display:none}
.hq-sub>summary .hg-sec-arrow{font-size:11px;transition:transform .2s;color:var(--accent)}
.hq-sub[open]>summary .hg-sec-arrow{transform:rotate(180deg)}
.hq-sub>summary .hg-sec-count{margin-left:auto}
.hq-sub>.hq-period-list{padding:10px 12px 12px}

.hq-period-list{display:flex;flex-direction:column;gap:7px}
.hq-period{display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:11px;
  background:rgba(255,255,255,.55);border:1.5px solid var(--line-soft);transition:.15s}
.hq-period.done{background:linear-gradient(135deg,rgb(var(--good-rgb) / .12),rgb(var(--accent-rgb) / .06));
  border-color:var(--good-l1)}
.hq-period-ico{font-size:16px;flex-shrink:0;opacity:.75}
.hq-period.done .hq-period-ico{opacity:1}
.hq-period-body{flex:1 1 auto;min-width:0}
.hq-period-body b{display:block;font-size:12.5px;font-weight:700;margin-bottom:5px}
.hq-period-bar{height:5px;border-radius:3px;background:var(--line-soft);overflow:hidden}
.hq-period-bar i{display:block;height:100%;border-radius:3px;
  background:linear-gradient(90deg,var(--accent-l1),var(--accent));transition:width .4s}
.hq-period.done .hq-period-bar i{background:linear-gradient(90deg,var(--good-l1),var(--good))}
