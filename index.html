/* ================= 成就解锁 · 徽章弹出 ================= */
.hachv-pop-wrap{position:fixed;inset:0;z-index:6000;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:10px;pointer-events:none;
  background:rgba(40,32,56,.28);backdrop-filter:blur(3px);
  animation:hachvFade .3s ease}
.hachv-pop-wrap.out{animation:hachvFadeOut .55s ease forwards}
@keyframes hachvFade{from{opacity:0}to{opacity:1}}
@keyframes hachvFadeOut{to{opacity:0}}
.hachv-pop{display:flex;align-items:center;gap:12px;min-width:230px;max-width:88vw;
  padding:13px 20px 13px 15px;border-radius:16px;
  background:linear-gradient(135deg,#fff,var(--accent-l2));
  border:2px solid var(--accent);box-shadow:0 8px 26px rgb(var(--accent-rgb) / .3);
  animation:hachvPopIn .5s cubic-bezier(.2,1.4,.4,1) both}
@keyframes hachvPopIn{0%{opacity:0;transform:translateY(26px) scale(.75)}
  60%{transform:translateY(-5px) scale(1.04)}100%{opacity:1;transform:translateY(0) scale(1)}}
.hachv-pop-ico{font-size:30px;line-height:1;filter:drop-shadow(0 2px 4px rgb(var(--accent-rgb) / .35))}
.hachv-pop-name{font-size:14.5px;font-weight:800;color:var(--accent-deep);flex:1 1 auto}
/* —— 跨域隐藏成就：金色描边 + 三域剪影环绕 —— */
.hachv-pop.cross{border-color:var(--gold);
  background:linear-gradient(135deg,#fffaf0,var(--gold-l2));
  box-shadow:0 10px 32px rgb(var(--accent-rgb) / .38),0 0 0 3px rgba(214,165,103,.18)}
.hachv-pop.cross .hachv-pop-name i{display:block;font-style:normal;font-size:10.5px;
  font-weight:700;color:var(--gold-deep);letter-spacing:1px;margin-top:2px}
.hachv-pop-cross{display:flex;flex-direction:column;gap:3px;font-size:13px;
  opacity:.85;animation:hachvCrossIn .9s ease both}
.hachv-pop-cross span{animation:hachvCrossIn 1s ease both}
.hachv-pop-cross span:nth-child(2){animation-delay:.14s}
.hachv-pop-cross span:nth-child(3){animation-delay:.28s}
@keyframes hachvCrossIn{0%{opacity:0;transform:translateX(-8px) scale(.6)}
  100%{opacity:.85;transform:translateX(0) scale(1)}}
.hachv-pop-exp{font-size:11px;font-weight:800;color:#fff;background:linear-gradient(135deg,var(--gold),var(--gold-deep));
  padding:3px 9px;border-radius:9px;flex-shrink:0}

/* ================= 阶级变化提示 ================= */
.hachv-tier-toast{position:fixed;left:50%;top:16%;transform:translateX(-50%);z-index:6100;
  display:flex;align-items:center;gap:10px;padding:11px 20px;border-radius:14px;
  background:rgba(255,255,255,.94);backdrop-filter:blur(10px);
  box-shadow:0 8px 24px rgba(80,66,104,.2);pointer-events:none;
  animation:hachvTierIn .45s cubic-bezier(.2,1.5,.4,1) both}
.hachv-tier-toast.out{animation:hachvTierOut .55s ease forwards}
@keyframes hachvTierIn{0%{opacity:0;transform:translateX(-50%) translateY(-16px) scale(.9)}
  100%{opacity:1;transform:translateX(-50%) translateY(0) scale(1)}}
@keyframes hachvTierOut{to{opacity:0;transform:translateX(-50%) translateY(-12px)}}
.hachv-tier-toast.up{border:2px solid var(--good)}
.hachv-tier-toast.down{border:2px solid var(--warn)}
.hachv-tier-arrow{font-size:17px;font-weight:900;animation:hachvArrow .7s ease-in-out infinite alternate}
.hachv-tier-toast.up .hachv-tier-arrow{color:var(--good-deep)}
.hachv-tier-toast.down .hachv-tier-arrow{color:var(--warn-deep);
  animation-name:hachvArrowDown}
@keyframes hachvArrow{from{transform:translateY(3px)}to{transform:translateY(-3px)}}
@keyframes hachvArrowDown{from{transform:translateY(-3px)}to{transform:translateY(3px)}}
.hachv-tier-txt{font-size:14px;font-weight:800;color:var(--ink)}
.hachv-tier-toast.up .hachv-tier-txt b{color:var(--good-deep)}
.hachv-tier-toast.down .hachv-tier-txt b{color:var(--warn-deep)}

@media(max-width:480px){
  .hachv-pop{min-width:0;width:86vw;padding:11px 15px}

<body>

<!-- ========== 封面 ========== -->
<div id="cover">
  <canvas id="coverSea"></canvas>
  <div class="cover-title">
    <h1>游戏人生</h1>
    <div class="sub">LIFE IS A GAME</div>
  </div>
  <div class="cover-hint">— click anywhere to enter —</div>
</div>

<!-- ========== 主应用 ========== -->
<div id="app">
  <div class="topbar">
    <button class="hamburger" onclick="toggleSidebar()">☰</button>
    <div class="stats">
      <div class="stat">Be born <b id="statDay">1</b></div>
      <div class="stat">💰 <b id="statMoney">0</b></div>
      <div class="stat">✍️ <b id="statWord">0</b></div>
    </div>
  </div>

  <div id="sidebar">
    <div class="side-head">
      <div class="logo">🎮 游戏人生</div>
      <div class="day" id="sideDay">Day 1 · LIFE IS A GAME</div>
    </div>
    <div class="nav" id="nav"></div>
  </div>

  <div class="page" id="page"></div>
</div>

<!-- ========== 修正日志弹窗 ========== -->
<div class="modal" id="correctionModal">
  <div class="modal-box">
    <h3>📝 申请修正</h3>
    <div class="field">
      <label>原内容</label>
      <div id="corrOrig" style="padding:8px;background:var(--bg2);border-radius:8px;font-size:13px"></div>
    </div>
    <div class="field">
      <label>修正为</label>
      <input id="corrNew" placeholder="留空表示删除该条">
    </div>
    <div class="field">
      <label>原因（留档）</label>
      <input id="corrReason" placeholder="如：记录有误">
    </div>
    <div class="split">
      <button class="btn ghost" onclick="closeCorrection()">取消</button>
      <button class="btn" onclick="submitCorrection()">提交（将记入修正日志）</button> 
    </div>
  </div>
</div>

<script>
/* ════════════════════════════════════════════════════════════════
   💫 属性点系统 + 改名继承 + 成就庆祝动画
   注入到主脚本之前（通过 _inject.py 拼接到 <script> 顶部）
════════════════════════════════════════════════════════════════ */

/* ---------- 属性点定义（5类 × 3档徽章：30/60/100） ---------- */
const ATTR_DEFS = {
  health:  { icon:'🦾', name:'健康', desc:'运动、饮食、作息、睡觉、体重管理、瑜伽、体态' },
  beauty:  { icon:'🪞', name:'美貌', desc:'化妆、护肤、穿搭、面膜、戒指、项链、美甲' },
  wisdom:  { icon:'🧠', name:'智慧', desc:'阅读、学习、语言、写作、书籍、日语、韩语、英语、辩论' },
  will:    { icon:'🔥', name:'意志', desc:'坚持打卡、早起、完成任务、日记、复盘' },
  charm:   { icon:'💖', name:'魅力', desc:'社交、心情、画画、朋友、丙烯、练字、普通话、自媒体、兴趣' }
};
// 注：desc 仅作内部数据保留（导出/调试可见），荣誉圣殿渲染不再展示，界面保持干净。
const ATTR_TIERS = [30, 60, 100];   // 每档阈值
const TASK_ALIAS = {
  // 历史同义名 → 徽章墙规范名（消除「同一个任务两个名字」的重复引用）
  '做饭':'做菜','擦家具':'整理房间','家具':'整理房间','家务':'整理房间',
  '宠物':'照顾宠物',
  '影评':'写影评','自媒体':'影视自媒体',
  '阅读':'阅读名著','专业':'专业书',
  '看电视剧':'电视剧','影视':'电视剧',
  '体重管理':'体重'
};
function canonTask(name){ return TASK_ALIAS[name] || name; }
/* 反向索引：规范名 → 历史同义名列表。老存档里记在旧名下的进度，照样能读出来，不丢数据 */
const TASK_ALIAS_REV = (function(){
  const m={};
  for(const a in TASK_ALIAS){ const c=TASK_ALIAS[a]; (m[c]=m[c]||[]).push(a); }
  return m;
})();
function bookOf(book, taskName){
  if(book[taskName]) return book[taskName];
  const alt=TASK_ALIAS_REV[taskName]||[];
  for(let i=0;i<alt.length;i++){ if(book[alt[i]]) return book[alt[i]]; }
  return {count:0, tier:0};
}

const ATTR_PER_TASK = {
  // 每个任务打卡时加哪些属性、各加几点（未列出的默认 {will:1}）
  // 键名统一为「徽章墙规范名」；历史同义名由 TASK_ALIAS 自动映射，不再重复定义
  /*🐦‍🔥  成长印记*/
  '做菜':{health:1,charm:1},
  '拖地':{health:1,will:1},
  '整理房间':{health:1,will:1},
  '照顾宠物':{charm:2},
  '散步':{health:1,charm:1},
  '运动':{health:2,will:1},
  '早起':{will:2},
  '喝水':{health:1},
  '记账':{will:1},
  /* 📝 笔墨征程 */
  '写日记':{wisdom:1,will:1},
  '写影评':{wisdom:2},
  '影视自媒体':{wisdom:1,charm:1},
  '日程设计':{will:2},
  '写小说':{wisdom:2},
  '写诗':{wisdom:1,charm:1},
  '做手帐':{charm:1,wisdom:1},
  '写复盘':{wisdom:1,will:1},
  '翻译':{wisdom:2},
  /* 🧠 智识进阶 */
  '普通话':{wisdom:2},
  '英语':{wisdom:2},
  '韩语':{wisdom:2},
  '日语':{wisdom:1},
  '阅读名著':{wisdom:1},
  '专业书':{wisdom:1},
  '艺术':{wisdom:1},
  '心理学':{wisdom:1},
  '电视剧':{charm:1},
  /* 🌿 生命能量 */
  '体重':{health:2,will:1},
  '化妆':{beauty:2},
  '护肤':{beauty:1,health:1},
  '美甲':{beauty:2},
  '瑜伽':{health:2},
  '体态':{health:1,charm:1},
  '泡脚':{health:1},
  '冥想':{will:2},
  '作息':{health:1,will:1},
  /* 💓 灵魂逸趣 */
  '电影':{charm:2},
  '丙烯画画':{charm:2},
  '毛笔字':{wisdom:1,charm:1},
  '数字油画':{charm:2},
  '拍照':{charm:2},
  '唱歌':{charm:1},
  '乐器':{charm:1,wisdom:1},
  '手工':{charm:1},
  '烘焙':{health:1,charm:1},
  /* 其他自建任务（徽章墙外，用户可自行添加） */
  '朋友':{charm:1},
  '朋友聚会':{charm:1},
  '画画':{charm:2}
};
function attrGainsFor(taskName){
  return ATTR_PER_TASK[canonTask(taskName)] || {will:1};   // 未列出的默认加意志力
}

/* ---------- 属性点 → 金钱：汇率随「总阶级和」阶梯提升（幂等，刷新不重复加） ---------- */
// 「总阶级和」= 所有主线任务的当前阶级(level)之和，衡量"整体走到多远了"
function totalStageSum(){
  const prog=DB.progression||{};
  let sum=0;
  for(const id of Object.keys(prog)){ sum+=(prog[id]&&prog[id].level)||1; }
  return sum;
}
// 阶梯汇率：总阶级和 30/50/80/100 为临界点
//   0-29阶→¥0.10   30-49阶→¥0.15   50-79阶→¥0.20   80-99阶→¥0.25   100+阶→¥0.30
function attrPointRate(){
  const stage=totalStageSum();
  if(stage>=100) return 0.30;
  if(stage>=80)  return 0.25;
  if(stage>=50)  return 0.20;
  if(stage>=30)  return 0.15;
  return 0.10;
}
// 当前总属性点
function totalAttrPoints(){return Object.values(DB.attrPoints||{}).reduce((s,v)=>s+(v||0),0)}
// 新增属性点按【当前汇率】折算进余额，只补差额、绝不重复加
function recalcGold(){
  if(DB._lastAttrTotal===undefined) DB._lastAttrTotal=0;
  const now=totalAttrPoints();
  if(now>DB._lastAttrTotal){
    const deltaPts=now-DB._lastAttrTotal;
    const rate=attrPointRate();
    DB.savings=Number(((DB.savings||0)+deltaPts*rate).toFixed(2));
    DB._lastAttrTotal=now;
  }
}
// 累计"属性点折算"总额（余额的一部分），用于明细展示
function totalAttrGold(){return Number((totalAttrPoints()*attrPointRate()).toFixed(2))}
function fmtGold(){return totalAttrGold().toFixed(2)}

/* ---------- 属性点累加（在主线/支线打卡时调用） ---------- */
function awardAttrs(taskName, amt){
  if(!DB.attrPoints) DB.attrPoints={health:0,beauty:0,wisdom:0,will:0,charm:0};
  const gains = attrGainsFor(taskName);
  const unlocked=[];
  for(const k of Object.keys(gains)){
    const before=DB.attrPoints[k]||0;
    DB.attrPoints[k]=before+(gains[k]||1)*(amt||1);
    // 检查是否跨过新档位
    ATTR_TIERS.forEach((th,idx)=>{
      if(before<th && DB.attrPoints[k]>=th){ unlocked.push({attr:k, tier:idx+1, th}); }
    });
  }
  recalcGold();   // 每次属性点变化 → 同步换算成钱（幂等，只补差额）
  return unlocked;   // 返回新解锁的属性徽章，供动画播放
}

/* ---------- 任务稳定 id（用于改名继承） ---------- */
// 主线/支线/碎片 改名时：把 achievementBook 里的条目迁移到新名字（保留进度）
function migrateBookOnRename(oldName, newName){
  const book=DB.achievementBook||(DB.achievementBook={});
  if(oldName===newName) return;
  if(!book[oldName]){ book[newName]=book[oldName]||{count:0,tier:0}; return; }
  book[newName]=book[oldName]; delete book[oldName];
}

/* ---------- 连续打卡检测（支线/碎片连续≥5天） ---------- */
function checkStreak(taskName){
  // 从 healthSeries 之外的 sideHistory / timeline 里按天统计——此处简化为：记录最近打卡日期序列
  // 实际：DB.sideQuests 的 history 已存 {time, note}；用 records 里 extra.side 标记
  let streak=0;
  const days=Object.keys(DB.records).sort().reverse();
  for(const d of days){
    const ex=DB.records[d]&&DB.records[d].extra;
    const side=ex&&ex.side||{};
    if(side[taskName] || (DB.sideQuests||[]).some(s=>s.name===taskName && (s.history||[]).some(h=>h.date===d))){
      streak++; 
    } else break;
  }
  return streak;
}

/* ---------- 庆祝动画系统：多种彩蛋效果随机触发 ---------- */
// 效果类型：confetti(彩纸雨) / bubble(泡泡) / heart(爱心) / star(星星雨) / snow(雪花) / coin(金币雨) / firework(烟花)
// 日常打卡 → 轻量效果（泡泡/星星/爱心，随机一种）
// 重要阶段（升阶/首次解锁/连击）→ 重量效果（彩纸雨+烟花+屏幕震动，随机组合）

function spawnParticles(layer, type, count){
  const make=(cls, styleFn)=>{
    for(let i=0;i<count;i++){
      const el=document.createElement('span');
      el.className=cls;
      styleFn(el, i);
      layer.appendChild(el);
    }
  };
  switch(type){
    case 'bubble':
      make('fx-bubble',(el,i)=>{
        const size=8+Math.random()*18;
        el.style.left=Math.random()*100+'vw';
        el.style.width=size+'px';el.style.height=size+'px';
        el.style.background=[_cv('accent',.55),_cv('accent2',.55),_cv('gold',.55)][i%3];
        el.style.animationDelay=(Math.random()*1.2)+'s';
        el.style.animationDuration=(2+Math.random()*2)+'s';
      });
      break;
    case 'heart':
      make('fx-heart',(el,i)=>{

function celebrate(reason, level){
  if(!reason) reason='升级啦！';
  level = level || 'normal';  // 'light' = 日常打卡, 'normal' = 默认, 'major' = 重要阶段
  let layer=$('#fxLayer');
  if(!layer){ layer=document.createElement('div'); layer.id='fxLayer'; document.body.appendChild(layer); }
  layer.classList.add('fx-show');

  // —— 根据等级选择效果组合 ——
  if(level==='major'){
    // 重要阶段：彩纸雨 + 烟花 + 屏幕震动（不固定，随机组合）
    const majorEffects=['confetti','star','coin'];
    const chosen=majorEffects[Math.floor(Math.random()*majorEffects.length)];
    spawnParticles(layer, chosen, 60);
    // 烟花
    for(let i=0;i<6;i++){
      const f=document.createElement('span');
      f.className='firework';
      f.style.left=(15+Math.random()*70)+'vw';
      f.style.top=(20+Math.random*30||20+Math.random()*30)+'vh';
      f.style.animationDelay=(i*0.2)+'s';
      layer.appendChild(f);
    }
    // 屏幕震动
    document.body.classList.add('fx-shake');
    setTimeout(()=>document.body.classList.remove('fx-shake'), 400);
  } else if(level==='light'){
    // 日常打卡：轻量效果，随机一种（不固定）
    const lightEffects=['bubble','heart','star','snow'];
    const chosen=lightEffects[Math.floor(Math.random()*lightEffects.length)];
    spawnParticles(layer, chosen, 20);
  } else {
    // 默认：彩纸雨
    spawnParticles(layer, 'confetti', 48);
    for(let i=0;i<4;i++){
      const f=document.createElement('span');
      f.className='firework';
      f.style.left=(20+Math.random()*60)+'vw';
      f.style.top=(25+Math.random()*30)+'vh';
      f.style.animationDelay=(i*0.18)+'s';
      layer.appendChild(f);
    }
  }

  // 中央文案
  const txt=document.createElement('div');
  txt.className='fx-text'; txt.textContent=reason;
  layer.appendChild(txt);
  setTimeout(()=>{ layer.classList.remove('fx-show'); layer.innerHTML=''; }, 3000);
}

/* ---------- 统一成就解锁入口（整合：改名继承 + 属性点 + 动画触发） ---------- */
// 每次主线/支线/碎片打卡，传入任务名 + 所属类型
function onTaskProgress(taskName, kind){
  const wasNew = !(DB.achievementBook||(DB.achievementBook={}))[taskName];
  const achvName = recordAchievement(taskName);   // 内部已处理阶级升级
  const data = (DB.achievementBook||{})[taskName]||{count:0,tier:0};
  const prevTier = data.tier - (achvName&&wasNew?0:0);  // 近似：由下方精确判断
  const newTier = data.tier;
  // 精确判断是否升阶或首次解锁
  const justPromoted = (newTier > 1 && data.count && getTierByCount(data.count-1) < newTier);
  const justFirst = (newTier===1 && data.count===1);
  // 属性点（打卡1次）—— 始终累计（关系到游戏金，不受开关影响）
  const attrUnlocked = awardAttrs(taskName, 1);
  // 连续打卡≥5天
  const streak = checkStreak(taskName);
  // —— 徽章点亮规则开关：关闭时，不打亮徽章、不播动画，点数/金钱照常累计 ——
  let reason=null;
  let fxLevel='normal';
  if(DB.badgeAutoLight!==false){
    if(justFirst){ reason='🏅 新成就解锁！'; fxLevel='major'; }
    if(justPromoted){ reason='🌟 成就升阶！'; fxLevel='major'; }
    if(attrUnlocked.length){ reason=(reason?reason+' · ':'')+'🎊 属性徽章点亮'; if(!justFirst&&!justPromoted) fxLevel='normal'; }
    if(streak>=5 && streak%5===0){ reason=(reason?reason+' · ':'')+`🔥 ${streak}天连击！`; fxLevel='major'; }
    // 日常打卡（无任何特殊事件）→ 轻量随机效果，无文案
    if(!reason){
      celebrate('', 'light');
      return achvName;
    }
    if(reason) celebrate(reason, fxLevel);
  }
  return achvName;
}

function migrateDB(r){
  const def=defaultDB();
  for(const k of Object.keys(def)){if(r[k]===undefined) r[k]=def[k]}
  r.attrPoints=r.attrPoints||{health:0,beauty:0,wisdom:0,will:0,charm:0};
  if(!r.playerName) r.playerName='XXX';
  if(r.successfulCycles===undefined) r.successfulCycles=0;
  if(!Array.isArray(r.mainQuests)) r.mainQuests=def.mainQuests;
  if(!r.giftPool||typeof r.giftPool!=='object') r.giftPool={low:def.giftPool.low,mid:def.giftPool.mid,high:def.giftPool.high};
  if(!r.giftPool.tiers) r.giftPool.tiers={low:def.giftPool.low,mid:def.giftPool.mid,high:def.giftPool.high};
  if(!r.weightReward){
    r.weightReward={t1:{loss:1,gift:'10元以下礼品（如发圈/贴纸）'},t2:{loss:3,gift:'20元以下礼品（如护手霜/书签）'},t3:{loss:5,gift:'20元以下礼品 + ¥10 游戏金'}};
  }
  if(!Array.isArray(r.healthHistory)) r.healthHistory=[];
  if(!Array.isArray(r.sportRecords)) r.sportRecords=[];   // 运动记录（永久累计，不随周期清除）
  if(r.bodyWeight===undefined) r.bodyWeight=50;           // 当前体重（卡路里按它算）
  if(!r.healthCycle||typeof r.healthCycle!=='object') r.healthCycle={active:false,startDate:null,length:10,dayInCycle:0};
  if(!Array.isArray(r.cycleArchive)) r.cycleArchive=[];   // 赛季归档数组
  if(!r.achievementBook||typeof r.achievementBook!=='object') r.achievementBook={};
  if(r.badgeAutoLight===undefined) r.badgeAutoLight=true;   // 徽章点亮规则开关（默认开启）
  // —— 主题色系统：旧存档若用「莫兰迪灰」默认值 → 升级为默认预设 aurora（观感完全不变）——
  if(!r.theme||typeof r.theme!=='object') r.theme=def.theme;
  if(!r.theme.preset){
    const legacy=(r.theme.color1==='#c9d6df'&&r.theme.color2==='#e4e9ee');
    if(legacy){r.theme.preset='aurora';r.theme.color1='#b9a7e0';r.theme.color2='#e6a6cd';}
    else{r.theme.preset=(r.theme.color1&&r.theme.color1!=='#b9a7e0')?'custom':'aurora';}
  }
  if(!r.theme.color1) r.theme.color1='#b9a7e0';
  if(!r.theme.color2) r.theme.color2='#e6a6cd';
  // —— 习惯记录：旧版用 value(字符串) 存单条，迁移为 logs(数组) 支持多条记录 ——
  if(!Array.isArray(r.extraFields)) r.extraFields=def.extraFields;
  r.extraFields.forEach(function(f){
    if(typeof f.value==='string' && !Array.isArray(f.logs)){f.logs=f.value.trim()?[{time:'',text:f.value,feel:''}]:[]}
    if(!Array.isArray(f.logs)) f.logs=[];
    delete f.value;
    if(!f.key) f.key='ex'+(Date.now()+Math.random());
  });
  r.version=DB_VERSION;   // 当前 schema = 10（新增 badgeAutoLight + 赛季徽章归零）
  // —— 属性点 → 金钱：初始化"已结算基准"，再补齐差额 ——
  if(r._lastAttrTotal===undefined||r._lastAttrTotal===0){
    // 老数据/首次：把当前已有属性点视为"已结算"，避免刷新后重复加钱
    const tot=Object.values(r.attrPoints||{}).reduce((s,v)=>s+(v||0),0);
    r._lastAttrTotal=tot;
  }
  // 生存工资：已发到哪个日期（首次初始化为昨天，今天由 dailyTick 发）
  if(!r._survivalUpTo){ const d=new Date(todayStr()); d.setDate(d.getDate()-1); r._survivalUpTo=dateKey(d); }
  if(r._survivalTotal===undefined) r._survivalTotal=0;   // ⑤ 生存工资累计
  if(r._recordBonus===undefined)  r._recordBonus=0;        // ④ 每日记录奖励累计
  if(r._cycleReward===undefined)  r._cycleReward=0;       // ① 主线周期奖励累计
  if(r._limitedReward===undefined) r._limitedReward=0;     // ② 限时计划奖励累计
  return r;
};

function addFragLog(i,time,text,feel){
  const f=DB.extraFields[i];if(!f)return;
  const t=(time&&time.trim())||nowHM();
  const txt=(text||'').trim();if(!txt)return;   // 内容为空不记录
  // 记录完整时间戳：YYYY-MM-DD HH:MM（前端展示用 fullTime，_date 供分组）
  const now=new Date();
  const fullTime=todayStr()+' '+t;
  const log={time:t,fullTime:fullTime,text:txt,feel:(feel||'').trim(),_date:todayStr()};
  f.logs=(f.logs||[]);f.logs.push(log);
  // 同时写一份到今日 records.extra[f.key]，兼容周期看板的矩阵统计
  const rec=today();rec.extra=rec.extra||{};rec.extra[f.key]=f.logs.filter(l=>l._date===todayStr());
  tryEarnToday();

  if(typeof onTaskProgress==='function'){try{onTaskProgress(f.name,'frag');}catch(e){}}

// 删除单条记录（含二次确认 + 封存检查）
function delFragLog(i,logIdx){
  const f=DB.extraFields[i];if(!f)return;
  f.logs=(f.logs||[]);
  const removed=f.logs[logIdx];
  // 封存检查：非当天的记录不可删除
  if(removed && isLogSealed(removed)){
    alert('🔒 这条记录已封存（跨天后不可删除），它是你真实的历史。');
    return;
  }
  // 二次确认
  const preview=(removed&&removed.text||'').slice(0,30);
  if(!confirm('🗑️ 确定删除这条记录？\n\n「'+preview+(preview.length>=30?'…':'')+'」\n\n此操作不可撤销。'))return;
  f.logs.splice(logIdx,1);
  // 同步今日 records.extra
  const rec=today();rec.extra=rec.extra||{};
  rec.extra[f.key]=(rec.extra[f.key]&&Array.isArray(rec.extra[f.key]))?rec.extra[f.key].filter(l=>l!==removed):(f.logs.filter(l=>l._date===todayStr()));
  save();render();
}

/* ④ 每日记录奖励 ¥1：遍历真实日期补发，有记录才给、防重复 */
function processDailyMoney(){
  const start=new Date(DB.startDate), end=new Date(todayStr());
  for(let d=new Date(start);d<=end;d.setDate(d.getDate()+1)){
    const key=dateKey(d);
    if(key===todayStr()) break;
    const rec=DB.records[key];
    if(rec && !rec.moneyEarned && hasAnyRecord(rec)){rec.moneyEarned=1;DB.savings+=1;DB._recordBonus=(DB._recordBonus||0)+1}
  }
  save();
}

/* ⑤ 生存工资 ¥0.5/天 —— 过零点自动发，奖励自己又活了一天，用来买东西
   按真实日期逐个补发：断更不漏、重复不多（_survivalUpTo 记录已发到哪天） */
function processSurvivalWage(){
  const start=new Date(DB.startDate), end=new Date(todayStr());
  for(let d=new Date(start);d<=end;d.setDate(d.getDate()+1)){
    const key=dateKey(d);
    if(key===todayStr()) break;            // 今天留到"下一次打开/过零点"再发，只发过去的完整一天
    if(key<=DB._survivalUpTo) continue;    // 已发过的绝不再发
    DB.savings=Number((DB.savings+0.5).toFixed(2));
    DB._survivalTotal=(DB._survivalTotal||0)+0.5;
    DB._survivalUpTo=key;
  }
  save();
}
// 每次打开页面时调用：补发所有该发未发的钱
function dailyTick(){ processSurvivalWage(); processDailyMoney(); }
function hasAnyRecord(rec){
  if(!rec) return false;
  if((rec.timeline||[]).length>0) return true;
  if(Object.keys(rec.mainMarks||{}).length>0) return true;
  if(Object.keys(rec.side||{}).length>0) return true;
  return false;
}
function tryEarnToday(){
  const t=today();
  if(!t.moneyEarned && hasAnyRecord(t)){t.moneyEarned=1;DB.savings+=1;DB._recordBonus=(DB._recordBonus||0)+1;save();refreshStats()}
}

/* —— 金句 8 小时轮换 ——
   一天分 3 个时段（0-8 点 / 8-16 点 / 16-24 点），每跨一个时段换一句。
   时段序号 = 天序 × 3 + 时段号，取模后再乘互质步长 7（与 100 条总数互质），
   保证「同一天三个时段不同句、相邻天的同一时段也不撞句」。 */
function quoteSlot(){
  const dayIx=Math.max(0,(bornDays()||1)-1);
  const slot=Math.floor(new Date().getHours()/8);   // 0 / 1 / 2
  return dayIx*3+slot;
}
function dailyQuote(slotNo){return DAILY_QUOTES[((slotNo||0)*7)%DAILY_QUOTES.length]}
// 页面长时间开着时，跨时段自动换句（每 60 秒检查一次）
let _quoteTimer=null;
function startQuoteTicker(){
  if(_quoteTimer)clearInterval(_quoteTimer);
  let last=quoteSlot();
  _quoteTimer=setInterval(()=>{
    const el=$('#homeQuote');
    if(!el){clearInterval(_quoteTimer);_quoteTimer=null;return}
    if(quoteSlot()===last)return;
    last=quoteSlot();
    el.textContent=dailyQuote(last);
    el.classList.remove('q-fade');void el.offsetWidth;el.classList.add('q-fade');
  },60000);
}

// —— 为一条主线匹配主题 key ——
function matchPathTheme(questName){
  const name = (questName||'').toLowerCase();
  for(const [theme, keywords] of Object.entries(PATH_KEYWORDS)){
    for(const kw of keywords){
      if(name.includes(kw.toLowerCase())) return theme;
    }
  }
  return 'default';
}

// —— 随机选一条序列（点亮瞬间固定）——
function getQuestThemeSequence(questId, questName){
  const prog = DB.progression[questId] || (DB.progression[questId]={});
  if(prog._seq) return prog._seq;  // 已固定，直接返回
  const theme = matchPathTheme(questName);
  const options = PATH_THEMES[theme] || PATH_THEMES['default'];
  // 随机选一条（2-3个选择中随机）
  const seq = pick(options).slice(0, 7);
  prog._seq = seq;
  prog._theme = theme;
  return seq;
}

// —— 获取某阶应显示的 emoji（未解锁 = 🔒 隐藏）——
function getPathEmoji(questId, tierIndex, reached){
  if(reached) return getQuestThemeSequence(questId, '')[tierIndex] || '·';
  return '🔒';
}

function cycleDays(){
  const cyc=DB.cycle||{};
  if(!cyc.active||!cyc.startDate) return [];
  const start=new Date(cyc.startDate),len=cyc.length||10;
  const list=[];
  for(let i=0;i<len;i++){const d=new Date(start);d.setDate(start.getDate()+i);const key=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;list.push(key)}
  // 只返回已经"发生过的"天（含今天），未到来的不显示
  const today=todayStr();
  return list.filter(k=>k<=today);
}

// 健康人生归入生命能量标签
/* ---------- 成就生成引擎 ---------- */
function getTaskLabelGroup(taskName){
  // 根据任务名找到所属标签和key（先归一化为规范名，消除同义重复）
  taskName=canonTask(taskName);
  for(const gk of Object.keys(ACHIEVEMENT_GROUPS)){
    const g=ACHIEVEMENT_GROUPS[gk];
    if(g.tasks.includes(taskName)){
      return {group:gk, key:taskName};
    }
  }
  // 默认归入成长印记
  return {group:'survival', key:taskName};
}

function genAchievementName(taskName, count){
  // count: 该任务已完成次数（>=1）
  const {group, key} = getTaskLabelGroup(taskName);
  const taskData = ACHIEVEMENT_WORDS[group] && ACHIEVEMENT_WORDS[group][key];
  if(!taskData){
    // 未预设词库的任务，用通用规则
    return genGenericAchievement(taskName, count);
  }
  // 计算当前阶级 (1-7)
  const tier = Math.min(7, Math.max(1, Math.ceil(count / 10) * 0 + getTierByCount(count)));
  // 从词库中随机选一个
  const names = taskData[tier] || taskData[7];
  return pick(names);
}

function getTierByCount(count){
  // 阶级阈值：1-10次=阶级1, 11-20=2, ... 每10次升一阶
  // 但用更细的密度：1,2,3,5,10,20,30,50,80,100...
  const th=[1,2,3,5,10,20,30];
  for(let i=th.length-1;i>=0;i--){
    if(count>=th[i]) return i+1;
  }
  return 1;
}

function genGenericAchievement(taskName, count){
  const tier = getTierByCount(count);
  const generic = {
    1:['初次接触','初体验','第一回'],
    2:['渐入佳境','再次挑战','又进一步'],
    3:['小有所成','渐入佳境','略有心得'],
    4:['熟练上手','得心应手','渐入佳境'],
    5:['行家里手','游刃有余','小有所成'],
    6:['炉火纯青','登堂入室','行家里手'],
    7:['登峰造极','出神入化','一代宗师']
  };
  const names = generic[tier] || generic[7];
  return `${taskName}·${pick(names)}`;
}

/* ---------- 成就解锁/记录 ---------- */
function recordAchievement(taskName){
  // 在时间线记录时调用，自动生成成就名并解锁阶级
  const book = DB.achievementBook;
  const {group, key} = getTaskLabelGroup(taskName);
  if(!book[key]) book[key]={count:0, tier:0};
  book[key].count++;
  const newTier = getTierByCount(book[key].count);
  let achvName = null;
  if(newTier > book[key].tier){
    book[key].tier = newTier;
    achvName = genAchievementName(key, book[key].count);
  } else {
    // 同阶级内换名称
    achvName = genAchievementName(key, book[key].count);
  }
  return achvName;
}

function healthDays(){
  const hc=DB.healthCycle||{};
  if(!hc.active||!hc.startDate) return [];
  const start=new Date(hc.startDate), len=hc.length||10;
  const list=[];
  for(let i=0;i<len;i++){const d=new Date(start);d.setDate(start.getDate()+i);const key=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;list.push(key)}
  return list.filter(k=>k<=todayStr());
}

function ensureHealthFields(rec){
  rec.extra=rec.extra||{};
  if(typeof rec.extra!=='object'||Array.isArray(rec.extra)) rec.extra={};
  return rec.extra;
}
function healthSeries(){
  const out=[];

/* 原始精度换算（不四舍五入，交由 hachvDeposit 累积到“分”） */
function hachvExpToMoneyRaw(exp,tier){
  return (Number(exp)||0)/50*hachvPer50(tier);
}

/* ————— 金额入账：不足 1 分先攒着，凑够再并入余额（防止小额被四舍五入吃掉）————— */
function hachvDeposit(amount){
  amount=Number(amount)||0;
  if(amount<=0) return 0;
  var HA=hachvEnsure();
  HA.penny=(HA.penny||0)+amount;          // 完整精度累积
  var take=Math.floor(HA.penny*100)/100;  // 取出整数分
  if(take>0){
    HA.penny=Math.round((HA.penny-take)*10000)/10000;
    HA.money=Math.round(((HA.money||0)+take)*100)/100;
    HA.healthMoney=Math.round(((HA.healthMoney||0)+take)*100)/100;
    if(typeof DB.savings==='number') DB.savings=Math.round((DB.savings+take)*100)/100;
    else DB.savings=take;
    return take;
  }
  return 0;
}

/* ————— 仪式数据结构 ————— */
function ritualEnsure(){
  var HA=hachvEnsure();
  if(!HA.ritual) HA.ritual={};
  RITUALS.forEach(function(r){
    if(!HA.ritual[r.v]) HA.ritual[r.v]={n:0,streak:0,last:''};
    if(HA.ritual[r.v].n==null) HA.ritual[r.v].n=0;
    if(HA.ritual[r.v].streak==null) HA.ritual[r.v].streak=0;
  });
  return HA.ritual;
}
/* 今天已完成的仪式（逗号分隔串） */
function ritualsToday(){
  var r=DB.records&&DB.records[todayStr()];
  var ex=(r&&r.extra&&!Array.isArray(r.extra))?r.extra:{};
  return String(ex.rituals||'').split(',').filter(Boolean);
}
/* 切换某个仪式（返回 true=新增，false=取消） */
function toggleRitual(v){
  var list=ritualsToday();
  var R=ritualEnsure();
  var idx=list.indexOf(v);
  var added=false;
  if(idx>=0){ list.splice(idx,1); }
  else{ list.push(v); added=true; }

  /* 写入当天的 extra */
  var day=todayStr();
  if(!DB.records[day]) DB.records[day]=ensureHealthFields({});
  if(!DB.records[day].extra||Array.isArray(DB.records[day].extra)) DB.records[day].extra={};
  DB.records[day].extra.rituals=list.join(',');

  /* 累计计数（幂等：以当天是否已含为准，不做减法回退，避免误触扣减） */
  if(added){
    var rec=R[v]||(R[v]={n:0,streak:0,last:''});
    rec.n=(rec.n||0)+1;
    var y=hachvPrevDay(todayStr());
    rec.streak=(rec.last===y)?((rec.streak||0)+1):1;
    rec.last=todayStr();
    /* EXP 直接入账；金额不足 1 分时先攒着，避免被四舍五入吃掉 */
    var HA=hachvEnsure();
    HA.exp=(HA.exp||0)+RITUAL_EXP;
    hachvDeposit(hachvExpToMoneyRaw(RITUAL_EXP,hachvTier(Object.keys(HA.unlocked||{}).length)));
  }
  save();
  return added;
}

/* ————— 仪式汇总指标（供成就判定） ————— */
function ritualMetrics(){
  var R=ritualEnsure();
  var M={};
  var anyN=0, maxN=0, maxStreak=0, sumN=0;
  RITUALS.forEach(function(r){
    var rec=R[r.v]||{n:0,streak:0};
    var n=rec.n||0, st=rec.streak||0;
    M['r_'+r.v]=n;            /* 单仪式累计次数 */
    M['rs_'+r.v]=st;          /* 单仪式连续天数 */
    sumN+=n;
    if(n>maxN) maxN=n;
    if(st>maxStreak) maxStreak=st;
    if(n>0) anyN++;
  });
  M.ritualSum=sumN;           /* 全部仪式累计总次数 */
  M.ritualMax=maxN;           /* 做得最多的那项次数 */
  M.ritualStreak=maxStreak;   /* 最长连续天数 */
  M.ritualKinds=anyN;         /* 尝试过几种仪式 */
  M.ritualToday=ritualsToday().length;  /* 今天完成几项 */
  return M;
}

/* ————— 周期键 ————— */
function weekKeyOf(dstr){
  var p=(dstr||todayStr()).split('-');
  var d=new Date(+p[0],+p[1]-1,+p[2]);
  var day=(d.getDay()+6)%7;           // 周一=0
  d.setDate(d.getDate()-day);
  return hachvDateKey(d);             // 用周一日期作为周键
}
function monthKeyOf(dstr){ return String(dstr||todayStr()).slice(0,7); }

/* ————— 统计辅助（周 / 月窗口） ————— */

  var arr=[],k=todayStr();
  for(var i=0;i<n;i++){ arr.push(k); k=hachvPrevDay(k); }
  return arr;
}
function dayExtra(d){

      c+=parseFloat(r.cal)||(parseFloat(r.km)||0)*(DB.bodyWeight||50)*1.036; }}); });

/* ————— 每日任务完成判定 ————— */
function dailyQuestDone(q){
  var ex=dayExtra(todayStr());
  switch(q.field){
    case 'sleep': {
      if(q.id==='D1'){ var b=hachvHM(ex.bedTime); return b!=null&&b<=23*60; }
      if(q.id==='D2'){ var w=hachvHM(ex.wakeTime); return w!=null&&w>0; }
      return false;
    }
    case 'ritual': return ritualsToday().indexOf(q.rv)>=0;
    case 'sport': {
      var m=0; (DB.sportRecords||[]).forEach(function(r){
        if(r.date===todayStr()) m+=(parseFloat(r.durationMin)||hachvMins(r.start,r.end)||0); });
      return m>=20;
    }
    case 'food':   return String(ex.food||'').trim().length>0;
    case 'weight': return (parseFloat(ex.weight!=null?ex.weight:ex.w)||0)>0;
    case 'water':  return (parseFloat(ex.water)||0)>=8;
    case 'km3': {
      var km=0; (DB.sportRecords||[]).forEach(function(r){
        if(r.date===todayStr()) km+=parseFloat(r.km)||0; });
      return km>=3;
    }
  }
  return false;
}

/* ————— 任务引擎：抽题 / 判定 / 发奖（幂等） ————— */
function hqEnsure(){
  var HA=hachvEnsure();
  if(!HA.quest) HA.quest={daily:null,weekly:{},monthly:{},exp:0};
  if(!HA.quest.weekly) HA.quest.weekly={};
  if(!HA.quest.monthly) HA.quest.monthly={};
  if(HA.quest.exp==null) HA.quest.exp=0;
  return HA.quest;
}
function hqPick(arr,n){                 // 稳定抽题（同一天结果固定）
  var pool=arr.slice();
  var seed=0, t=todayStr();
  for(var i=0;i<t.length;i++) seed=(seed*31+t.charCodeAt(i))>>>0;
  var out=[];
  for(var j=0;j<n&&pool.length;j++){
    seed=(seed*1103515245+12345)>>>0;
    out.push(pool.splice(seed%pool.length,1)[0]);
  }
  return out;
}
function hqDaily(){                     // 返回今日任务（自动抽题 + 自动判定）
  var Q=hqEnsure();
  var tk=todayStr();
  if(!Q.daily||Q.daily.date!==tk){
    Q.daily={date:tk, req:hqPick(DAILY_REQ,3).map(function(q){return q.id}),
             opt:hqPick(DAILY_OPT,2).map(function(q){return q.id}), bonus:''};
    save();
  }
  var req=Q.daily.req.map(function(id){return DAILY_REQ.filter(function(q){return q.id===id})[0]}).filter(Boolean);
  var opt=Q.daily.opt.map(function(id){return DAILY_OPT.filter(function(q){return q.id===id})[0]}).filter(Boolean);
  var reqDone=req.filter(dailyQuestDone), optDone=opt.filter(dailyQuestDone);
  return {req:req,opt:opt,reqDone:reqDone.length,optDone:optDone.length,
          checked:reqDone.length>=2, perfect:(reqDone.length===req.length&&optDone.length===opt.length)};
}
/* 结算每日任务奖励（幂等：bonus 标记已发） */
function hqSettle(){
  var HA=hachvEnsure(), Q=hqEnsure(), D=hqDaily();
  var gain=0;
  gain+=D.reqDone*10 + D.optDone*5;
  if(D.checked) gain+=10;
  if(D.perfect) gain+=20;
  var tier=hachvTier(Object.keys(HA.unlocked||{}).length);
  var money=hachvExpToMoney(gain,tier);
  /* 幂等：只在数值变化时补发差额 */
  var prev=Q.daily.gain||0;
  var delta=gain-prev;
  if(delta>0){
    HA.exp=(HA.exp||0)+delta;
    hachvDeposit(hachvExpToMoneyRaw(delta,tier));
    Q.exp=(Q.exp||0)+delta;
    Q.daily.gain=gain;
    save();
  }
  return {gain:gain,checked:D.checked,perfect:D.perfect};
}
/* 周常 / 月常（自动判定，达成即发奖，幂等） */
function hqWeekly(){
  var Q=hqEnsure(), wk=weekKeyOf();
  if(Q.weekly.wk!==wk){ Q.weekly={wk:wk,done:{}}; save(); }
  return WEEKLY_Q.map(function(q){
    var v=Number(q.cond())||0, done=!!Q.weekly.done[q.id];
    return {id:q.id,n:q.n,ico:q.ico,exp:q.exp,v:v,k:q.k,done:done,ready:v>=q.k};
  });
}
function hqMonthly(){
  var Q=hqEnsure(), mk=monthKeyOf();
  if(Q.monthly.mk!==mk){ Q.monthly={mk:mk,done:{}}; save(); }
  return MONTHLY_Q.map(function(q){
    var v=Number(q.cond())||0, done=!!Q.monthly.done[q.id];
    return {id:q.id,n:q.n,ico:q.ico,exp:q.exp,v:v,k:q.k,done:done,ready:v>=q.k};
  });
}
function hqSettlePeriod(){
  var HA=hachvEnsure(), Q=hqEnsure(), fresh=[];
  var tier=hachvTier(Object.keys(HA.unlocked||{}).length);
  hqWeekly().forEach(function(q){
    if(q.ready&&!Q.weekly.done[q.id]){ Q.weekly.done[q.id]=todayStr(); fresh.push(q); }
  });
  hqMonthly().forEach(function(q){
    if(q.ready&&!Q.monthly.done[q.id]){ Q.monthly.done[q.id]=todayStr(); fresh.push(q); }
  });
  if(fresh.length){
    var gain=0; fresh.forEach(function(q){gain+=q.exp});
    HA.exp=(HA.exp||0)+gain;
    hachvDeposit(hachvExpToMoneyRaw(gain,tier));
    Q.exp=(Q.exp||0)+gain;
    save();
  }
  return fresh;
}

/* ============================================================================
   解锁动画 + 阶级变化提示
   ============================================================================ */
function hachvPop(list){
  if(!list||!list.length) return;
  var wrap=document.createElement('div');
  wrap.className='hachv-pop-wrap';
  /* 跨域隐藏成就最稀有 → 排到最前面，避免被截断而看不到 */
  var ordered=list.slice().sort(function(x,y){ return (y.cross?1:0)-(x.cross?1:0); });
  wrap.innerHTML=ordered.slice(0,6).map(function(a,i){
    /* 跨域隐藏成就：三域图标剪影环绕，解锁瞬间才揭晓 */
    var crossRing=a.cross?
      '<div class="hachv-pop-cross"><span>🏅</span><span>🛤️</span><span>🌙</span></div>':'';
    return '<div class="hachv-pop'+(a.cross?' cross':'')+'" style="animation-delay:'+(i*0.12)+'s">'+
      crossRing+

/* 局部刷新任务面板（打卡后调用） */
function hqRefreshPanel(){
  var old=$('#hqPanel');
  if(!old) return;
  /* 保留展开状态，避免打卡后面板突然收起 */
  var wasOpen=false;
  try{ wasOpen=!!old.hasAttribute('open'); }catch(e){ wasOpen=false; }
  /* 记录子折叠（本周 / 本月）的展开状态 */
  var subOpen={};
  try{
    var subs=old.querySelectorAll('.hq-sub');
    for(var i=0;i<subs.length;i++){ subOpen[subs[i].getAttribute('data-k')]=!!subs[i].hasAttribute('open'); }
  }catch(e){ subOpen={}; }
  var tmp=document.createElement('div');
  tmp.innerHTML=hqPanelHtml();
  var neu=tmp.firstChild;
  if(neu&&old.parentNode){
    if(wasOpen){ try{ neu.setAttribute('open',''); }catch(e){} }
    try{
      var nsubs=neu.querySelectorAll?neu.querySelectorAll('.hq-sub'):[];
      for(var j=0;j<nsubs.length;j++){
        var kk=nsubs[j].getAttribute('data-k');
        if(subOpen[kk]) nsubs[j].setAttribute('open','');
      }
    }catch(e){}
    old.parentNode.replaceChild(neu,old);
  }
}


/* ============================================================================
   健康成就系统 · 数据驱动引擎
   ────────────────────────────────────────────────────────────────────────────
   设计原则：
   ① 统计独立  ：健康数据与主线/支线完全分离，只落在 DB.healthAchv 下
   ② 金钱并表  ：EXP 折算的金额计入 DB.savings（整个金钱系统），不另起炉灶
   ③ 配置驱动  ：成就写在 HEALTH_ACHV 表里，渲染与检测通用，不硬编码
   ④ 自动判定  ：所有成就由系统从原始记录算出，无需用户手动勾选
   ⑤ 正向引导  ：文案只鼓励、不贬损
   ============================================================================ */

/* ————— 工具 ————— */
function hachvHM(s){
  if(!s) return null;
  var m=String(s).match(/(\d{1,2})\s*[:：]\s*(\d{1,2})/);
  if(!m) return null;
  return parseInt(m[1],10)*60+parseInt(m[2],10);
}
function hachvMins(start,end){
  var a=hachvHM(start),b=hachvHM(end);
  if(a==null||b==null) return 0;
  var d=b-a; if(d<0) d+=1440;          // 跨夜
  return d>0?d:0;
}
function hachvDateKey(d){
  var y=d.getFullYear(),m=('0'+(d.getMonth()+1)).slice(-2),dd=('0'+d.getDate()).slice(-2);
  return y+'-'+m+'-'+dd;
}
function hachvPrevDay(k){
  var p=k.split('-'); var d=new Date(+p[0],+p[1]-1,+p[2]);
  d.setDate(d.getDate()-1); return hachvDateKey(d);
}
/* 从某天起往前数连续满足 has(day) 的天数 */
function hachvStreak(daySet, anchorKey){
  var d=new Date(), k=anchorKey||hachvDateKey(d);
  if(!daySet[k]){ k=hachvPrevDay(k); if(!daySet[k]) return 0; }
  var n=0;
  while(daySet[k]){ n++; k=hachvPrevDay(k); }
  return n;
}

/* ————— 1. 三域原始指标统计（全部由 DB 原始数据算出）————— */
function hachvStats(){
  var S={
    /* 运动域 */
    totalKm:0, totalKcal:0, totalMins:0, yogaMins:0,
    maxKcal:0, maxYoga:0, sportDays:0, sportStreak:0,
    /* 减重域 */
    lostJin:0, foodStreak:0, foodDays:0, weightDays:0,
    /* 睡眠域 */
    earlyDays:0, wakeStreak:0, goodDays:0, sleepDays:0
  };
  var recs=DB.records||{};
  var dayList=Object.keys(recs).sort();

  /* —— 运动 —— */
  var spDays={}, spKcalByDay={}, yogaByDay={};
  (DB.sportRecords||[]).forEach(function(r){
    var km=parseFloat(r.km)||0;
    var mins=(r.durationMin!=null?parseFloat(r.durationMin):
              (r.min!=null?parseFloat(r.min):hachvMins(r.start,r.end)))||0;
    var cal=r.cal!=null?parseFloat(r.cal):(km*(DB.bodyWeight||50)*1.036);
    S.totalKm+=km; S.totalMins+=mins; S.totalKcal+=cal;
    if(cal>S.maxKcal) S.maxKcal=cal;
    var isYoga=/瑜伽|拉伸|柔韧|塑形|yoga|stretch|pilates/i.test(String(r.type||''));
    if(isYoga){ S.yogaMins+=mins; yogaByDay[r.date]=(yogaByDay[r.date]||0)+mins;
      if(mins>S.maxYoga) S.maxYoga=mins; }
    spDays[r.date]=1;
    spKcalByDay[r.date]=(spKcalByDay[r.date]||0)+cal;
  });
  S.sportDays=Object.keys(spDays).length;
  S.sportStreak=hachvStreak(spDays);
  S.totalKm=Math.round(S.totalKm*100)/100;
  S.totalKcal=Math.round(S.totalKcal);
  S.totalMins=Math.round(S.totalMins);
  S.yogaMins=Math.round(S.yogaMins);
  S.maxKcal=Math.round(S.maxKcal);

  /* —— 减重 —— */
  var weights=[];
  dayList.forEach(function(d){
    var ex=(recs[d]&&recs[d].extra&&!Array.isArray(recs[d].extra))?recs[d].extra:{};
    var w=parseFloat(ex.weight!=null?ex.weight:ex.w);
    if(!isNaN(w)&&w>0) weights.push(w);
  });
  if(weights.length){
    var first=weights[0], peak=first;
    weights.forEach(function(w){ if(first-w>peak-first+ (first-peak)) {} });
    /* 最大历史跌幅（斤） */
    var maxDrop=0, top=first;
    weights.forEach(function(w){ if(w>top) top=w; var drop=(top-w)*2; if(drop>maxDrop) maxDrop=drop; });
    S.lostJin=Math.round(maxDrop*10)/10;
  }
  var foodSet={}, wSet={};
  dayList.forEach(function(d){
    var ex=(recs[d]&&recs[d].extra&&!Array.isArray(recs[d].extra))?recs[d].extra:{};
    if(String(ex.food||'').trim()){ foodSet[d]=1; S.foodDays++; }
    var w=parseFloat(ex.weight!=null?ex.weight:ex.w);
    if(!isNaN(w)&&w>0){ wSet[d]=1; S.weightDays++; }
  });
  S.foodStreak=hachvStreak(foodSet);

  /* —— 睡眠 —— */
  var wakeSet={};
  dayList.forEach(function(d){
    var ex=(recs[d]&&recs[d].extra&&!Array.isArray(recs[d].extra))?recs[d].extra:{};
    var h=parseFloat(ex.sleep)||0, bed=ex.bedTime||'', wake=ex.wakeTime||'';
    if(h>0){ S.sleepDays++; if(h>=7) S.goodDays++; }
    var bh=hachvHM(bed);
    if(bh!=null&&bh<=23*60) S.earlyDays++;      // 23:00 前入睡
    var wh=hachvHM(wake);
    if(wh!=null&&wh<=7*60) wakeSet[d]=1;        // 7:00 前起床
  });
  S.wakeStreak=hachvStreak(wakeSet);

  /* —— 睡前仪式（手动 chip，累计次数 ≥5 才设成就） —— */
  var RM=ritualMetrics();
  Object.keys(RM).forEach(function(k){ S[k]=RM[k]; });
  return S;
}

/* ————— 2. EXP / 阶级引擎 —————
   基础：50 EXP = 0.05 元（1 阶）
   晋升：每升一阶，每 50 EXP 增加 0.05 元
   封顶：min(0.05 × 阶级, 2) 元 / 50 EXP
   下限：阶级不低于 1 阶                              */
var HACHV_RATE=0.05, HACHV_STEP=0.05, HACHV_CAP=2.0;
function hachvTier(unlockedCount){
  return Math.max(1, 1+Math.floor((unlockedCount||0)/5));
}
function hachvPer50(tier){
  return Math.min(HACHV_RATE*Math.max(1,tier||1), HACHV_CAP);
}
function hachvExpToMoney(exp,tier){
  return Math.round((exp/50)*hachvPer50(tier)*100)/100;
}

/* ————— 4. 检测与发放（幂等：每个成就只发一次 EXP）————— */
function hachvEnsure(){
  if(!DB.healthAchv) DB.healthAchv={unlocked:{},exp:0,money:0,log:[]};
  if(!DB.healthAchv.unlocked) DB.healthAchv.unlocked={};
  if(DB.healthAchv.exp==null) DB.healthAchv.exp=0;
  if(DB.healthAchv.money==null) DB.healthAchv.money=0;
  if(!DB.healthAchv.log) DB.healthAchv.log=[];
  return DB.healthAchv;
}
/* 返回本次新解锁的成就列表 */
function hachvCheck(){
  var HA=hachvEnsure();
  var S=hachvStats();
  var fresh=[];
  HEALTH_ACHV.forEach(function(a){
    if(HA.unlocked[a.id]) return;
    var v=Number(S[a.m])||0;
    if(v>=a.k){ HA.unlocked[a.id]=todayStr(); fresh.push(a); }
  });
  /* 跨领域：三域各点亮 N 枚 */
  function countBy(d){
    return HEALTH_ACHV.filter(function(a){return a.d===d&&HA.unlocked[a.id]}).length;
  }
  var cs=[countBy('sport'),countBy('weight'),countBy('sleep')];
  HEALTH_CROSS.forEach(function(c){
    if(HA.unlocked[c.id]) return;
    var ok = c.k>=99 ? (cs[0]>=HEALTH_ACHV.filter(function(a){return a.d==='sport'}).length &&
                        cs[1]>=HEALTH_ACHV.filter(function(a){return a.d==='weight'}).length &&
                        cs[2]>=HEALTH_ACHV.filter(function(a){return a.d==='sleep'}).length)
                     : (cs[0]>=c.k&&cs[1]>=c.k&&cs[2]>=c.k);
    if(ok){ HA.unlocked[c.id]=todayStr(); fresh.push(c); }
  });
  /* 发放 EXP 与金钱（并入存钱计划） */
  if(fresh.length){
    var tier=hachvTier(Object.keys(HA.unlocked).length-fresh.length);
    var gainExp=0;
    fresh.forEach(function(a){ gainExp+=a.exp; });
    var gainMoney=hachvExpToMoney(gainExp,tier);
    HA.exp=(HA.exp||0)+gainExp;
    HA.money=Math.round(((HA.money||0)+gainMoney)*100)/100;
    if(typeof DB.savings==='number') DB.savings=Math.round((DB.savings+gainMoney)*100)/100;
    else DB.savings=gainMoney;
    HA.healthMoney=(HA.healthMoney||0)+gainMoney;
    HA.healthMoney=Math.round(HA.healthMoney*100)/100;
    HA.log.push({date:todayStr(),ids:fresh.map(function(a){return a.id}),exp:gainExp,money:gainMoney});
    save();
  }
  return fresh;
}
/* 当前三域进度（供渲染与展示） */
function hachvProgress(){
  var HA=hachvEnsure();
  var S=hachvStats();
  var out={stats:S,tier:1,exp:HA.exp||0,money:HA.money||0,per50:0,byDomain:{},cross:[]};
  var unlockedN=Object.keys(HA.unlocked).length;
  out.tier=hachvTier(unlockedN);
  out.per50=hachvPer50(out.tier);
  ['sport','weight','sleep'].forEach(function(d){
    var list=HEALTH_ACHV.filter(function(a){return a.d===d});
    var got=list.filter(function(a){return HA.unlocked[a.id]}).length;
    out.byDomain[d]={total:list.length,got:got,list:list.map(function(a){
      var v=Number(S[a.m])||0;
      return {id:a.id,ico:a.ico,n:a.n,hint:a.hint,exp:a.exp,v:v,k:a.k,u:a.u,
              done:!!HA.unlocked[a.id],pct:Math.min(100,Math.round(v/a.k*100))};
    })};
  });
  out.cross=HEALTH_CROSS.map(function(c){
    return {id:c.id,ico:c.ico,n:c.n,hint:c.hint,exp:c.exp,done:!!HA.unlocked[c.id]};
  });
  return out;
}

/* ============================================================================
   🛡 健康板块渲染护栏（防白屏）
   ────────────────────────────────────────────────────────────────────────────
   背景：经过多轮迭代，存档里可能残留结构异常的数据，例如：
     · DB.sportRecords 里混入了 null / 非对象项
     · DB.healthCycle 变成了 null
     · DB.weightReward 缺 t1/t2/t3 子项
     · 某天的 extra.sleep 是字符串而不是数字
   renderHealth 一旦读到这些数据就会抛错；而 render() 在此之前已经执行过
   page.innerHTML='' —— 于是整个板块变成一片空白，且没有任何报错提示。
   这正是「电脑端有历史存档 → 空白 / 手机端数据干净 → 正常」的根因。

   方案：
     ① 渲染前先对健康相关数据做一次「消毒」（sanitizeHealthDB）
     ② 再用 try/catch 兜底（renderHealthSafe），万一仍出错，
        显示可读的错误卡片 + 一键修复按钮，而不是白屏
   ============================================================ */
function sanitizeHealthDB(){
  try{
    if(!DB||typeof DB!=='object') return;
    if(!DB.records||typeof DB.records!=='object'||Array.isArray(DB.records)) DB.records={};

    /* ① 运动记录：过滤 null / 非对象项，字段补默认值 */
    if(!Array.isArray(DB.sportRecords)) DB.sportRecords=[];
    DB.sportRecords=DB.sportRecords.filter(function(r){return r&&typeof r==='object';});
    DB.sportRecords.forEach(function(r){
      if(typeof r.date!=='string') r.date=todayStr();
      if(r.start==null) r.start='';
      if(r.end==null)   r.end='';
      if(r.type==null)  r.type='';
      r.durationMin=Number(r.durationMin)||0;
      r.steps=Number(r.steps)||0;
      r.km=Number(r.km)||0;
      r.cal=Number(r.cal)||0;
      if(typeof r.feel!=='string') r.feel='';
    });

    /* ② 健康周期 */
    if(!DB.healthCycle||typeof DB.healthCycle!=='object')
      DB.healthCycle={active:false,startDate:null,length:10,dayInCycle:0};
    if(typeof DB.healthCycle.active!=='boolean') DB.healthCycle.active=false;
    if(typeof DB.healthCycle.length!=='number'||!DB.healthCycle.length) DB.healthCycle.length=10;
    if(DB.healthCycle.dayInCycle==null) DB.healthCycle.dayInCycle=0;

    /* ③ 减重奖励三档 */
    var defWR={t1:{loss:1,gift:'10元以下礼品'},t2:{loss:3,gift:'20元以下礼品'},t3:{loss:5,gift:'20元以下礼品+¥10'}};
    if(!DB.weightReward||typeof DB.weightReward!=='object') DB.weightReward={};
    ['t1','t2','t3'].forEach(function(k){
      if(!DB.weightReward[k]||typeof DB.weightReward[k]!=='object') DB.weightReward[k]={};
      if(typeof DB.weightReward[k].loss!=='number') DB.weightReward[k].loss=defWR[k].loss;
      if(typeof DB.weightReward[k].gift!=='string')  DB.weightReward[k].gift=defWR[k].gift;
    });

    /* ④ 体重：必须是数字 */
    var bw=parseFloat(DB.bodyWeight);
    DB.bodyWeight=isNaN(bw)?50:bw;

    /* ⑤ 每天 extra 里的睡眠时长必须是数字，否则 .toFixed 会崩 */
    for(var d in DB.records){
      var rec=DB.records[d];
      if(!rec||typeof rec!=='object'){ delete DB.records[d]; continue; }
      if(!rec.extra||typeof rec.extra!=='object'||Array.isArray(rec.extra)) rec.extra={};
      var sv=rec.extra.sleep;
      if(sv!=null&&sv!==''){ var n=parseFloat(sv); rec.extra.sleep=isNaN(n)?0:n; }
      else if(sv===''){ rec.extra.sleep=0; }
    }

    /* ⑥ 其他健康字段兜底 */
    if(!Array.isArray(DB.healthHistory)) DB.healthHistory=[];
    if(!DB.healthAchv||typeof DB.healthAchv!=='object') DB.healthAchv={exp:0,unlocked:{},quest:null};
    if(!DB.healthAchv.unlocked||typeof DB.healthAchv.unlocked!=='object') DB.healthAchv.unlocked={};
    if(typeof DB.healthAchv.exp!=='number') DB.healthAchv.exp=Number(DB.healthAchv.exp)||0;
    if(!DB.ritual||typeof DB.ritual!=='object') DB.ritual={};
    if(!Array.isArray(DB.extraFields)) DB.extraFields=[];
  }catch(e){}
}

/* 安全渲染入口：出错时给可读提示 + 修复按钮，绝不留白屏 */
function renderHealthSafe(page){
  if(!page) return;
  try{ sanitizeHealthDB(); }catch(e){}
  try{
    renderHealth(page);
    return;
  }catch(err){
    var msg=(err&&err.message)?String(err.message):String(err);
    var st=(err&&err.stack)?String(err.stack).split('\n').slice(0,3).join('\n'):'';
    var esc=function(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');};
    try{
      page.innerHTML=
        '<div class="card" style="border-color:var(--warn)">'+
        '<h3>🌿 健康人生</h3>'+
        '<div class="page-desc">这个板块遇到了一点数据问题，已被自动保护起来，其他功能不受影响。</div>'+
        '<div style="background:rgb(var(--warn-rgb) / .08);border-radius:10px;padding:12px;'+
        'font-size:12px;color:var(--ink-soft);white-space:pre-wrap;word-break:break-all;'+
        'margin-bottom:12px;line-height:1.7"><b>原因：</b>'+esc(msg)+
        (st?'\n'+esc(st):'')+'</div>'+
        '<button class="btn" onclick="repairHealthData()">🛠 一键修复并重新加载</button> '+
        '<button class="btn" onclick="resetHealthData()" style="margin-left:8px">'+
        '🧹 只清空健康数据（其他保留）</button></div>';
    }catch(e2){
      page.innerHTML='<div class="card"><h3>🌿 健康人生</h3>'+
        '<div class="page-desc">数据异常，请点「一键修复」。</div>'+
        '<button class="btn" onclick="repairHealthData()">🛠 一键修复</button></div>';
    }
  }
}

  const spanDays=Object.keys(DB.records).sort().slice(-10);

       </div>`;

  /* ===== ② 排序：1.今日记录 → 2.睡眠记录 → 3.运动记录 ===== */
  const todaySleep=todayExtra.sleep||0;
  const todayBed=todayExtra.bedTime||'', todayWake=todayExtra.wakeTime||'';

  // 累计数据（用于"累计消耗"卡片 + 统计卡）
  const sportRecsAll=DB.sportRecords||[];

/* 轻量浮动提示（不打断操作，2 秒自动消失） */
function hgToast(msg){
  let el=document.getElementById('hgToast');
  if(!el){
    el=document.createElement('div');el.id='hgToast';
    document.body.appendChild(el);
  }
  el.textContent=msg;el.className='hg-toast show';
  clearTimeout(el._t);
  el._t=setTimeout(function(){el.className='hg-toast';},2000);
}

/* 体重换算：支持「172斤」「150磅」「52000g」「52.3」「52000」→ 统一 kg */
function parseWeightToKg(raw){
  raw=String(raw||'').trim(); if(!raw) return NaN;
  var m;
  if((m=raw.match(/^\s*([\d.]+)\s*斤\s*$/)))  return parseFloat(m[1])/2;
  if((m=raw.match(/^\s*([\d.]+)\s*磅\s*$/i))) return parseFloat(m[1])*0.453592;
  if((m=raw.match(/^\s*([\d.]+)\s*g\s*$/i)))  return parseFloat(m[1])/1000;
  var n=parseFloat(raw); if(isNaN(n)) return NaN;
  return n>500 ? n/1000 : n;
}

   😴 睡眠 · 🏃 运动 —— 自动画像引擎

   ══════════════════════════════════════════════════════════════ */
/* 睡眠标签：影响睡眠质量的可勾选因素（可多选） */
const SLEEP_TAGS=[
  {v:'dream',l:'💭 多梦'},{v:'wake',l:'🌙 夜醒'},
  {v:'alcohol',l:'🍷 饮酒'},{v:'caffeine',l:'☕ 咖啡因'},{v:'late_sport',l:'🏃 睡前运动'},
  {v:'screen',l:'📱 睡前刷屏'},{v:'light',l:'💡 开灯睡'},{v:'cold',l:'❄️ 房间偏冷'},
  {v:'hot',l:'🔥 房间偏热'},{v:'stress',l:'😰 压力焦虑'},{v:'newbed',l:'🛏️ 换了环境'}
];
/* 运动类型 → 三大类（ACSM 分类） */
const SPORT_CATEGORY={
  walking:'aerobic',running:'aerobic',cycling:'aerobic',swimming:'aerobic',
  badminton:'aerobic',rope:'aerobic',hiit:'aerobic',dance:'aerobic',
  strength:'strength',
  yoga:'flex',stretching:'flex',housework:'flex',other:'flex'
};
/* —— 睡眠作息分型：由入睡 / 起床时间自动判定 —— */
function judgeSleepType(bed,wake){
  if(!bed||!wake) return null;
  var bp=String(bed).split(':'), wp=String(wake).split(':');
  var bh=parseInt(bp[0],10), bm=parseInt(bp[1]||0,10), wh=parseInt(wp[0],10), wm=parseInt(wp[1]||0,10);
  if(isNaN(bh)||isNaN(wh)) return null;
  var bv=bh*60+(bm||0), wv=wh*60+(wm||0);
  var late=(bh>=18)?(bv-24*60):bv;           // 归一化：18 点后入睡记为负，凌晨入睡记为正
  if(late<=-120&&wv<=7*60)  return {ico:'🌅',name:'早睡早起型',desc:'22:00 前入睡、7:00 前起床，节奏很稳'};
  if(late<=-60 &&wv<=8*60)  return {ico:'🌗',name:'规律作息型',desc:'23:00 前入睡、8:00 前起床，标准作息'};
  if(late>=60)              return {ico:'🦉',name:'夜猫子型',desc:'凌晨 1 点后才睡，身体在熬夜加班'};
  if(late>-60 &&wv>9*60)    return {ico:'😴',name:'晚睡晚起型',desc:'睡够了但起得晚，白天容易没精神'};
  if(late>-60 &&wv>8*60)    return {ico:'🌙',name:'晚睡补觉型',desc:'睡得晚起得也晚，时长够、节奏偏后'};
  return {ico:'🎲',name:'自由作息型',desc:'时间还不太固定，身体正在找节奏'};
}
/* —— 运动画像：由历史记录自动判定「常练时段 + 运动类型」 —— */
function judgeSportProfile(){
  var recs=DB.sportRecords||[]; if(!recs.length) return null;
  var timeB={dawn:0,noon:0,dusk:0,night:0}, catB={aerobic:0,strength:0,flex:0}, mins=0, kcal=0;
  recs.forEach(function(r){
    var h=parseInt(String(r.start||'').split(':')[0],10);
    if(!isNaN(h)){ if(h>=5&&h<11)timeB.dawn++; else if(h<17)timeB.noon++; else if(h<21)timeB.dusk++; else timeB.night++; }
    var c=SPORT_CATEGORY[r.type]||'flex'; catB[c]++;
    mins+=parseInt(r.durationMin)||0; kcal+=parseFloat(r.cal)||0;
  });
  var TIME={dawn:{ico:'🌅',n:'晨练派'},noon:{ico:'☀️',n:'午后派'},dusk:{ico:'🌆',n:'傍晚派'},night:{ico:'🌙',n:'夜练派'}};
  var CAT={aerobic:{ico:'🏃',n:'有氧为主'},strength:{ico:'🏋️',n:'力量为主'},flex:{ico:'🧘',n:'柔韧为主'}};
  var tk=Object.keys(timeB).sort(function(a,b){return timeB[b]-timeB[a]})[0];
  var ck=Object.keys(catB).sort(function(a,b){return catB[b]-catB[a]})[0];
  if(!timeB[tk])tk=null;
  return {total:recs.length, hours:(Math.round(mins/6)/10), kcal:Math.round(kcal),
          timeKey:tk, timeName:tk?TIME[tk].n:'时段待观察', timeIco:tk?TIME[tk].ico:'🕐',
          catKey:ck, catName:CAT[ck]?CAT[ck].n:'柔韧为主', catIco:CAT[ck]?CAT[ck].ico:'🧘'};
}

/* —— ② 睡眠记录：入睡 + 起床 → 时长自动算，附睡眠标签 —— */
function saveHealthSleep(){
  var t=healthTodayRec(), ex=t.ex, today=t.today;
  var bed=($('#hsBed')||{}).value||'', wake=($('#hsWake')||{}).value||'';
  var sleep=0;
  if(bed&&wake){
    var a=bed.split(':').map(Number), b=wake.split(':').map(Number);
    var mins=(b[0]*60+b[1])-(a[0]*60+a[1]); if(mins<=0) mins+=24*60;
    sleep=Math.round(mins/60*10)/10;
  }
  var feel=(($('#hsSleepFeel')||{}).value||'').trim();
  var tags=(($('#hsSleepTags')||{}).value||'').trim();
  if(!sleep&&!feel&&!tags){ hgToast('填一下入睡 / 起床时间，或写点感想吧 😴'); return; }
  if(sleep){ex.sleep=sleep;ex.bedTime=bed;ex.wakeTime=wake;}

  if(tags)  ex.sleepTags=tags;
  /* 作息类型自动判定，随记录一起存下来（无需手工选择） */
  var stAuto=judgeSleepType(bed,wake);

  healthSnap(today,ex,'');
  tryEarnToday(); save();
  hgToast(sleep ? ('😴 已记录 '+sleep.toFixed(1)+' 小时 · '+sleepTipOf(sleep)) : '😴 睡眠感想已保存');
  render();
}

/* —— ③ 运动记录：时间 + 数据 + 感想 + 消耗（MET 标准算热量）—— */

  /* 运动偏好（时段 / 类型）由 judgeSportProfile() 依据历史记录自动判定，不再手工填写 */
  /* MET 表 —— 依据《成年人身体活动汇编》(Ainsworth et al., 2024 Adult Compendium)
     1 MET ≈ 1 kcal/(kg·h)，公式：千卡 = MET × 体重(kg) × 时长(小时) */
  var MET={walking:4.3,running:9.8,cycling:6.0,swimming:8.0,badminton:7.0,
           yoga:2.5,stretching:1.8,strength:5.0,hiit:10.0,rope:10.0,dance:5.5,housework:3.3,other:3.0};
  var cal=0, source='met';
  if(type&&mins>0){ cal=Math.round((MET[type]||3.0)*(DB.bodyWeight||50)*mins/60*10)/10; }
  else if(km>0){ cal=Math.round(km*(DB.bodyWeight||50)*1.036*10)/10; source='legacy-km'; }
  DB.sportRecords=DB.sportRecords||[];
  DB.sportRecords.push({date:today,start:start,end:end,type:type,intensity:'moderate',
                        durationMin:mins,steps:steps,km:km,feel:feel,cal:cal,source:source});
  if(km>=1||type) recordAchievement('运动');
  healthSnap(today,ex,'');
  tryEarnToday(); save();
  hgToast(cal>0 ? ('🔥 已记录 · 消耗约 '+cal+' kcal') : '🏃 运动已记录');
  render();
}

// 每日运动消耗图：柱状 + 圆点，纵轴 = 当天 kcal，零数据也画基线
function drawSportKcalChart(data){
  const c=$('#sportKcalChart');if(!c)return;
  const dpr=window.devicePixelRatio||1;
  const W=Math.max(240,(c.parentElement?c.parentElement.clientWidth:0)||(window.innerWidth||360)-80);
  const H=150, pl=26, pr=8, pt=14, pb=22;
  c.width=W*dpr;c.height=H*dpr;c.style.width=W+'px';c.style.height=H+'px';
  const ctx=c.getContext('2d');ctx.scale(dpr,dpr);ctx.clearRect(0,0,W,H);
  const innerW=W-pl-pr, innerH=H-pt-pb;
  const days=data&&data.length?data:(()=>{const arr=[];for(let i=0;i<7;i++){const d=new Date();d.setDate(d.getDate()-i);arr.unshift({date:d.toISOString().slice(0,10),kcal:0});}return arr;})();
  const vals=days.map(d=>d.kcal||0);
  const maxV=Math.max(10,...vals)*1.15;
  const n=days.length;
  const slot=innerW/n;
  // 基线
  ctx.strokeStyle='rgba(0,0,0,.06)';ctx.lineWidth=1;
  ctx.beginPath();ctx.moveTo(pl,pt);ctx.lineTo(W-pr,pt);ctx.stroke();
  // 柱 + 点
  vals.forEach((v,i)=>{
    const cx=pl+slot*i+slot/2;
    const h=maxV>0?(v/maxV)*innerH:0;
    const top=pt+innerH-h;
    const barW=Math.min(22,slot*0.5);
    // 渐变柱
    const grad=ctx.createLinearGradient(0,top,0,pt+innerH);
    grad.addColorStop(0,'rgba(208,165,152,.85)');grad.addColorStop(1,'rgba(208,165,152,.25)');
    ctx.fillStyle=grad;
    ctx.beginPath();
    const bx=cx-barW/2;
    const bh=Math.max(h,2);
    ctx.moveTo(bx,pt+innerH);ctx.lineTo(bx,top+bh);ctx.arc(bx+barW/2,top+bh,barW/2,Math.PI,0);ctx.lineTo(bx+barW,pt+innerH);ctx.closePath();ctx.fill();
    // 圆点
    ctx.fillStyle='#7d9eb0';
    ctx.beginPath();ctx.arc(cx,top,3.2,0,Math.PI*2);ctx.fill();
    // 数值
    if(v>0){
      ctx.fillStyle='#4a5a66';ctx.font='10px sans-serif';ctx.textAlign='center';
      ctx.fillText(Math.round(v),cx,top-5);
    }
    // 日期
    const lbl=days[i].date?days[i].date.slice(5):'';
    ctx.fillStyle='#9aa6b0';ctx.font='9px sans-serif';ctx.textAlign='center';
    ctx.fillText(lbl,cx,pt+innerH+14);
  });
  // 纵轴单位
  ctx.fillStyle='#9aa6b0';ctx.font='9px sans-serif';ctx.textAlign='left';
  ctx.fillText('kcal',2,pt+2);
}

function drawHealthChart(ws){
  const c=$('#healthChart');if(!c)return;
  const dpr=window.devicePixelRatio||1;
  const W=Math.max(240,(c.parentElement?c.parentElement.clientWidth:0)||(window.innerWidth||360)-80);
  const H=150;
  c.width=W*dpr;c.height=H*dpr;c.style.width=W+'px';c.style.height=H+'px';
  const ctx=c.getContext('2d');ctx.scale(dpr,dpr);
  const padL=30,padR=12,padT=16,padB=20;
  const vals=ws.map(w=>w.weight);
  let min=Math.min(...vals),max=Math.max(...vals);
  if(max-min<1){min-=0.5;max+=0.5;}
  const iw=W-padL-padR,ih=H-padT-padB;
  const stepX=iw/(ws.length-1);
  const yOf=v=>padT+ih-(v-min)/(max-min)*ih;
  ctx.strokeStyle=_cv('accent',.11);ctx.lineWidth=1;
  for(let g=0;g<=3;g++){const y=padT+ih*g/3;ctx.beginPath();ctx.moveTo(padL,y);ctx.lineTo(W-padR,y);ctx.stroke();}
  ctx.setLineDash([4,4]);ctx.strokeStyle=_cv('gold',.6);
  ctx.beginPath();ctx.moveTo(padL,yOf(ws[0].weight));ctx.lineTo(W-padR,yOf(ws[0].weight));ctx.stroke();ctx.setLineDash([]);
  ctx.strokeStyle='#7d9eb0';ctx.lineWidth=3;ctx.lineJoin='round';ctx.lineCap='round';
  ctx.beginPath();
  ws.forEach((w,i)=>{const x=padL+i*stepX,y=yOf(w.weight);if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y);});
  ctx.stroke();
  ws.forEach((w,i)=>{
    const x=padL+i*stepX,y=yOf(w.weight);
    ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(x,y,4,0,7);ctx.fill();
    ctx.fillStyle='#c0a16b';ctx.beginPath();ctx.arc(x,y,2.6,0,7);ctx.fill();
    ctx.fillStyle='#3a4250';ctx.font='10px sans-serif';
    ctx.textAlign=(i===0?'left':(i===ws.length-1?'right':'center'));
    ctx.fillText(w.weight.toFixed(1),x,i===0?y+14:y-8);
  });
}

function renderHonor(page){
  const book=DB.achievementBook||{};
  let wallHtml='';
  // —— 上半：成长图鉴（按标签归类，未解锁=?🔒，完全看不到名字，默认折叠）——
  for(const gk of Object.keys(ACHIEVEMENT_GROUPS)){
    const g=ACHIEVEMENT_GROUPS[gk];
    // 每个分组固定 9 格：真实任务 + 补齐占位（占位永远 🔒，绝不会自动点亮）
    const SLOTS=9;
    const taskList=[...g.tasks];
    while(taskList.length<SLOTS) taskList.push('待解锁·'+(taskList.length+1));
    const cells=taskList.slice(0,SLOTS).map(taskName=>{
      const data=ACHIEVEMENT_WORDS[gk]&&ACHIEVEMENT_WORDS[gk][taskName];
      const userData=bookOf(book,taskName);
      // 判定"是否真有进度"：必须实际打卡过（count>0 且 tier>0）
      // 未记录在册 / 无进度的任务 → 一律视为未解锁，绝不让空数据自动亮起
      const hasProgress = (userData.count>0) && (userData.tier>0);
      const maxTier = hasProgress ? Math.max(0,...(data?Object.keys(data).map(Number):[0])) : 0;
      if(hasProgress && userData.tier>=maxTier && maxTier>0){
        // 已毕业：亮金徽章 + 显示真实名字（已经解锁，不再神秘）
        return `<div class="badge-cell got" title="${taskName} · 已满级">
          <span class="badge-emoji">${badgeIcon(taskName)}</span>
          <span class="badge-name">${taskName}</span>
          <span class="badge-mark">👑</span>
        </div>`;
      } else if(hasProgress){
        // 进行中：显示当前阶级徽章 + 真实名字（已解锁的显示）
        return `<div class="badge-cell on" title="${taskName} · Lv.${userData.tier}">
          <span class="badge-emoji">${badgeIcon(taskName)}</span>
          <span class="badge-name">${taskName}</span>
          <span class="badge-mark">Lv.${userData.tier}</span>
        </div>`;
      } else {
        // 未解锁：完全隐藏——名字用 ? 代替，图标用 🔒，什么都看不到
        return `<div class="badge-cell locked" title="？？？（点亮后才会揭晓）">
          <span class="badge-emoji">🔒</span>
          <span class="badge-name">?</span>
          <span class="badge-mark">🔒</span>
        </div>`;
      }
    }).join('');
    // 本组已点亮数（tier>0 视为已点亮一枚）
    const groupUnlocked = taskList.slice(0, SLOTS).filter(t=>{
      const ud=bookOf(book,t); return ud.tier>0;
    }).length;
    const lockStatus = groupUnlocked>=SLOTS
      ? '<span class="bgs-lock">👑 全部解锁</span>'
      : `<span class="bgs-lock">🔒 ${groupUnlocked}/${SLOTS} 已解锁</span>`;
    // 用 <details> 默认折叠（与进阶之路一致），只有当有已解锁徽章时才默认展开
    const openAttr = groupUnlocked>0 ? ' open' : '';
    wallHtml+=`<details class="badge-group"${openAttr}>
      <summary class="badge-group-summary">
        <span class="bgs-arrow">▾</span>
        <span class="bgs-name">${g.name}</span>
        <span class="bgs-count">${groupUnlocked}/${SLOTS}</span>
        ${lockStatus}
      </summary>
      <div class="badge-grid">${cells}</div>
    </details>`;
  }
  // —— 下半：进阶之路（神秘化 + 主题序列 + 默认折叠 + 未解锁名称隐藏）——
  let treeHtml='';
  for(const q of DB.mainQuests){
    const p=DB.progression[q.id];if(!p)continue;
    // 确保序列已固定
    const seq=getQuestThemeSequence(q.id, q.name);
    const pLevel=p.level||1;
    const totalTiers=seq.length;
    // 根据规则 B：当前阶及之前显示名字，下一阶起用 ? 隐藏
    const tierCells=seq.map((emoji,i)=>{
      const reached=pLevel>i+1;   // 已完全解锁（不仅是当前阶）
      const cur=i===pLevel-1;      // 当前正在进阶的阶
      const isHidden = (i+1) > pLevel;  // 未来阶 = 完全隐藏
      const showName = !isHidden;  // 当前阶及之前都显示名字
      const nodeCls=['path-node'];
      if(reached) nodeCls.push('reached');
      if(cur) nodeCls.push('current');
      if(isHidden) nodeCls.push('hidden-node','locked');
      const displayEmoji = reached ? emoji : (cur ? emoji : '🔒');
      const displayName = showName ? ('Lv.'+(i+1)) : '?';
      const titleAttr = reached ? esc(emoji) : '？？？（继续打卡来解锁下一阶）';
      return '<span class="'+nodeCls.join(' ')+'" title="'+titleAttr+'"><span class="path-emoji">'+displayEmoji+'</span><span class="path-lv">Lv.'+(i+1)+'</span><span class="path-name">'+displayName+'</span></span>';
    }).join('<span class="path-arrow">→</span>');

    // 当前显示的真实阶级名（用序列 emoji 表达）
    const currentEmoji = seq[pLevel-1] || '🌱';
    const isFullyUnlocked = pLevel > totalTiers;
    const unlockedCount = Math.min(pLevel, totalTiers);
    const lockStatus = isFullyUnlocked
      ? '<span class="ps-lock">👑 全部解锁</span>'
      : `<span class="ps-lock">🔒 ${unlockedCount}/${totalTiers} 已解锁</span>`;

    treeHtml+='<details class="path-collapsible" id="path-'+q.id+'">'+
      '<summary class="path-summary">'+
        '<span class="ps-arrow">▾</span>'+
        '<span class="ps-name">🌱 '+esc(q.name)+'</span>'+
        '<span class="ps-count">当前 '+currentEmoji+'</span>'+
        lockStatus+
      '</summary>'+
      '<div class="path-body">'+
        '<div class="path-theme-hint">🧬 你的专属进化链在<b>第一次点亮时</b>就已选定，之后不会改变。<br>打卡越多，进化越深——但下一阶是什么？<b>不到那一刻你不会知道</b> 🔮</div>'+
        '<div class="path-row">'+tierCells+'</div>'+
        (isFullyUnlocked
          ? '<div style="font-size:13px;color:var(--gold);margin-top:10px;font-weight:700">🎉 进化完成！你已走完这条完整的成长之路。</div>'
          : '<div style="font-size:12px;color:var(--accent);margin-top:10px">累计 '+(p._count||0)+' 次打卡 · 再打卡 '+(Math.max(0,(pLevel>=totalTiers?0:1)))+' 次进阶</div>')+
      '</div>'+
    '</details>';
  }

  // —— 属性徽章（每条属性 = 一行：图标+名称 / 进度条(30·60·100 三档刻度) / 点数+档位）——
  DB.attrPoints=DB.attrPoints||{health:0,beauty:0,wisdom:0,will:0,charm:0};
  const ATTR_ORDER=['health','beauty','wisdom','will','charm'];
  const tierMax = Math.max.apply(null, ATTR_TIERS); // 100
  const rows = ATTR_ORDER.map(k=>{
    const def=ATTR_DEFS[k], val=DB.attrPoints[k]||0;
    const pct=Math.min(100, val/tierMax*100);
    let tierReached=0;
    ATTR_TIERS.forEach(function(th){ if(val>=th) tierReached++; });
    const dots = ATTR_TIERS.map(th=> val>=th?'●':'○').join('');
    const stateCls = tierReached>=3 ? 'got' : (tierReached>0 ? 'on' : '');
    return '<div class="attr-row '+stateCls+'">' +
      '<span class="a-name"><span class="ic">'+def.icon+'</span>'+def.name+'</span>' +
      '<span class="attr-track"><i style="width:'+pct+'%"></i>' +
        '<span class="a_tiers"><span></span><span></span><span></span></span>' +
      '</span>' +
      '<span class="a_val"><span class="pt">'+val+' pt</span><span class="dots" style="color:var(--gold)">'+dots+'</span></span>' +
    '</div>';
  }).join('');
  const attrWallHtml =
    '<div class="attr-summary">' + rows + '</div>' +
    '<div class="attr-foot">' +
      '<span>💰 余额 <span class="money">¥ '+fmtGold()+'</span></span>' +
      '<span class="sep">·</span>' +
      '<span>汇率 <span class="rate">¥'+attrPointRate().toFixed(2)+'/点</span>（总阶级和 '+totalStageSum()+' 阶）</span>' +
      '<span class="sep">·</span>' +
      '<span>累计 '+totalAttrPoints()+' pt，已计入存钱计划</span>' +
    '</div>';

  // 统计
  const totalUnlocked=Object.values(book).reduce((s,b)=>s+(b.tier||0),0);
  const totalPossible=Object.keys(ACHIEVEMENT_GROUPS).reduce((s,gk)=>s+9*7,0);
  page.innerHTML=`
  <div class="page-title">🏆 荣誉圣殿</div>
  <div class="page-desc">徽章只在达成阈值后点亮，<span style="color:var(--good)">已解锁阶级：${totalUnlocked} / ${totalPossible}</span> </div>

  <div class="card">
    <h3>🧩 成长图鉴</h3>
    <div class="page-desc" style="margin-bottom:12px">每坚持一点点，就离徽章更近一步~🔮点开下面的卡片，看看你已经收集了多少 </div>
    ${wallHtml}
  </div>
  <div class="card">
    <h3>💫 属性徽章</h3>
    <div class="page-desc" style="margin-bottom:12px">🥳每天积累一点点，解锁专属彩蛋~</div>
    ${attrWallHtml}
  </div>

  <div class="card">
    <h3>🌳 进阶之路</h3>
    <div class="page-desc" style="margin-bottom:12px">从发芽到结果，万物生长，自然发展🪄点开下面的卡片，就能看到你的成长之路 </div>
    ${treeHtml||'<div class="empty">还没有主线任务，去「🎯 主线任务」添加吧。</div>'}
  </div>`;
}

    // —— 每个 Tab 独立管理自己的内容，板块分开不干涉 ——
    var manage=cur[2]();

/* ════════════════════════════════════════════════════════════════
   📋 习惯记录 · 按日期分组 + 折叠 + 跨天封存
   - 每条记录自动带完整时间戳（YYYY-MM-DD HH:MM）
   - 当天写的 = 可编辑/可删除；跨天后自动封存 → 🔒 只读
   - 按日期分组，默认折叠（点击展开），新的在上面
════════════════════════════════════════════════════════════════ */
// 获取某条记录所属的日期（优先用 _date 字段，兼容旧数据）
function logDate(l){return l._date||todayStr()}
// 判断某条记录是否已封存（日期 < 今天）
function isLogSealed(l){return logDate(l)<todayStr()}
// 按日期分组，返回 [{date, logs:[...]}]，日期从新到旧
function groupLogsByDate(logs){
  var groups={};
  for(var i=0;i<logs.length;i++){
    var d=logDate(logs[i]);
    if(!groups[d])groups[d]=[];
    groups[d].push(logs[i]);
  }
  var dates=Object.keys(groups).sort(function(a,b){return a>b?-1:1}); // 从新到旧
  return dates.map(function(d){
    // 每组内也从新到旧
    var arr=groups[d].slice().sort(function(a,b){
      var ta=(a.time||'00:00'), tb=(b.time||'00:00');
      return ta>tb?-1:1;
    });
    return {date:d, logs:arr};
  });
}

  const autoN=DB.mainQuests.filter(x=>x.auto).length;

  DB.mainQuests=defaultDB().mainQuests.map((q,idx)=>({...q,id:'M'+(idx+1)}));
  DB.sideQuests=defaultDB().sideQuests.map((q,idx)=>({...q,count:0,locked:false}));
  DB.extraFields=defaultDB().extraFields.map(f=>({...f,logs:[]}));
  // 进阶进度也清零（_seq 不保留 → 新赛季首次打卡时重新随机选序列）
  DB.progression={};
  for(const q of DB.mainQuests){
    DB.progression[q.id]={level:1, _count:0};
  }
  // —— ②b 属性点与徽章同步清零：旧值已封存进 cycleArchive，新赛季从零点亮 ——
  DB.attrPoints={health:0,beauty:0,wisdom:0,will:0,charm:0};

  // —— ③ 清空当前周期 records（已归档，不丢）——
  if(cycleStart){
    cycleDays.forEach(d=>{delete DB.records[d]});
  }

  // —— ④ 重置周期状态 ——
  DB.successfulCycles=(DB.successfulCycles||0)+1;
  DB.cycle={active:false,length:10,dayInCycle:0,startDate:null,mainSnap:null,sideSnap:null,extraSnap:null};

  // —— ⑤ 迁移进阶之路：标记赛季重置（成就书保留）
  DB.correctionLog.push({date:todayStr(),action:'赛季重置',orig:'Cycle '+cycleNo+' 已封存归档',new:'新赛季从零开始'});

  save();render();
  alert('✅ 第 '+cycleNo+' 周期已封存归档！\n\n📜 旧记录可在「时光回溯」查看\n🎮 新赛季已开始，主线/支线/碎片全部清空，从零出发 🥂');
}

/* ---- 进阶 ---- */
function checkProgression(){
  const prog=DB.progression;
  for(const q of DB.mainQuests){
    const p=prog[q.id];if(!p)continue;
    const marks=Object.values(today().mainMarks||{});
    if(marks.includes('✅')||marks.includes('⭐')||marks.includes('❤️')){
      p._count=(p._count||0)+1;
      const th=[1,3,7,15,30,60,100];
      const oldLevel=p.level||1;
      for(let i=0;i<7;i++){if(p._count>=th[i])p.level=i+1}
      // —— 首次进阶（level 1→2）时，固定这条主线的进化链序列 ——
      if(p.level>oldLevel && oldLevel===1){
        getQuestThemeSequence(q.id, q.name);  // 内部会随机选序列并写入 p._seq
        save();  // 立即保存，确保序列不丢失
      }
    }
  }
}

/* ---- 📅 周期打卡总览（矩阵：行=任务 列=天数）
   设计（格子打卡法 · 研究报告方案）：
   · 主线：1 天 1 格，表情标识 ✅=成功 / ⚠️=失败 / ·=未打卡
   · 作息(早睡/早起) 作为 M1/M2 置顶，成功绿、失败红，自动判定且不影响赚钱
   · 支线/碎片：1 天 1 格 = 当日次数(整数)，行尾显示「合计 / 目标」
   · 今日小结只显示一次体重，且明确标注"来自健康记录"，杜绝重复
   · 表头「主线 ＼ 天」改为可读的「🎯 主线 · 天」，—— 明确是「完成天数」 ---- */
function renderMatrix(page){
  const days=cycleDays();
  const locked=isLocked();
  // —— 作息(M1/M2 置顶) + 用户主线(M3 起)，显示名绝不出现 __rise_early__ 之类内部键 ——
  const autoQs=DB.mainQuests.filter(q=>q.auto);
  const userQs=DB.mainQuests.filter(q=>!q.auto);
  const allMain=[...autoQs,...userQs];

  /* ========== 🎯 主线表格 ========== */
  const thead=`<tr><th class="th-task">🎯 主线 · 天<br><span style="font-size:9px;font-weight:400;color:var(--ink-soft)">每格=当日成败</span></th>`+
    days.map((d,idx)=>`<th>D${idx+1}<br><span style="font-size:9px;font-weight:400;color:var(--ink-soft)">${d.slice(5)}</span></th>`).join('')+
    `<th class="th-total">合计</th></tr>`;
  const tbody=allMain.map((q,idx)=>{
    const dispNo=q.auto?('M'+(idx+1)):'M'+(idx+1);   // 作息占 M1/M2，用户主线连续不跳号

      const rec=DB.records[d];

      const cls=m==='⚠️'?'fail':(m?'ok':'miss');
      return `<td class="cell-mark ${cls}">${m||'·'}</td>`;
    }).join('');
    const total=days.reduce((a,d)=>{const v=(DB.records[d]||{}).mainMarks?.[q.id];return a+(v&&v!=='⚠️'?1:0);},0);
    return `<tr class="${q.auto?'auto-row':''}"><td class="cell-task">${dispNo} · ${dispName}</td>${cells}<td class="cell-total">${total}</td></tr>`;
  }).join('') || '<tr><td class="cell-task">暂无主线，去「🎮 任务面板」添加</td></tr>';

  /* ========== 🌱 支线表格（次数 + 合计/目标）========== */
  const sideRows=DB.sideQuests.length?DB.sideQuests.map((s,i)=>{
    const cells=days.map(d=>{
      const n=(s.history||[]).filter(h=>h.date===d).length;
      return `<td class="cell-mark ${n>0?'has-count':'miss'}" title="${n>0?n+' 次':'未打卡'}">${n>0?n:'·'}</td>`;
    }).join('');
    const total=(s.history||[]).length;
    const target=s.target||1;
    return `<tr><td class="cell-task">S${i+1} · ${esc(s.name)}<small style="color:var(--ink-soft)"> · 目标 ${target}</small></td>${cells}<td class="cell-total">${total}<small>/${target}</small></td></tr>`;
  }).join(''):'<tr><td class="cell-task">还没有支线，去「🌱 每日支线」添加</td></tr>';

  /* ========== 📋 碎片表格（次数 + 合计）========== */
  const fragRows=DB.extraFields.length?DB.extraFields.map((f,i)=>{
    const cells=days.map(d=>{
      const n=(f.logs||[]).filter(l=>l._date===d).length;
      return `<td class="cell-mark ${n>0?'has-count':'miss'}">${n>0?n:'·'}</td>`;
    }).join('');
    const total=(f.logs||[]).length;
    return `<tr><td class="cell-task">${esc(f.name)}<small style="color:var(--ink-soft)"> · 一天多次</small></td>${cells}<td class="cell-total">${total}</td></tr>`;
  }).join(''):'<tr><td class="cell-task">还没有碎片字段，去「📋 习惯记录」添加</td></tr>';

  /* ========== 📆 今日小结（体重只显示一次，来源=健康记录）========== */
  const td=today();
  const tdMM=td.mainMarks||{};
  // 主线完成数 = 成功格数（作息也算，因作息不影响赚钱已在结算时中性化）
  const mainDone=allMain.reduce((a,q)=>a+((tdMM[q.id]&&tdMM[q.id]!=='⚠️')?1:0),0);
  const mainTotal=allMain.length;
  const sideTotal=DB.sideQuests.reduce((a,s)=>a+(s.history||[]).filter(h=>h.date===todayStr()).length,0);
  const fragTotal=DB.extraFields.reduce((a,f)=>a+fragTodayCount(f),0);
  const todayAchv=(td.timeline||[]).filter(r=>r.achievement).length;
  // 体重：只从健康记录读一次
  const todayWeight=(()=>{const ex=(td.extra&&!Array.isArray(td.extra))?td.extra:{};return ex.weight||td.weight||null;})();
  // —— 里程碑：健康成就（三域合计，取自成就引擎）——
  const HACHV_T=(function(){try{var P=hachvProgress();return {got:P.byDomain.sport.got+P.byDomain.weight.got+P.byDomain.sleep.got,
    total:P.byDomain.sport.total+P.byDomain.weight.total+P.byDomain.sleep.total};}catch(e){return {got:0,total:0};}})();
  const gotMilestones=HACHV_T.got, milestones={length:HACHV_T.total};
  // 成就项（里程碑并入成就行，避免重复）
  const achvTail=gotMilestones>0?` · 🏆 里程碑 <b>${gotMilestones}/${milestones.length}</b>`:'';
  const summaryLine=[
    `主线 <b>${mainDone}/${mainTotal}</b>`,
    `支线 <b>${sideTotal}</b> 次`,
    `碎片 <b>${fragTotal}</b> 次`,
    `成就 <b>+${todayAchv}</b>${achvTail}`
  ].join(' · ');
  // 作息小方块（只含 早起/早睡/体重，每个一行清晰，加体重）
  const autoBlocks=autoQs.length?autoQs.map(q=>{
    const m=tdMM[q.id];const ok=m==='✅',fail=m==='⚠️';
    const label=q.id==='__rise_early__'||q.name.includes('早起')?'☀️早起':(q.name.includes('早睡')||q.name.includes('睡觉')?'🛏️早睡':'⚖️'+q.name);
    return `<span class="ms-chip ${ok?'ok':(fail?'fail':'wait')}">${label}：${ok?'成功':(fail?'失败':'未记')}</span>`;
  }).join(''):'';

  const todaySummary=`
  <div class="card matrix-summary ms-v2">
    <div class="ms-top">
      <span class="ms-title">📆 今日小结 · ${todayStr().slice(5)}</span>
      <span class="ms-rate">${mainTotal>0?Math.round(mainDone/mainTotal*100)+'%':'—'}</span>
    </div>
    <div class="ms-sub">（每天一点点，继续努力 🌞）</div>
    <div class="ms-line">${summaryLine}</div>
    <div class="ms-chips">${autoBlocks}</div>
  </div>`;

  page.innerHTML=`
  <div class="page-title">📅 周期打卡总览</div>
  <div class="page-desc"><b>主线</b>用（✅成功 / ⚠️失败 / ·未打卡）记成败，<b>支线·碎片</b>记当日次数，行尾「合计」看总量。「📆 今日小结」每天结算。</div>
  ${todaySummary}

  </div>

  <div class="card"><h3>🌱 支线打卡 · 次数</h3>

/* ════════════════════════════════════════════════════════════════
   📜 时光回溯（含自动奖励计算 · 分区样式）
════════════════════════════════════════════════════════════════ */
function runCycleSummary(){
  const days=Object.keys(DB.records).sort();
  if(!days.length)return $('#cycleResult').innerHTML='<div class="empty">暂无数据</div>';
  let total=0,done=0;
  for(const d of days.slice(-10)){
    const rec=DB.records[d];
    for(const q of DB.mainQuests){total++;if((rec.mainMarks||{})[q.id]&&(rec.mainMarks[q.id]!=='⚠️'))done++}
  }
  const rate=total?Math.round(done/total*100):0;
  let grade='C',gcol='r',rewardMoney=0,rewardPhysical='无';
  if(rate>=80){grade='S';gcol='g';rewardMoney=DB.rewardRules.r3.money;rewardPhysical=DB.rewardRules.r3.physical;}
  else if(rate>=60){grade='A';gcol='b';rewardMoney=DB.rewardRules.r2.money;rewardPhysical=DB.rewardRules.r2.physical;}
  else if(rate>=40){grade='B';gcol='b';rewardMoney=DB.rewardRules.r1.money;rewardPhysical=DB.rewardRules.r1.physical;}
  if(rewardMoney>0){
    DB.savings+=rewardMoney;
    DB.correctionLog.push({date:todayStr(),action:'周期主线奖励自动发放',orig:`完成率${rate}%`,new:`+¥${rewardMoney}`});
  }
  const promo=DB.sideQuests.filter(s=>s.count>=10).map(s=>s.name).join('、')||'无';
  const ws=days.map(d=>DB.records[d].weight).filter(v=>v!=null);
  const delta=ws.length>=2?(ws[ws.length-1]-ws[0]):null;
  ensureGiftPool();
  const wTiers=[DB.weightReward.t1,DB.weightReward.t2,DB.weightReward.t3].slice().sort((a,b)=>b.loss-a.loss);
  let weightRewardMsg='无（未达奖励阈值）';
  if(delta!==null){
    const lost=-delta;
    let granted=null;
    for(const t of wTiers){if(lost>=t.loss){granted=t;break}}
    if(granted){
      const moneyMatch=String(granted.gift).match(/¥(\d+)/);
      const add=moneyMatch?parseInt(moneyMatch[1]):0;
      if(add>0){DB._cycleReward=(DB._cycleReward||0)+add;}
      if(add>0){DB.savings+=add}
      weightRewardMsg=`减${lost.toFixed(1)}斤 → ${granted.gift}`;

function drawWeightChart(weights,allDays){
  requestAnimationFrame(()=>{
    const c=$('#weightChart');if(!c)return;
    const ctx=c.getContext('2d');
    const W=c.width=c.parentElement.clientWidth-28, H=200;
    c.height=H;
    const vals=weights.map(w=>w.w);
    const min=Math.min(...vals)-2, max=Math.max(...vals)+2;
    const step=W/(weights.length-1);
    ctx.strokeStyle='#7d9eb0';ctx.lineWidth=3;
    ctx.beginPath();
    weights.forEach((w,i)=>{const x=i*step,y=H-((w.w-min)/(max-min))* (H-30)-15;if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y)});
    ctx.stroke();
    weights.forEach((w,i)=>{
      const x=i*step,y=H-((w.w-min)/(max-min))* (H-30)-15;
      const rec=DB.records[w.date];
      const food=(rec.extra||[]).find(e=>e.key==='food')?.value||rec.food||'';
      ctx.fillStyle=food.length>0?'#c08a7a':'#b8c4cf';
      ctx.beginPath();ctx.arc(x,y,6,0,7);ctx.fill();
      ctx.fillStyle='#3a4250';ctx.font='11px sans-serif';
      ctx.fillText(w.w,x-8,y-10);
    });
  });
}
